*{margin:0;padding:0;box-sizing:border-box;}

.top-r{display:flex;gap:6px;}.cbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 11px;border-radius:6px;cursor:pointer;font-size:12px;font-family:var(--fu);transition:all .15s;white-space:nowrap;}.cbtn:hover{background:rgba(255,255,255,.22);}.cbtn.on{background:var(--acc);border-color:var(--acc);}.cbtn:focus-visible,.lbtn:focus-visible,.sb-btn:focus-visible,.filter-btn:focus-visible,.abtn:focus-visible,.xbtn:focus-visible,.burg:focus-visible{outline:2px solid #fff;outline-offset:2px;}
.lay{display:flex;margin-top:52px;height:calc(100vh - 52px);}
.sb{width:258px;flex-shrink:0;background:var(--sb);overflow-y:auto;overflow-x:hidden;transition:width .22s;scrollbar-width:thin;scrollbar-color:var(--sba) var(--sb);}
.sb.col{width:0;}.sb-book{padding:18px 16px 12px;border-bottom:1px solid rgba(255,255,255,.07);}
.sb-th{font-family:var(--ft);font-size:26px;font-weight:700;color:var(--sbti);}.sb-zh{font-family:var(--fz);font-size:10px;color:var(--sbt);margin-top:3px;opacity:.75;}.sb-ct{font-size:10px;color:var(--acc);font-weight:700;margin-top:8px;}.sb-track{height:4px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin-top:7px;}.sb-track-fill{height:100%;width:0;background:var(--acc);border-radius:inherit;transition:width .25s ease;}.sb-actions,.sb-filter{display:flex;gap:6px;margin-top:9px;}.sb-btn,.filter-btn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--sbt);font-family:var(--fz);font-size:10px;line-height:1;padding:6px 8px;border-radius:6px;cursor:pointer;transition:all .15s;}.sb-btn:hover,.filter-btn:hover,.filter-btn.on{background:var(--sba);border-color:rgba(255,255,255,.32);color:var(--sbti);}.sb-btn{color:rgba(255,255,255,.65);}.sb-save-note{font-family:var(--fz);font-size:9px;line-height:1.45;color:rgba(181,212,192,.5);margin-top:8px;}.nit-b{min-width:34px;}

.nit{display:flex;align-items:center;gap:9px;padding:8px 16px;cursor:pointer;color:var(--sbt);font-size:12.5px;transition:background .12s;border-left:3px solid transparent;user-select:none;}.nit:hover{background:var(--sbh);}.nit.act{background:var(--sba);border-left-color:var(--acc);color:var(--sbti);}

.qcq{flex:1;min-width:0;}.qcth{font-family:var(--ft);font-size:20px;font-weight:500;color:var(--thai);line-height:1.4;}
.qcro{font-family:var(--ft);font-size:12.5px;color:var(--rom);font-style:italic;margin-top:2px;}.qczh{font-family:var(--fz);font-size:13px;color:var(--tm);margin-top:3px;}

.abtn{width:33px;height:33px;border-radius:50%;border:none;cursor:pointer;background:var(--gd);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;flex-shrink:0;}.abtn:hover{background:var(--gm);transform:scale(1.06);}.abtn.pl{background:var(--acc);animation:pulse 1s infinite;}
.xbtn{width:27px;height:27px;border-radius:50%;border:1px solid var(--bd);background:transparent;cursor:pointer;color:var(--mu);display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .2s;}.xbtn:hover{background:var(--bdl);}.qc.exp .xbtn{transform:rotate(180deg);}
.qcb{max-height:0;overflow:hidden;transition:max-height .32s ease;}.qc.exp .qcb{max-height:900px;}.qcbi{padding:0 15px 15px;}.div{height:1px;background:var(--bdl);margin:0 -15px 14px;}
.ans{display:flex;align-items:flex-start;gap:11px;padding:9px 11px;border-radius:8px;background:rgba(61,43,36,.045);margin-bottom:8px;}
.anl{flex-shrink:0;width:23px;height:23px;border-radius:50%;background:var(--gd);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:2px;}
.ant{flex:1;min-width:0;}.anth{font-family:var(--ft);font-size:18px;font-weight:500;color:var(--thai);line-height:1.4;}
.anro{font-family:var(--ft);font-size:11.5px;color:var(--rom);font-style:italic;margin-top:2px;}.anzh{font-family:var(--fz);font-size:12px;color:var(--mu);margin-top:3px;}
.subs{margin-top:11px;}.sub-lbl{font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px;}
.sub-chips{display:flex;flex-wrap:wrap;gap:5px;}.schip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:18px;cursor:pointer;background:transparent;border:1px solid var(--bd);transition:all .15s;}.schip:hover{background:var(--accl);border-color:var(--acc);}
.sch-th{font-family:var(--ft);color:var(--thai);font-size:14px;}.sch-zh{font-family:var(--fz);color:var(--mu);font-size:11px;}
.fu{margin-top:13px;padding:9px 11px;border-radius:8px;background:rgba(200,154,58,.08);border-left:3px solid var(--acc);}
.fu-lbl{font-size:9px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;}.fu-row{display:flex;align-items:flex-start;gap:9px;}.fu-tx{flex:1;}
.futh{font-family:var(--ft);font-size:17px;color:var(--thai);}.furo{font-family:var(--ft);font-size:11.5px;color:var(--rom);font-style:italic;margin-top:2px;}.fuzh{font-family:var(--fz);font-size:12px;color:var(--mu);margin-top:3px;}

.plist{display:flex;flex-direction:column;gap:7px;}.prow{display:flex;align-items:flex-start;gap:11px;padding:9px 13px;border-radius:8px;background:var(--bgc);border:1px solid var(--bdl);}

.ptx{flex:1;}.pth{font-family:var(--ft);font-size:17px;color:var(--thai);line-height:1.4;}.prom{font-family:var(--ft);font-size:11.5px;color:var(--rom);font-style:italic;margin-top:2px;}.pzh{font-family:var(--fz);font-size:12px;color:var(--mu);margin-top:3px;}

.fth{font-family:var(--ft);font-size:16px;color:var(--thai);font-weight:500;}.fro{font-family:var(--ft);font-size:10.5px;color:var(--rom);font-style:italic;margin-top:2px;}.fzh{font-family:var(--fz);font-size:11.5px;color:var(--mu);margin-top:3px;}

.pton{font-family:var(--ft);font-size:26px;color:var(--thai);font-weight:600;}.ptro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:2px;}.ptzh{font-family:var(--fz);font-size:12.5px;font-weight:600;color:var(--t);margin-top:4px;}.ptuse{font-family:var(--fz);font-size:10.5px;color:var(--mu);margin-top:2px;line-height:1.4;}

.par-zh{font-family:var(--fz);font-size:13px;font-weight:600;color:var(--t);}.par-ex{font-family:var(--ft);font-size:13px;color:var(--mu);margin-top:2px;}

.sth{font-family:var(--ft);font-size:19px;color:var(--thai);font-weight:600;}.sro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:2px;}.szh{font-family:var(--fz);font-size:12.5px;color:var(--t);font-weight:500;margin-top:4px;}.sex{font-family:var(--fz);font-size:11px;color:var(--mu);margin-top:2px;}

.ch-th{font-family:var(--ft);font-size:17px;color:var(--thai);}.ch-zh{font-family:var(--fz);font-size:11px;color:var(--mu);margin-top:2px;}

/* ===== Extended handout styles v2 (vocab-driven, QA-50 architecture) ===== */
.favbtn{display:flex;align-items:center;gap:5px;padding:5px 13px;border-radius:18px;border:1px solid var(--bd);background:transparent;font-size:11px;color:var(--mu);cursor:pointer;font-family:var(--fz);transition:all .15s;margin-right:6px;}

.favbtn.on{background:var(--acc);border-color:var(--acc);color:#fff;}
.cft{justify-content:space-between!important;}

@keyframes flashHi{0%{box-shadow:0 0 0 5px rgba(200,154,58,.55);}100%{box-shadow:0 0 0 0 rgba(200,154,58,0);}}
.flash{animation:flashHi 1.4s ease;border-radius:10px;}
.empty-fav{padding:16px;text-align:center;color:var(--mu);font-family:var(--fz);font-size:12.5px;background:var(--bgc);border:1px dashed var(--bd);border-radius:10px;}

/* search */
.stop-wrap{position:relative;flex:1;max-width:340px;margin:0 10px;}
.sinput{width:100%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:7px 30px 7px 11px;font-size:12.5px;font-family:var(--fz);outline:none;}
.sinput::placeholder{color:rgba(255,255,255,.5);}
.sinput:focus{background:rgba(255,255,255,.18);}
.sclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:13px;display:none;}
.sclear.show{display:block;}
.sres-hd{font-family:var(--fz);font-size:13px;color:var(--mu);margin:0 0 12px;padding-bottom:10px;border-bottom:2px solid var(--bd);}
.sres-list{display:flex;flex-direction:column;gap:8px;}
.sres-item{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-radius:10px;background:var(--bgc);border:1px solid var(--bdl);cursor:pointer;transition:all .15s;}
.sres-item:hover{border-color:var(--gl);box-shadow:0 2px 8px rgba(0,0,0,.06);}
.sres-tag{flex-shrink:0;font-size:9.5px;font-weight:700;color:var(--acc);background:var(--accl);border:1px solid rgba(200,154,58,.3);padding:3px 8px;border-radius:20px;white-space:nowrap;margin-top:2px;}
.sres-b{flex:1;min-width:0;}
.sres-th{font-family:var(--ft);font-size:16px;color:var(--thai);}
.sres-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:1px;}
.sres-zh{font-family:var(--fz);font-size:12px;color:var(--mu);margin-top:2px;}
.hid-view{display:none!important;}

/* compare */
.cmp-card{background:var(--bgc);border:1px solid var(--bdl);border-radius:10px;padding:15px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.cmp-title{font-family:var(--fz);font-size:14.5px;font-weight:700;color:var(--t);margin:0 0 5px;line-height:1.55;}
.cmp-intro{font-family:var(--fz);font-size:12px;color:var(--mu);line-height:1.6;margin-bottom:4px;}
.cmp-list{display:block;}
.cmp-row{display:grid;grid-template-columns:minmax(125px,175px) minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--bdl);align-items:start;}
.cmp-list .cmp-row:first-child{border-top:none;}
.cmp-term{min-width:0;}
.cmp-pat{display:flex;align-items:flex-start;gap:5px;font-family:var(--ft);font-size:16px;line-height:1.4;color:var(--acc);font-weight:700;}
.cmp-pat .abtn{margin-top:0;}
.cmp-ex-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:2px;overflow-wrap:anywhere;}
.cmp-ex-en,.cmp-ex-zh{font-family:var(--fz);font-size:11.5px;color:var(--mu);margin-top:3px;line-height:1.5;}
.cmp-body{min-width:0;}
.cmp-mean{font-family:var(--fz);font-size:12.5px;color:var(--tm);line-height:1.65;}
.cmp-ex{margin-top:7px;padding:8px 10px;border-radius:8px;background:rgba(65,40,47,.045);}
.cmp-ex-line{display:flex;align-items:flex-start;gap:8px;}
.cmp-ex-tx{flex:1;min-width:0;}
.cmp-ex-th{font-family:var(--ft);font-size:15px;color:var(--thai);line-height:1.45;}
.cmp-tip{margin-top:10px;padding:9px 11px;border-radius:8px;background:var(--bgh);border:1px solid var(--bdl);font-family:var(--fz);font-size:12px;color:var(--tm);line-height:1.65;}
@media(max-width:640px){.cmp-row{grid-template-columns:1fr;gap:7px;padding:11px 0}.cmp-pat{font-size:16px}.cmp-ex{margin-top:6px}}

/* mistakes */
.mis-card{background:var(--bgc);border:1px solid var(--bdl);border-radius:10px;padding:15px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.mis-title{font-family:var(--fz);font-size:14.5px;font-weight:700;color:var(--t);margin-bottom:10px;}
.mis-box{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:8px;margin-bottom:8px;}
.mis-wrong{background:rgba(200,60,50,.07);border:1px solid rgba(200,60,50,.18);}
.mis-better{background:rgba(192,138,62,.1);border:1px solid rgba(192,138,62,.24);}
.mis-lbl{flex-shrink:0;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:3px 7px;border-radius:5px;margin-top:2px;}
.mis-wrong .mis-lbl{background:#c0392b;color:#fff;}
.mis-better .mis-lbl{background:var(--gl);color:#fff;}
.mis-tx{flex:1;}
.mis-th{font-family:var(--ft);font-size:15px;color:var(--thai);}
.mis-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:1px;}
.mis-en{font-family:var(--fz);font-size:11.5px;color:var(--mu);margin-top:2px;}
.mis-why{font-family:var(--fz);font-size:12.5px;color:var(--tm);line-height:1.65;padding:9px 11px;border-radius:8px;background:#f8f5f1;border:1px solid var(--bdl);}

/* structures */
.str-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
.str-card{background:var(--bgc);border:1px solid var(--bdl);border-left:4px solid var(--gl);border-radius:10px;padding:13px 14px;}
.str-title{font-family:var(--fz);font-size:13.5px;font-weight:700;color:var(--t);}
.str-mean{font-family:var(--fz);font-size:11.5px;color:var(--mu);margin-top:5px;line-height:1.55;}
.str-ex{margin-top:9px;padding:8px 10px;border-radius:8px;background:rgba(61,43,36,.045);}
.str-th{font-family:var(--ft);font-size:15px;color:var(--thai);}
.str-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:1px;}
.str-en{font-family:var(--fz);font-size:11px;color:var(--mu);margin-top:2px;}

/* dialogues */
.dlg-card{background:var(--bgc);border:1px solid var(--bdl);border-radius:10px;padding:15px;margin-bottom:12px;}
.dlg-title{font-family:var(--fz);font-size:14.5px;font-weight:700;color:var(--t);margin-bottom:11px;}
.dlg-thread{display:flex;flex-direction:column;gap:9px;}
.dlg-row{display:flex;width:100%;}
.dlg-row.l{justify-content:flex-start;}.dlg-row.r{justify-content:flex-end;}
.dlg-bub{max-width:76%;border:1px solid var(--bdl);border-radius:14px;padding:9px 12px;background:#fff;}
.dlg-row.l .dlg-bub{border-top-left-radius:4px;background:#f6faf7;}
.dlg-row.r .dlg-bub{border-top-right-radius:4px;background:#fbf8f0;}
.dlg-spk{font-size:10px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.dlg-th{font-family:var(--ft);font-size:15px;color:var(--thai);}
.dlg-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:1px;}
.dlg-en{font-family:var(--fz);font-size:11.5px;color:var(--mu);margin-top:2px;}

/* sentence groups */
.sen-group{margin-bottom:16px;}
.sen-scene{display:inline-flex;font-size:11px;font-weight:700;color:#fff;background:var(--gm);padding:4px 11px;border-radius:20px;margin-bottom:9px;}
.sen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;}
.sen-item{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:8px;background:var(--bgc);border:1px solid var(--bdl);}
.sen-th{font-family:var(--ft);font-size:14.5px;color:var(--thai);}
.sen-ro{font-family:var(--ft);font-size:10.5px;color:var(--rom);font-style:italic;margin-top:1px;}
.sen-en{font-family:var(--fu);font-size:11px;color:#6b7280;margin-top:2px;}
.qcen,.anen,.sres-en,.mis-en,.str-en,.dlg-en,.cmp-ex-en{font-family:var(--fu);color:#6b7280;}
.qczh,.anzh,.sres-zh,.mis-zh,.str-zh,.dlg-zh,.sen-zh,.cmp-ex-zh{font-family:var(--fz);color:var(--tm);margin-top:3px;line-height:1.55;}
.qcen{font-size:12px;margin-top:3px}.qczh{font-size:13px}.anen,.anzh,.mis-zh,.str-zh,.dlg-zh,.sen-zh,.sres-en,.sres-zh{font-size:11.5px}

/* practice */
.prc-card{background:var(--bgc);border:1px solid var(--bdl);border-radius:10px;padding:13px 14px;margin-bottom:9px;}
.prc-title{font-size:10px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.6px;}
.prc-prompt{font-family:var(--fz);font-size:13.5px;color:var(--t);margin-top:5px;line-height:1.6;}
.prc-ans-wrap{margin-top:9px;}
.prc-ans-btn{font-family:var(--fz);font-size:11.5px;color:var(--gm);background:none;border:1px solid var(--bd);border-radius:16px;padding:5px 12px;cursor:pointer;}
.prc-ans-btn:hover{border-color:var(--gl);}
.prc-ans{display:none;margin-top:9px;padding:9px 11px;border-radius:8px;background:rgba(192,138,62,.09);border:1px solid rgba(192,138,62,.22);}
.prc-ans.show{display:block;}
.prc-ans .str-th{font-size:14.5px;}

@media(max-width:920px){
 .stop-wrap{display:none;}
 .cmp-row{grid-template-columns:1fr;}
 .str-grid,.sen-grid{grid-template-columns:1fr;}
}

<script type="application/json" id="jd">{"title":"Thai Daily Notes","subtitle":"2026-07-03","vocab":[{"th":"แบบว่า","ro":"bɛ̀ɛp wâa","en":"like...; I mean...","cat":"Local usage","note":"口語填充詞，用來邊想邊說、緩衝或加強主觀感受；不需要逐字翻譯成「樣式」。","ex":["แบบว่า ฉันยังตัดสินใจไม่ได้","bɛ̀ɛp wâa chǎn yang dtàt-sǐn-jai mâi dâai","Like, I still cannot decide.","就是……我還沒辦法決定。"],"i":"V001","zh":"就是……／有點像……／我是說……"},{"th":"ตามนี้","ro":"dtaam níi","en":"as discussed; according to this","cat":"Review","note":"用在已經談好的安排、條件或清單；核心是「照剛剛說好的內容」。","ex":["ถ้าไม่มีอะไรเปลี่ยน เราเอาตามนี้นะ","thâa mâi mii à-rai bplìian, rao ao dtaam níi ná","If nothing changes, let us go with this.","如果沒有變動，我們就照這樣進行喔。"],"i":"V002","zh":"就照這樣／依照談好的內容"},{"th":"เป็นอันว่า","ro":"bpen an wâa","en":"so it is settled that","cat":"Local usage","note":"用來把討論收束成結論；比一般聊天稍完整，常接已確認的安排。","ex":["เป็นอันว่า ตกลงตามนี้นะคะ","bpen an wâa dtòk-long dtaam níi ná khá","So it is settled that we will go with this.","那就這麼決定，照這樣進行喔。"],"i":"V003","zh":"那就算是定案了／結論就是"},{"th":"ที่จะได้","ro":"thîi jà dâai","en":"to be able to; to get the chance to","cat":"Grammar Core","note":"在期待或機會語境裡，表示「終於可以／有機會做到」，不只是單純的目的。","ex":["ฉันตั้งตารอที่จะได้ไปกรุงเทพฯ","chǎn dtâng-dtaa rɔɔ thîi jà dâai bpai grung-thêep","I am really looking forward to getting to go to Bangkok.","我真的很期待去曼谷。"],"i":"V004","zh":"終於可以／有機會能夠"},{"th":"ตั้งตารอ","ro":"dtâng-dtaa rɔɔ","en":"eagerly await; look forward to","cat":"Emotional usage","note":"比一般的「等待」更有盼望感；通常用於期待某人、某天或某個機會。","ex":["เด็ก ๆ ตั้งตารอวันหยุดสุดสัปดาห์","dèk dèk dtâng-dtaa rɔɔ wan yùt sùt-sàp-daa","The children are eagerly looking forward to the weekend.","孩子們急切地期待著週末的到來。"],"i":"V005","zh":"熱切期待／盼望"},{"th":"พยายาม","ro":"phá-yaa-yaam","en":"try; make an effort","cat":"Practical Usage","note":"不是隨便試試看，而是面對不容易的事，持續投入努力；不保證一定成功。","ex":["อย่างน้อยก็พยายามแล้ว","yàang nɔ́ɔi gɔ̂ɔ phá-yaa-yaam lɛ́ɛw","At least I tried.","至少我試過了。"],"i":"V006","zh":"努力／盡量"},{"th":"คุ้มค่า","ro":"khúm-khâa","en":"worthwhile; good value","cat":"Practical Usage","note":"衡量金錢、時間或心力之後，覺得投入換來的回報值得。","ex":["ถึงจะแพง แต่คุ้มค่า","thʉ̌ng jà phɛɛng, dtɛ̀ɛ khúm-khâa","Although it is expensive, it is worth it.","雖然它很貴，但是值得的。"],"i":"V007","zh":"值得／划算"},{"th":"เสียดาย","ro":"sǐia-daai","en":"what a pity; regret","cat":"Emotional usage","note":"本來有機會得到、做到或保留，最後卻失去而感到可惜、遺憾或捨不得。","ex":["อย่างน้อยก็ได้ลองแล้ว ไม่เสียดายเลย","yàang nɔ́ɔi gɔ̂ɔ dâai lɔɔng lɛ́ɛw, mâi sǐia-daai ləəy","At least I gave it a try, so I have no regrets.","至少我試了一下，所以我沒有遺憾。"],"i":"V008","zh":"可惜／遺憾／捨不得"},{"th":"ไม่น่า...","ro":"mâi nâa...","en":"should not have...; unlikely to...","cat":"Grammar Core","note":"可表示後悔、推測或意外；今日主軸是回頭看，覺得當初不該那樣做。","ex":["ไม่น่าพูดแบบนั้นเลย","mâi nâa phûut bɛ̀ɛp nán ləəy","I should not have said it like that.","我不應該那樣說。"],"i":"V009","zh":"不該……／看來不太可能……"},{"th":"ไม่คุ้ม","ro":"mâi khúm","en":"not worth it","cat":"Practical Usage","note":"成本和回報不成比例；可算錢、時間、力氣，甚至情緒消耗。","ex":["เรื่องเล็กแค่นี้ไม่คุ้มที่จะทะเลาะกัน","rʉ̂ang lék khɛ̂ɛ níi mâi khúm thîi jà thá-lɔ́ɔ gan","This small matter is not worth arguing over.","為這麼小的事吵架不值得。"],"i":"V010","zh":"不值得／不划算"},{"th":"ไม่คู่ควร","ro":"mâi khûu-khuan","en":"not worthy of; not suitable for","cat":"Emotional usage","note":"判斷人和職位、機會、關係或待遇是否相稱；語氣重，對人說可能很刺。","ex":["เขาไม่คู่ควรกับตำแหน่งนี้","khǎo mâi khûu-khuan gàp dtam-nɛ̀ng níi","He is not worthy of this position.","他配不上這個職位。"],"i":"V011","zh":"不相配／配不上／不值得擁有"},{"th":"ให้อภัย","ro":"hâi à-phai","en":"forgive; pardon","cat":"Emotional usage","note":"不只是一般「沒關係」；是對較深的錯誤或傷害選擇不再怪罪、慢慢放下。","ex":["ให้อภัยไม่ได้แปลว่าลืม","hâi à-phai mâi dâai bplɛɛ wâa lʉʉm","Forgiving does not mean forgetting.","原諒並不意味著忘記。"],"i":"V012","zh":"原諒"},{"th":"มันจะ...","ro":"man jà...","en":"it will; it might...","cat":"Grammar Core","note":"把前面提到的整個情況當成主語，預感或推測接下來會出現的結果。","ex":["ถ้ายังไม่รีบ มันจะสาย","thâa yang mâi rîiap, man jà sǎai","If we do not hurry, we will be late.","如果我們不快點，我們會遲到的。"],"i":"V013","zh":"事情會……／可能會……"},{"th":"ยังคง","ro":"yang khong","en":"still remain; continue to be","cat":"Review","note":"固定搭配，表示經過一段時間後狀態依然存在；不是「還＋大概」。","ex":["เขายังคงพยายามแก้ปัญหาอยู่","khǎo yang khong phá-yaa-yaam gɛ̂ɛ bpan-hǎa yùu","He is still trying to solve the problem.","他仍在試圖解決這個問題。"],"i":"V014","zh":"仍然／依舊維持"},{"th":"ชำระ","ro":"cham-rá","en":"pay; make a payment","cat":"Practical Usage","note":"比日常的「付錢」更正式；常見於餐廳、商場、醫院、帳單與服務情境。","ex":["ลูกค้าชำระเป็นแบบไหนดีคะ","lûuk-kháa cham-rá bpen bɛ̀ɛp nǎi dii khá","How would you like to pay?","請問客人想用哪種方式付款？"],"i":"V015","zh":"支付／繳納（正式）"},{"th":"สลิป","ro":"salìp","en":"payment slip; transfer receipt","cat":"Local usage","note":"轉帳後的付款憑證；泰國日常服務情境非常高頻。","ex":["ขออนุญาตดูสลิปนะคะ","khɔ̌ɔ à-nú-yâat duu salìp ná khá","May I see the payment slip?","方便讓我看一下轉帳明細嗎？"],"i":"V016","zh":"付款憑證／轉帳明細"},{"th":"ใด","ro":"dai","en":"which; any; whichever","cat":"Textbook-based","note":"比日常的「哪個」正式，常用在公告、表單、客服與固定搭配。","ex":["ถ้ามีข้อสงสัยใด ๆ ถามได้เลย","thâa mii khɔ̂ɔ sǒng-sǎi dai dai, thǎam dâai ləəy","If you have any questions, feel free to ask.","如果您有任何問題，請隨時提問。"],"i":"V017","zh":"哪一個／任何（正式）"},{"th":"แสน","ro":"sɛ̌ɛn","en":"extremely; very; deeply","cat":"Local usage","note":"放在形容詞或狀態前加強情緒；比一般「很」更抒情，歌詞裡特別常見。","ex":["ถ้าเธอกำลังเดินทางไปไกลแสนไกล","thâa thəə gam-lang dəən-thaang bpai glai sɛ̌ɛn glai","If you are traveling far, far away.","如果你旅行很遠，很遠。"],"i":"V018","zh":"非常／極其（抒情）"},{"th":"หัว","ro":"hǔa","en":"head; core; leader; mind","cat":"Textbook-based","note":"字根從頭部延伸到前端、核心、領頭的人、腦袋和情緒狀態。","ex":["หัวข้อวันนี้คืออะไร","hǔa khɔ̂ɔ wan-níi khʉʉ à-rai","What is today’s topic?","今天的主題是什麼？"],"i":"V019","zh":"頭；前端／核心／領頭者"},{"th":"นำ / ผู้นำ","ro":"nam / phûu nam","en":"lead or bring / leader","cat":"Practical Usage","note":"「帶領、帶來」較正式；「領導者」可指團隊、組織或國家的領頭人。","ex":["เขาเป็นผู้นำทีมที่ดี","khǎo bpen phûu nam thiim thîi dii","He is a good team leader.","他是一位優秀的組長。"],"i":"V020","zh":"帶領、帶來／領導者"},{"th":"หัวร้อน","ro":"hǔa rɔ́ɔn","en":"get heated; lose one’s temper","cat":"Local usage","note":"很口語，表示情緒上頭、越講越火；可用來勸人冷靜。","ex":["ใจเย็น ๆ อย่าหัวร้อน","jai yen yen, yàa hǔa rɔ́ɔn","Calm down. Do not get worked up.","冷靜一點，別讓情緒上來。"],"i":"V021","zh":"火氣上來／情緒上頭"},{"th":"ฟังขึ้น","ro":"fang khʉ̂n","en":"sound convincing; make sense","cat":"Local usage","note":"不是「聽得更清楚」，而是某個理由、解釋或說法聽起來有道理。","ex":["เหตุผลนี้ฟังขึ้นนะ","hèt-phǒn níi fang khʉ̂n ná","This reason makes sense.","這個理由聽起來有道理。"],"i":"V022","zh":"聽起來有道理／具有說服力"},{"th":"ชิน","ro":"chin","en":"be used to; become accustomed to","cat":"Practical Usage","note":"表示已經習慣某個狀態或環境，常用「習慣於」。","ex":["เขายังไม่ชินกับเวลาทำงานใหม่","khǎo yang mâi chin gàp wee-laa tham-ngaan mài","He is not used to the new working hours yet.","他還不習慣新的工作時間。"],"i":"V023","zh":"習慣了／適應了"},{"th":"ย้าย","ro":"yáai","en":"move; relocate; transfer","cat":"Practical Usage","note":"強調人、物或所在地從一處換到另一處；適合搬家、換座位、調動。","ex":["เดือนหน้าฉันจะย้ายไปอยู่ใกล้ที่ทำงาน","dʉan nâa chǎn jà yáai bpai yùu glâi thîi tham-ngaan","Next month I will move closer to work.","下個月我會搬到離工作更近的地方。"],"i":"V024","zh":"搬／移動／調動"},{"th":"ระวัง","ro":"rá-wang","en":"be careful; watch out","cat":"Practical Usage","note":"用於即時提醒或提醒可能發生的風險；後面常接名詞或動詞。","ex":["ระวังพื้นลื่นนะ เดี๋ยวล้ม","rá-wang phʉ́ʉn lʉ̂ʉn ná, dǐaw lóm","Watch out, the floor is slippery. You might fall.","小心地板很滑，等等會跌倒。"],"i":"V025","zh":"小心／注意"},{"th":"ฝาก","ro":"fàak","en":"entrust; ask someone to do for you","cat":"Practical Usage","note":"把東西、訊息或小任務交給別人幫忙處理，不是一般的「給」。","ex":["ถ้าเจอเขา ฝากบอกให้โทรกลับด้วยนะ","thâa jəə khǎo, fàak bɔ̀ɔk hâi thoo glàp dûai ná","If you see him, please tell him to call back.","如果遇到他，麻煩轉告他回電給我。"],"i":"V026","zh":"託付／請人代辦／寄放"},{"th":"แก้","ro":"gɛ̂ɛ","en":"solve; fix; correct; relieve","cat":"Review","note":"可解決問題、改正錯誤、改善狀況，也可指暫時緩解飢餓、睏或壓力。","ex":["ช่วยแก้ประโยคนี้ให้ชัดขึ้นหน่อย","chûai gɛ̂ɛ bprà-yòok níi hâi chát khʉ̂n nɔ̀i","Please revise this sentence to make it clearer.","麻煩把這句修得更清楚一點。"],"i":"V027","zh":"解決／修正／緩解"},{"th":"แต่ง","ro":"dtɛ̀ng","en":"dress; decorate; compose; make up","cat":"Practical Usage","note":"依搭配改變意思：打扮、化妝、布置、創作，也可出現在結婚這個固定詞。","ex":["วันนี้เขาแต่งตัวเรียบร้อยมาก","wan-níi khǎo dtɛ̀ng dtua rîiap-rɔ́ɔi mâak","He is dressed very neatly today.","他今天穿得很整潔。"],"i":"V028","zh":"打扮／布置／創作"},{"th":"ตัด","ro":"dtàt","en":"cut; remove; reduce; decide","cat":"Review","note":"核心是切開或移除；延伸到刪除、縮減，以及「做決定」的固定搭配。","ex":["ช่วยตัดส่วนนี้ออกก่อน","chûai dtàt sùan níi ɔ̀ɔk gɔ̀ɔn","Please remove this part first.","請先移除此部件。"],"i":"V029","zh":"切／刪除／縮減／做決定"},{"th":"มาหา / ไปหา","ro":"maa hǎa / bpai hǎa","en":"come see / go see","cat":"Local usage","note":"視角不同：以說話者所在之處為中心，「來找我」和「去找他」的方向不同。","ex":["พรุ่งนี้ฉันจะไปหาหมอ แล้วค่อยไปหาเพื่อน","phrûng-níi chǎn jà bpai hǎa mɔ̌ɔ, lɛ́ɛw khɔ̂i bpai hǎa phʉ̂an","Tomorrow I will see the doctor, then go see a friend.","明天我會先去看醫生，再去找朋友。"],"i":"V030","zh":"來找／去找"},{"th":"ชัด","ro":"chát","en":"clear; distinct","cat":"Practical Usage","note":"可以是聲音、畫面、意思或證據清楚；較正式完整的說法可用「清楚明確」。","ex":["พูดอีกครั้งได้ไหม ฉันฟังไม่ชัด","phûut ìik khráng dâai mái, chǎn fang mâi chát","Could you say it again? I could not hear it clearly.","你能再說一遍嗎？ 我聽不清楚。"],"i":"V031","zh":"清楚／明確"}],"compare":[{"title":"1. 方式、定案與口語填充｜แบบนี้ vs ตามนี้ vs แบบว่า","rows":[{"term":["แบบนี้","bɛ̀ɛp níi","this way","像這樣"],"meaning":"做法、方式、呈現成這樣。","ex":["ทำแบบนี้นะ","tham bɛ̀ɛp níi ná","Do it this way.","照這樣做喔。"]},{"term":["ตามนี้","dtaam níi","as discussed; according to this","就照這樣／依照談好的內容"],"meaning":"照前面談好的條件、安排或清單。","ex":["ตกลงตามนี้นะ","dtòk-long dtaam níi ná","Let us settle on this.","那就照這樣決定囉。"]},{"term":["แบบว่า","bɛ̀ɛp wâa","like...; I mean...","就是……／有點像……／我是說……"],"meaning":"說話時思考、緩衝或加重主觀感受。","ex":["แบบว่า ฉันยังเลือกไม่ถูก","bɛ̀ɛp wâa chǎn yang lʉ̂ak mâi thùuk","Like, I still cannot choose.","就是……我還是選不出來。"]}],"tip":"Common mistake： ตามนี้ dtaam níi （as discussed）不是單純的「像這樣」；只是在示範做法時，優先用 แบบนี้ bɛ̀ɛp níi （this way）。"},{"title":"2. 技能、能力、許可與期待｜เป็น vs ได้ vs ที่จะได้","rows":[{"term":["เป็น","bpen","know how to; have learned","已學會的技能或做法。"],"meaning":"已學會的技能或做法。","ex":["เธอขับรถเป็นไหม","thəə khàp rót bpen mái","Do you know how to drive?","你會開車嗎？"]},{"term":["ได้","dâai","can; be able to; be allowed to","得到／有做成／可以"],"meaning":"當下能力、條件允許或被允許。","ex":["วันนี้ฉันขับรถไม่ได้","wan-níi chǎn khàp rót mâi dâai","I cannot drive today.","我今天沒辦法開車。"]},{"term":["ที่จะได้ + V","thîi jà dâai + V","to get to do; to have the chance to do","帶有期待「終於可以做到」的鏡頭。"],"meaning":"帶有期待「終於可以做到」的鏡頭。","ex":["เรารอที่จะได้เจอกัน","rao rɔɔ thîi jà dâai jəə gan","We are waiting to get to meet each other.","我們一直期待能見到彼此。"]}],"tip":"Practical note： พูดภาษาไทยได้ phûut phaa-sǎa thai dâai （can speak Thai）非常自然；所以這組不是死規則，而是看你要強調「已學會」還是「此刻可不可以」。"},{"title":"3. 值得、後悔、成本與不相稱｜คุ้มค่า / ไม่น่า... / ไม่คุ้ม / ไม่คู่ควร","rows":[{"term":["คุ้มค่า","khúm-khâa","worthwhile; good value","值得／划算"],"meaning":"投入與回報相稱，覺得值得。","ex":["คอร์สนี้คุ้มค่ากับเวลา","khɔ̂ɔt níi khúm-khâa gàp wee-laa","This course is worth the time.","這門課很值得花時間。"]},{"term":["ไม่น่า...","mâi nâa...","should not have...","不該……／看來不太可能……"],"meaning":"回頭看，覺得當初不該做。","ex":["ไม่น่าตัดสินใจเร็วเกินไป","mâi nâa dtàt-sǐn-jai reo gəən bpai","I should not have decided too quickly.","我不該那麼快做決定。"]},{"term":["ไม่คุ้ม","mâi khúm","not worth it","不值得／不划算"],"meaning":"衡量成本後，覺得不划算。","ex":["รอนานขนาดนี้ไม่คุ้มเลย","rɔɔ naan khà-nàat níi mâi khúm ləəy","Waiting this long is not worth it at all.","等這麼久一點都不值得。"]},{"term":["ไม่คู่ควร","mâi khûu-khuan","not worthy of; not suitable for","不相配／配不上／不值得擁有"],"meaning":"人與位置、關係、機會或待遇不相稱。","ex":["คำพูดแบบนี้ไม่คู่ควรกับเขา","kham phûut bɛ̀ɛp níi mâi khûu-khuan gàp khǎo","Words like this are not worthy of him.","這種話配不上他。"]}],"tip":"關係距離： 評價兩個人是否適合， ไม่เหมาะกัน mâi mɔ̀ gan （not suitable for each other）通常比 ไม่คู่ควร mâi khûu-khuan （not worthy of）安全、柔和。"},{"title":"4. 可惜、原諒與普通的小事｜เสียดาย vs ให้อภัย vs ไม่เป็นไร","rows":[{"term":["เสียดาย","sǐia-daai","what a pity; regret","可惜／遺憾／捨不得"],"meaning":"本來有機會卻失去，感到可惜或捨不得。","ex":["เสียดายที่เราไม่ได้ไป","sǐia-daai thîi rao mâi dâai bpai","It is a pity that we did not get to go.","可惜我們沒能去成。"]},{"term":["ให้อภัย","hâi à-phai","forgive; pardon","原諒"],"meaning":"較深的傷害或錯誤後，選擇不再怪罪。","ex":["เขายังให้อภัยฉันไม่ได้","khǎo yang hâi à-phai chǎn mâi dâai","He still cannot forgive me.","他還是沒辦法原諒我。"]},{"term":["ไม่เป็นไร","mâi bpen rai","it is okay; no problem","只有「沒關係」（太窄了）"],"meaning":"日常小失誤最安全的回覆。","ex":["ไม่เป็นไร เดี๋ยวแก้ได้","mâi bpen rai, dǐaw gɛ̂ɛ dâai","It is okay. We can fix it soon.","沒關係，我們很快就能修好。"]}],"tip":"今日連結： ให้อภัย hâi à-phai （forgive）和 เสียดาย sǐia-daai （regret）可以同時存在：不再怪罪，不代表對結果完全不遺憾。"},{"title":"5. 還、依然、即使如此還是｜คง vs ยัง vs ยังคง vs ก็ยัง","rows":[{"term":["คง","khong","probably; likely","大概／想必／恐怕"],"meaning":"主觀推測，語氣較柔。","ex":["เขาคงยังไม่ถึง","khǎo khong yang mâi thʉ̌ng","He is probably not here yet.","他應該還沒到。"]},{"term":["ยัง","yang","still","單純描述狀態還沒有結束。"],"meaning":"單純描述狀態還沒有結束。","ex":["ฝนยังตกอยู่","fǒn yang dtòk yùu","It is still raining.","雨還在下。"]},{"term":["ยังคง","yang khong","still remain; continue to be","仍然／依舊維持"],"meaning":"時間過了，狀態仍維持原樣；較書面或有餘韻。","ex":["ความหวังยังคงอยู่","khwaam wǎng yang khong yùu","Hope still remains.","還有希望。"]},{"term":["ก็ยัง","gɔ̂ɔ yang","still, even so","即使如此還是／依然"],"meaning":"前面有阻力或轉折，結果仍沒變。","ex":["ถึงจะเหนื่อย เขาก็ยังทำต่อ","thʉ̌ng jà nʉ̀ai, khǎo gɔ̂ɔ yang tham dtɔ̀ɔ","Even though he is tired, he still keeps doing it.","雖然他很累，還是繼續做。"]}],"tip":"Common mistake： ยังคง yang khong （still remain）是固定組合，不能拆成「還＋大概」。"},{"title":"6. 服務泰文與正式「哪一個」｜ชำระ / สลิป / ใด","rows":[{"term":["จ่าย","jàai","pay","日常最普通的付錢。"],"meaning":"日常最普通的付錢。","ex":["จ่ายเงินแบบไหนดีคะ","jàai ngoen bɛ̀ɛp nǎi dii khá","How would you like to pay?","想用什麼方式付款呢？"]},{"term":["ชำระ","cham-rá","pay; make a payment","支付／繳納（正式）"],"meaning":"服務、帳單、商場與較正式的付款。","ex":["ชำระด้วยบัตรได้ไหมคะ","cham-rá dûai bàt dâai mái khá","Can I pay by card?","可以刷卡嗎？"]},{"term":["ใด / ใด ๆ","dai / dai dai","which; any; any at all","公告、表單、客服常見；日常聊天多用「哪個」。"],"meaning":"公告、表單、客服常見；日常聊天多用「哪個」。","ex":["หากมีปัญหาใด ๆ กรุณาติดต่อเจ้าหน้าที่","hàak mii bpan-hǎa dai dai, gà-rú-naa dtìt-dtɔ̀ɔ jâo-nâa-thîi","If you have any problems, please contact staff.","如果有任何問題，請聯絡工作人員。"]}],"tip":"Bangkok note： 轉帳付款後， ขออนุญาตดูสลิปนะคะ khɔ̌ɔ à-nú-yâat duu salìp ná khá （May I see the payment slip?）很常見；朋友聊天問選擇，則多用 ไหน nǎi （which one）。"},{"title":"7. 行動詞怎麼選｜มาหา / ไปหา / ฝาก / ย้าย / แก้ / ซ่อม","rows":[{"term":["มาหา / ไปหา","maa hǎa / bpai hǎa","come see / go see","來找／去找"],"meaning":"以說話者所在處為中心，方向不同。","ex":["เย็นนี้มาหาฉันได้ไหม","yen níi maa hǎa chǎn dâai mái","Can you come see me this evening?","今天傍晚可以來找我嗎？"]},{"term":["ฝาก","fàak","entrust; ask someone to do","託付／請人代辦／寄放"],"meaning":"交託東西、消息或小任務給別人。","ex":["ฝากซื้อขนมให้หน่อยได้ไหม","fàak sʉ́ʉ khà-nǒm hâi nɔ̀i dâai mái","Could you buy me a snack?","可以幫我買個點心嗎？"]},{"term":["ย้าย","yáai","move; relocate; transfer","搬／移動／調動"],"meaning":"人或物從一處移到另一處。","ex":["ช่วยย้ายเก้าอี้ไปตรงนั้นหน่อย","chûai yáai gâo-îi bpai dtrong nán nɔ̀i","Please move the chair over there.","請把椅子移到那邊。"]},{"term":["แก้ / ซ่อม","gɛ̂ɛ / sɔ̂ɔm","solve or correct / repair","前者解決、改善、修正；後者修理壞掉的實體物品。"],"meaning":"前者解決、改善、修正；後者修理壞掉的實體物品。","ex":["ช่างกำลังซ่อมแอร์ ส่วนเราต้องแก้แผนใหม่","châang gam-lang sɔ̂ɔm ɛɛ, sùan rao dtɔ̂ng gɛ̂ɛ phɛ̌ɛn mài","The technician is repairing the air conditioner, while we need to revise the plan.","技師正在修冷氣，同時我們得修改計畫。"]}],"tip":"Practical note： แต่ง dtɛ̀ng （dress, decorate, compose）與 ตัด dtàt （cut, remove, decide）都要靠後面搭配決定意思；不要只背一個中文。"},{"title":"8. 延伸比較｜ภาพ / รูป、คล้ายกัน / เหมือนกัน、ประจำวัน / ทุกวัน","rows":[{"term":["ภาพ / รูป","phâap / rûup","image or scene / photo or picture","日常照片常用「照片、圖」；「畫面、影像、印象」更常用前者。"],"meaning":"日常照片常用「照片、圖」；「畫面、影像、印象」更常用前者。","ex":["รูปนี้ชัดมาก แต่ภาพรวมยังไม่ชัด","rûup níi chát mâak, dtɛ̀ɛ phâap ruam yang mâi chát","This photo is very clear, but the overall picture is not clear yet.","這張照片很清楚，但整體狀況還不明朗。"]},{"term":["คล้ายกัน / เหมือนกัน","khláai gan / mʉ̌an gan","similar / same or alike","前者偏部分相似；後者可更接近一樣，也可有「也一樣」的意思。"],"meaning":"前者偏部分相似；後者可更接近一樣，也可有「也一樣」的意思。","ex":["สองแบบนี้คล้ายกัน แต่ไม่เหมือนกันทั้งหมด","sɔ̌ɔng bɛ̀ɛp níi khláai gan, dtɛ̀ɛ mâi mʉ̌an gan tháng-mòt","These two are similar, but they are not exactly the same.","這兩個很像，但不完全一樣。"]},{"term":["ประจำวัน / ทุกวัน","bprà-jam wan / thúk wan","daily routine / every day","前者是日常性質或生活例行；後者是頻率。"],"meaning":"前者是日常性質或生活例行；後者是頻率。","ex":["การเดินเป็นส่วนหนึ่งของชีวิตประจำวันของเขา","gaan dəən bpen sùan nʉ̀ng khɔ̌ɔng chii-wít bprà-jam wan khɔ̌ɔng khǎo","Walking is part of his daily life.","走路是他日常生活的一部分。"]},{"term":["อีกผืน","ìik phʉ̌ʉn","another one, for cloth-like items","「張／條／件」的量詞，用於布、被子、墊子等平面布料類。"],"meaning":"「張／條／件」的量詞，用於布、被子、墊子等平面布料類。","ex":["ขอผ้าห่มอีกผืนได้ไหม","khɔ̌ɔ phâa-hòm ìik phʉ̌ʉn dâai mái","Could I have another blanket?","可以再給我一條毯子嗎？"]}],"tip":"字根延伸： ผู้นำ phûu nam （leader）比 หัวหน้า hǔa nâa （supervisor）更廣； ผู้เชี่ยวชาญ phûu chîiao-chaan （expert）則是某領域的專家。"}],"mistakes":[{"title":"","wrong":{"label":"","th":"ตามนี้","ro":"dtaam níi","en":"as discussed; according to this","zh":"就照這樣／依照談好的內容"},"better":{"label":"","th":"แบบนี้","ro":"bɛ̀ɛp níi","en":"this way","zh":"像這樣"},"why":"只是在示範做法時，用「像這樣」；要照前面確認的內容做，才用「照這樣」。"},{"title":"","wrong":{"label":"","th":"ร้านนี้ไม่คู่ควร","ro":"ráan níi mâi khûu-khuan","en":"This restaurant is not worthy.","zh":"這家店配不上這種評價。（用詞過重）"},"better":{"label":"","th":"ร้านนี้ไม่คุ้ม","ro":"ráan níi mâi khúm","en":"This restaurant is not worth it.","zh":"這家店不划算。"},"why":"評價價格、餐廳或等待成本時用「不划算」；「不相稱」多用在人的資格、位置、關係或待遇。"},{"title":"","wrong":{"label":"","th":"ให้อภัยค่ะ","ro":"hâi à-phai khâ","en":"I forgive you.","zh":"我原諒你。（小事用這句太重）"},"better":{"label":"","th":"ไม่เป็นไรค่ะ","ro":"mâi bpen rai khâ","en":"It is okay.","zh":"沒關係。"},"why":"店員小失誤、對方晚一點回覆等小事，用「沒關係」最自然；「原諒」會把事情說得比較重。"},{"title":"","wrong":{"label":"","th":"อยากกินอันใด","ro":"yàak gin an dai","en":"Which one do you want to eat?","zh":"你想吃哪一個？"},"better":{"label":"","th":"อยากกินอันไหน","ro":"yàak gin an nǎi","en":"Which one do you want to eat?","zh":"你想吃哪一個？"},"why":"日常選擇用「哪個」；正式「哪一個／任何一個」才用「ใด」。"},{"title":"","wrong":{"label":"","th":"ฉันพยายามภาษาไทย","ro":"chǎn phá-yaa-yaam phaa-sǎa thai","en":"I try Thai.","zh":"我努力泰文。（少了要努力做什麼）"},"better":{"label":"","th":"ฉันพยายามเรียนภาษาไทย","ro":"chǎn phá-yaa-yaam riian phaa-sǎa thai","en":"I am trying to learn Thai.","zh":"我正在努力學泰文。"},"why":"「努力」後面通常要交代努力做什麼的動詞。"},{"title":"","wrong":{"label":"","th":"ยังคง = ยัง + probably","ro":"yang khong = yang + probably","en":"still + probably","zh":"錯誤拆法：ยังคง 不是「ยัง＋大概」。"},"better":{"label":"","th":"ยังคง = still remain","ro":"yang khong = still remain","en":"still remain; continue to be","zh":"ยังคง 是「仍然維持／依舊」。"},"why":"它是固定搭配；單獨的「大概」是「คง」，但合在一起已經不是推測。"}],"dialogues":[{"title":"Dialogue 1｜餐廳付款","turns":[{"speaker":"Staff","side":"left","th":"ชำระเป็นแบบไหนดีคะ","ro":"cham-rá bpen bɛ̀ɛp nǎi dii khá","en":"How would you like to pay?","zh":"請問想用哪種方式付款？"},{"speaker":"Customer","side":"right","th":"โอนค่ะ โอนแล้วนะคะ","ro":"oon khâ, oon lɛ́ɛw ná khá","en":"By transfer. I have transferred already.","zh":"轉帳，我已經轉好了。"},{"speaker":"Staff","side":"left","th":"ขออนุญาตดูสลิปนะคะ","ro":"khɔ̌ɔ à-nú-yâat duu salìp ná khá","en":"May I see the payment slip?","zh":"方便讓我看一下轉帳明細嗎？"},{"speaker":"Customer","side":"right","th":"ได้ค่ะ ส่งให้แล้วค่ะ","ro":"dâai khâ, sòng hâi lɛ́ɛw khâ","en":"Sure. I have sent it already.","zh":"當然。我已經傳送了。"}]},{"title":"Dialogue 2｜改約與托付","turns":[{"speaker":"A","side":"left","th":"พรุ่งนี้มาหาได้ไหม","ro":"phrûng-níi maa hǎa dâai mái","en":"Can you come see me tomorrow?","zh":"你明天能來看我嗎？"},{"speaker":"B","side":"right","th":"อาจจะไม่ได้ ติดงานอยู่","ro":"àat jà mâi dâai, dtìt ngaan yùu","en":"Maybe not. I am tied up with work.","zh":"也許不是。我忙得不可開交。"},{"speaker":"A","side":"left","th":"งั้นฝากบอกก่อนนะ ถ้าว่างค่อยมา","ro":"ngán fàak bɔ̀ɔk gɔ̀ɔn ná, thâa wâang khɔ̂i maa","en":"Then let me know first. Come when you are free.","zh":"然後先告訴我。你有空的時候過來。"},{"speaker":"B","side":"right","th":"ได้เลย ขอบคุณนะ","ro":"dâai ləəy, khɔ̀ɔp-khun ná","en":"Sure, thank you.","zh":"當然，謝謝你。"}]},{"title":"Dialogue 3｜工作修改與說服力","turns":[{"speaker":"A","side":"left","th":"หัวหน้าบอกให้แก้หัวข้อนี้อีก","ro":"hǔa nâa bɔ̀ɔk hâi gɛ̂ɛ hǔa khɔ̂ɔ níi ìik","en":"The supervisor asked us to revise this topic again.","zh":"主管要求我們再次修改這個話題。"},{"speaker":"B","side":"right","th":"เหตุผลที่เขาให้มาฟังขึ้นนะ","ro":"hèt-phǒn thîi khǎo hâi maa fang khʉ̂n ná","en":"The reason he gave makes sense.","zh":"他給出的理由是有道理的。"},{"speaker":"A","side":"left","th":"จริง อย่างน้อยก็รู้ว่าต้องตัดตรงไหน","ro":"jing, yàang nɔ́ɔi gɔ̂ɔ rúu wâa dtɔ̂ng dtàt dtrong nǎi","en":"True. At least we know what needs to be cut.","zh":"沒錯。至少我們知道需要削減什麼。"},{"speaker":"B","side":"right","th":"เรายังคงพยายามต่อได้","ro":"rao yang khong phá-yaa-yaam dtɔ̀ɔ dâai","en":"We can keep trying.","zh":"我們可以繼續努力。"}]},{"title":"Dialogue 4｜衝突後怎麼收","turns":[{"speaker":"A","side":"left","th":"ฉันไม่น่าพูดแบบนั้นเลย","ro":"chǎn mâi nâa phûut bɛ̀ɛp nán ləəy","en":"I should not have said it like that.","zh":"我不應該那樣說。"},{"speaker":"B","side":"right","th":"ไม่เป็นไร แต่ตอนนั้นฉันก็เสียดายมาก","ro":"mâi bpen rai, dtɛ̀ɛ dtaawn nán chǎn gɔ̂ɔ sǐia-daai mâak","en":"It is okay, but I felt very regretful then too.","zh":"沒關係，但我當時也感到非常後悔。"},{"speaker":"A","side":"left","th":"เรื่องนี้ไม่คุ้มที่จะทะเลาะกัน","ro":"rʉ̂ang níi mâi khúm thîi jà thá-lɔ́ɔ gan","en":"This is not worth arguing over.","zh":"這件事不值得拿來吵。"},{"speaker":"B","side":"right","th":"ถ้าอย่างนั้น เราค่อยให้อภัยกันนะ","ro":"thâa yàang nán, rao khɔ̂i hâi à-phai gan ná","en":"Then let us forgive each other, little by little.","zh":"那等彼此都準備好了，再慢慢放下吧。"}]}],"structures":[{"title":"Pattern 1｜พยายาม + V / พยายามไม่ + V","meaning":"表示努力做某件事，或努力避免某件事；重點是正在投入，不是保證成功。","examples":[["พยายามไม่พูดตอนที่หัวร้อน","phá-yaa-yaam mâi phûut dtaawn thîi hǔa rɔ́ɔn","Try not to speak when you are heated.","當你情緒激動時，儘量不要說話。"]]},{"title":"Pattern 2｜ตั้งตารอที่จะได้ + V","meaning":"帶有期待「終於有機會做」的感覺；適合期待旅行、見面、機會或體驗。","examples":[["ทุกคนตั้งตารอที่จะได้เห็นผล","thúk khon dtâng-dtaa rɔɔ thîi jà dâai hěn phǒn","Everyone is looking forward to getting to see the result.","每個人都期待著看到結果。"]]},{"title":"Pattern 3｜คุ้มค่า / ไม่คุ้ม + ที่จะ + V","meaning":"用來衡量行動值不值得繼續投入。","examples":[["คุ้มค่าที่จะลองสักครั้ง","khúm-khâa thîi jà lɔɔng sàk khráng","It is worth trying once.","值得嘗試一次。"]]},{"title":"Pattern 4｜เสียดายที่ + clause / ไม่น่า + V","meaning":"前者表達結果令人可惜；後者回頭看，覺得當初不該做。","examples":[["เสียดายที่ไม่ได้ถามให้ชัดก่อน","sǐia-daai thîi mâi dâai thǎam hâi chát gɔ̀ɔn","It is a pity that I did not ask clearly first.","很遺憾，我沒有先問清楚。"]]},{"title":"Pattern 5｜มันจะ + result","meaning":"把前面情況概括成「它」，預測接下來可能出現的結果。","examples":[["ถ้ารีบเกินไป มันจะพลาดง่าย","thâa rîiap gəən bpai, man jà phlâat ngâai","If you rush too much, mistakes will happen easily.","如果你太匆忙，很容易出錯。"]]},{"title":"Pattern 6｜ยังคง + V / Adj / state","meaning":"強調經過一段時間後，某個行動、感覺或狀態仍持續。","examples":[["เขายังคงชินกับชีวิตแบบเดิม","khǎo yang khong chin gàp chii-wít bɛ̀ɛp dəəm","He is still used to the same way of life.","他仍然習慣於同樣的生活方式。"]]}],"sentenceBank":[{"scene":"Decision & Tone｜方式、定案與保留感","sentences":[{"th":"แบบว่า ฉันขอคิดก่อนนะ","ro":"bɛ̀ɛp wâa chǎn khɔ̌ɔ khít gɔ̀ɔn ná","en":"Like, let me think first.","zh":"比如，讓我先想想。"},{"th":"ถ้าทุกคนโอเค เป็นอันว่าเอาตามนี้","ro":"thâa thúk khon oo-khee, bpen an wâa ao dtaam níi","en":"If everyone is okay, then it is settled that we will go with this.","zh":"如果大家都沒事，那麼我們就決定這樣做。"},{"th":"ทำแบบนี้จะชัดกว่า","ro":"tham bɛ̀ɛp níi jà chát gwàa","en":"Doing it this way will be clearer.","zh":"這樣做會更清楚。"},{"th":"มันจะยากไปไหม ถ้าเราเปลี่ยนตอนนี้","ro":"man jà yâak bpai mái, thâa rao bplìian dtaawn níi","en":"Will it be too difficult if we change it now?","zh":"如果我們現在改變它，會不會太難了？"}]},{"scene":"Effort & Skill｜努力、技能與清楚表達","sentences":[{"th":"เขาพยายามพูดให้ชัดขึ้นทุกวัน","ro":"khǎo phá-yaa-yaam phûut hâi chát khʉ̂n thúk wan","en":"He tries to speak more clearly every day.","zh":"他每天都試著說得更清楚。"},{"th":"เธอมีทักษะดี แต่ยังต้องฝึกอีก","ro":"thəə mii thák-sà dii, dtɛ̀ɛ yang dtɔ̂ng fʉ̀k ìik","en":"She has good skills, but still needs more practice.","zh":"她有很好的技能，但仍然需要更多的練習。"},{"th":"สิ่งที่เขาอธิบายฟังขึ้นมาก","ro":"sìng thîi khǎo à-thí-baai fang khʉ̂n mâak","en":"What he explained sounds very convincing.","zh":"他解釋的內容聽起來很有說服力。"},{"th":"อย่างน้อยก็รู้แล้วว่าต้องแก้ตรงไหน","ro":"yàang nɔ́ɔi gɔ̂ɔ rúu lɛ́ɛw wâa dtɔ̂ng gɛ̂ɛ dtrong nǎi","en":"At least we now know what needs to be fixed.","zh":"至少我們現在知道需要修復什麼。"}]},{"scene":"Value & Regret｜值得、可惜與回頭看","sentences":[{"th":"หนังเรื่องนี้คุ้มค่าที่จะดู","ro":"nǎng rʉ̂ang níi khúm-khâa thîi jà duu","en":"This movie is worth watching.","zh":"這部電影值得一看。"},{"th":"ไม่น่าซื้อเพราะยังไม่ได้ใช้เลย","ro":"mâi nâa sʉ́ʉ phrɔ́ yang mâi dâai chái ləəy","en":"I should not have bought it because I have not used it at all.","zh":"我本不應該買它，因為我根本沒有用過它。"},{"th":"ถ้าต้องเสียเวลามากขนาดนี้ ไม่คุ้มเลย","ro":"thâa dtɔ̂ng sǐia wee-laa mâak khà-nàat níi, mâi khúm ləəy","en":"If it takes this much time, it is not worth it at all.","zh":"如果花這麼多時間，那就根本不值得了。"},{"th":"เสียดายที่วันนั้นเราไม่ได้ถ่ายรูป","ro":"sǐia-daai thîi wan nán rao mâi dâai thàai rûup","en":"It is a pity that we did not take photos that day.","zh":"很遺憾，我們那天沒有拍照。"}]},{"scene":"Feelings & Repair｜放下、原諒與不讓情緒上頭","sentences":[{"th":"ตอนนั้นฉันหัวร้อน เลยพูดแรงไป","ro":"dtaawn nán chǎn hǔa rɔ́ɔn, ləəy phûut rɛɛng bpai","en":"I got heated then, so I spoke too harshly.","zh":"我當時被激怒了，所以我說話太刺耳了。"},{"th":"ไม่น่าทะเลาะกันเพราะเรื่องเล็ก ๆ","ro":"mâi nâa thá-lɔ́ɔ gan phrɔ́ rʉ̂ang lék lék","en":"We should not have argued over such a small matter.","zh":"我們不應該為這麼小的事情爭論。"},{"th":"ฉันให้อภัยได้ แต่ต้องใช้เวลา","ro":"chǎn hâi à-phai dâai, dtɛ̀ɛ dtɔ̂ng chái wee-laa","en":"I can forgive, but it takes time.","zh":"我可以原諒，但這需要時間。"},{"th":"เรื่องนี้ไม่คุ้มที่จะคิดมากอีกแล้ว","ro":"rʉ̂ang níi mâi khúm thîi jà khít mâak ìik lɛ́ɛw","en":"This is not worth overthinking anymore.","zh":"這不值得再多想了。"}]},{"scene":"Daily Actions｜移動、提醒與托付","sentences":[{"th":"เขาชินกับการตื่นเช้าทุกวันแล้ว","ro":"khǎo chin gàp gaan dtʉ̀ʉn cháo thúk wan lɛ́ɛw","en":"He is used to waking up early every day now.","zh":"他現在習慣於每天早起。"},{"th":"ระวังนะ เดี๋ยวแก้วจะตก","ro":"rá-wang ná, dǐaw gɛ̂ɛw jà dtòk","en":"Be careful, the glass might fall.","zh":"小心，玻璃可能會掉下來。"},{"th":"ฝากกุญแจไว้กับหัวหน้าก่อนได้ไหม","ro":"fàak gun-jɛɛ wái gàp hǔa nâa gɔ̀ɔn dâai mái","en":"Can we leave the key with the supervisor first?","zh":"我們可以先把鑰匙留給主管嗎？"},{"th":"หลังจากย้ายบ้าน เขายังไม่ชินกับทางใหม่","ro":"lǎng jàak yáai bâan, khǎo yang mâi chin gàp thaang mài","en":"After moving house, he is still not used to the new route.","zh":"搬家後，他仍然不習慣新路線。"}]},{"scene":"Formal & Lyrics｜正式用法、持續與抒情距離","sentences":[{"th":"หากมีคำถามใด ๆ กรุณาส่งอีเมลมา","ro":"hàak mii kham-thǎam dai dai, gà-rú-naa sòng ii-meen maa","en":"If you have any questions, please send an email.","zh":"如果您有任何問題，請傳送電子郵件。"},{"th":"เขายังคงรอคำตอบอยู่","ro":"khǎo yang khong rɔɔ kham-dtɔ̀ɔp yùu","en":"He is still waiting for an answer.","zh":"他仍在等待答案。"},{"th":"ความทรงจำยังคงชัดอยู่ในใจ","ro":"khwaam song-jam yang khong chát yùu nai jai","en":"The memory still remains clear in my heart.","zh":"記憶在我心中依然清晰。"},{"th":"สถานที่นั้นไกลแสนไกล แต่ภาพยังชัดอยู่","ro":"sà-thǎan-thîi nán glai sɛ̌ɛn glai, dtɛ̀ɛ phâap yang chát yùu","en":"That place is far, far away, but the image is still clear.","zh":"那個地方很遠很遠，但影象仍然清晰。"}]}],"bangkok":[{"scene":"Restaurant Payment｜付款方式與轉帳憑證","sentences":[{"th":"ชำระเป็นแบบไหนดีคะ","ro":"cham-rá bpen bɛ̀ɛp nǎi dii khá","en":"How would you like to pay?","zh":"請問想用哪種方式付款？"},{"th":"โอนแล้วค่ะ ขออนุญาตดูสลิปนะคะ","ro":"oon lɛ́ɛw khâ, khɔ̌ɔ à-nú-yâat duu salìp ná khá","en":"I have transferred already. May I see the payment slip?","zh":"已經轉帳了，麻煩讓我看一下轉帳明細喔。"},{"th":"เงินสดหรือโอนคะ","ro":"ngoen-sòt rʉ̌ʉ oon khá","en":"Cash or transfer?","zh":"現金還是轉帳？"},{"th":"ไม่มีปัญหาใด ๆ ค่ะ","ro":"mâi mii bpan-hǎa dai dai khâ","en":"There is no problem at all.","zh":"一點問題都沒有。"}]},{"scene":"Condo Move｜搬家、習慣與生活路線","sentences":[{"th":"คอนโดสองที่นี้คล้ายกันมาก","ro":"khɔɔn-doo sɔ̌ɔng thîi níi khláai gan mâak","en":"These two condos are very similar.","zh":"這兩個公寓非常相似。"},{"th":"แต่ที่นี้ใกล้ BTS กว่า","ro":"dtɛ̀ɛ thîi níi glâi BTS gwàa","en":"But this one is closer to the BTS.","zh":"但這個更接近BTS。"},{"th":"ถ้าย้ายมาอยู่แถวนี้ ชีวิตประจำวันจะสะดวกขึ้น","ro":"thâa yáai maa yùu thɛ̌ɛw níi, chii-wít bprà-jam wan jà sà-dùak khʉ̂n","en":"If you move to this area, daily life will become more convenient.","zh":"如果你搬到這個地區，日常生活會變得更加便利。"},{"th":"ช่วงแรกอาจจะยังไม่ชินกับทาง","ro":"chûang rɛ̂ɛk àat jà yang mâi chin gàp thaang","en":"At first, you might not be used to the route yet.","zh":"起初，你可能還不習慣這條路線。"}]},{"scene":"BTS / Street｜提醒、趕時間與順路任務","sentences":[{"th":"ระวังรถนะ ตอนนี้คนเยอะมาก","ro":"rá-wang rót ná, dtaawn níi khon yə́ máak","en":"Watch out for cars. There are many people now.","zh":"小心汽車。現在有很多人。"},{"th":"ถ้ายังไม่รีบ มันจะสาย","ro":"thâa yang mâi rîiap, man jà sǎai","en":"If we do not hurry, we will be late.","zh":"如果我們不快點，我們會遲到的。"},{"th":"แวะซื้อของก่อน แล้วค่อยไปหาเขา","ro":"wɛ́ sʉ́ʉ khɔ̌ɔng gɔ̀ɔn, lɛ́ɛw khɔ̂i bpai hǎa khǎo","en":"Stop to buy something first, then go see him.","zh":"先停下來買點東西，然後去找他。"},{"th":"ฝากซื้อชาเย็นให้หน่อยได้ไหม","ro":"fàak sʉ́ʉ chaa yen hâi nɔ̀i dâai mái","en":"Could you buy me an iced tea?","zh":"你能給我買杯冰茶嗎？"}]},{"scene":"Work / School｜主管、專家與修改意見","sentences":[{"th":"หัวหน้าขอให้ตัดส่วนนี้ออก","ro":"hǔa nâa khɔ̌ɔ hâi dtàt sùan níi ɔ̀ɔk","en":"The supervisor asked to remove this part.","zh":"主管要求移除這個部件。"},{"th":"ผู้เชี่ยวชาญบอกว่าเหตุผลนี้ฟังขึ้น","ro":"phûu chîiao-chaan bɔ̀ɔk wâa hèt-phǒn níi fang khʉ̂n","en":"The expert said this reason makes sense.","zh":"專家說這個理由是有道理的。"},{"th":"ช่วยแก้ภาพนี้ให้ชัดขึ้นหน่อย","ro":"chûai gɛ̂ɛ phâap níi hâi chát khʉ̂n nɔ̀i","en":"Please improve this image to make it clearer.","zh":"請改進此影象，使其更清晰。"},{"th":"แต่งสไลด์ให้เรียบหน่อยก็พอ","ro":"dtɛ̀ng slài hâi rîiap nɔ̀i gɔ̂ɔ phɔɔ","en":"Just make the slides look simple and neat.","zh":"只需讓幻燈片看起來簡單整潔。"}]},{"scene":"Friends｜不讓關係被小事拖走","sentences":[{"th":"ใจเย็น ๆ ก่อน อย่าหัวร้อน","ro":"jai yen yen gɔ̀ɔn, yàa hǔa rɔ́ɔn","en":"Calm down first. Do not get worked up.","zh":"先冷靜下來。不要激動。"},{"th":"ไม่น่าพูดแรงขนาดนั้นเลย","ro":"mâi nâa phûut rɛɛng khà-nàat nán ləəy","en":"You should not have spoken that harshly.","zh":"你不應該說得那麼嚴厲。"},{"th":"เรื่องนี้ไม่คุ้มที่จะทะเลาะกัน","ro":"rʉ̂ang níi mâi khúm thîi jà thá-lɔ́ɔ gan","en":"This is not worth arguing over.","zh":"這件事不值得拿來吵。"},{"th":"ถ้าพร้อมแล้ว เราก็ค่อยให้อภัยกัน","ro":"thâa phrɔ́ɔm lɛ́ɛw, rao gɔ̂ɔ khɔ̂i hâi à-phai gan","en":"When we are ready, we can forgive each other.","zh":"當我們準備好時，我們可以互相原諒。"}]},{"scene":"Travel & Song｜期待、距離與依然","sentences":[{"th":"ฉันตั้งตารอที่จะได้เดินทางอีกครั้ง","ro":"chǎn dtâng-dtaa rɔɔ thîi jà dâai dəən-thaang ìik khráng","en":"I am looking forward to getting to travel again.","zh":"我期待著再次旅行。"},{"th":"ถ้าเธอกำลังเดินทางไปไกลแสนไกล","ro":"thâa thəə gam-lang dəən-thaang bpai glai sɛ̌ɛn glai","en":"If you are traveling far, far away.","zh":"如果你旅行很遠，很遠。"},{"th":"ภาพวันนั้นยังคงชัดอยู่ในใจ","ro":"phâap wan nán yang khong chát yùu nai jai","en":"The image of that day still remains clear in my heart.","zh":"那天的畫面在我心中依然清晰。"},{"th":"อย่างน้อยเราก็ได้ลองแล้ว","ro":"yàang nɔ́ɔi rao gɔ̂ɔ dâai lɔɔng lɛ́ɛw","en":"At least we gave it a try.","zh":"至少我們試了一下。"}]}],"practice":[{"title":"1. Vocabulary Recall｜填入最適合的詞","prompts":["「至少我已經努力了」＝อย่างน้อยก็ ________ แล้วyàang nɔ́ɔi gɔ̂ɔ ________ lɛ́ɛwAt least I ________.","「這樣下去會有問題」＝แบบนี้ ________ มีปัญหาbɛ̀ɛp níi ________ mii bpan-hǎaThis way, ________ problems.","「這個問題依然存在」＝ปัญหานี้ ________ มีอยู่bpan-hǎa níi ________ mii yùuThis problem ________."],"answers":[["อย่างน้อยก็พยายามแล้ว","yàang nɔ́ɔi gɔ̂ɔ phá-yaa-yaam lɛ́ɛw","At least I tried.","至少我試過了。"]]},{"title":"2. Choose the Right Word｜選最自然的詞","prompts":["「早知道不該買」：ไม่น่าซื้อเลยmâi nâa sʉ́ʉ ləəyI should not have bought it./ไม่คุ้มเลยmâi khúm ləəyIt is not worth it.","「這個職位他不配」：ไม่คู่ควรกับตำแหน่งนี้mâi khûu-khuan gàp dtam-nɛ̀ng níinot worthy of this position/ไม่คุ้มกับตำแหน่งนี้mâi khúm gàp dtam-nɛ̀ng níinot worth this position","「有任何問題都可以問」：ใด ๆdai daiany at all/ไหนnǎiwhich"],"answers":[["ไม่น่าซื้อเลย","mâi nâa sʉ́ʉ ləəy","I should not have bought it.","我本不應該買它。"]]},{"title":"3. Chinese → Thai｜把語感說完整","prompts":["我已經原諒他了，但還是記得。","這個理由聽起來有道理。","至少我們有試過，所以不覺得可惜。","如果不小心，杯子會掉下來。"],"answers":[["ฉันให้อภัยเขาแล้ว แต่ยังจำได้","chǎn hâi à-phai khǎo lɛ́ɛw, dtɛ̀ɛ yang jam dâai","I have forgiven him, but I still remember.","我已經原諒了他，但我仍然記得。"]]},{"title":"4. Mini Dialogue Completion｜補上最自然的一句","prompts":[],"answers":[["B: ใจเย็น ๆ ก่อน เดี๋ยวมันจะมีปัญหา","B: jai yen yen gɔ̀ɔn, dǐaw man jà mii bpan-hǎa","B: Calm down first. Otherwise, it will cause problems.","B：先冷靜下來。否則，它會造成問題。"]]}],"g":[{"id":"g-compare","title":"近義比較","tth":"คำใกล้เคียง","em":"⚖️","kind":"compare"},{"id":"g-structure","title":"句型結構","tth":"โครงสร้างประโยค","em":"🧩","kind":"structure"},{"id":"g-mistake","title":"常見錯誤","tth":"ข้อผิดพลาดที่พบบ่อย","em":"🚫","kind":"mistake"},{"id":"g-dialogue","title":"情境短對話","tth":"บทสนทนาสั้นๆ","em":"💬","kind":"dialogue"},{"id":"g-sentence","title":"例句庫","tth":"ประโยคตัวอย่าง","em":"📝","kind":"sentence","src":"sentenceBank"},{"id":"g-bangkok","title":"曼谷生活場景","tth":"ฉากชีวิตกรุงเทพ","em":"🏙️","kind":"sentence","src":"bangkok"},{"id":"g-practice","title":"自我測驗","tth":"แบบฝึกหัด","em":"✅","kind":"practice"}]}</script>
<script>

let ROM=true,LANG='zh',isMob=window.innerWidth<769,curPl=null,FILTER='all';
const PROGRESS_KEY='thai_notes_lrn_2026_07_03_v1';
const FAV_KEY='thai_notes_fav_2026_07_03_v1';
function loadProgress(){
 try{const raw=localStorage.getItem(PROGRESS_KEY);const p=raw?JSON.parse(raw):{};return p&&typeof p==='object'&&!Array.isArray(p)?p:{};}catch(e){return{};}
}
function saveProgress(){try{localStorage.setItem(PROGRESS_KEY,JSON.stringify(LRN));}catch(e){console.warn('無法儲存學習進度。',e);}}
function loadFav(){
 try{const raw=localStorage.getItem(FAV_KEY);const p=raw?JSON.parse(raw):{};return p&&typeof p==='object'&&!Array.isArray(p)?p:{};}catch(e){return{};}
}
function saveFav(){try{localStorage.setItem(FAV_KEY,JSON.stringify(FAV));}catch(e){console.warn('無法儲存收藏。',e);}}
let LRN=loadProgress();
let FAV=loadFav();
const D=JSON.parse(document.getElementById('jd').textContent);
const VOCAB=D.vocab,CMP=D.compare,MIS=D.mistakes,DLG=D.dialogues,STR=D.structures,SENB=D.sentenceBank,BKK=D.bangkok,PRC=D.practice,GRP=D.g;
const TITLE='Thai Daily Notes',SUBTITLE='แบบว่า・ตามนี้・เป็นอันว่า';

function speak(t){
 if(!window.speechSynthesis||!t)return;
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);
 u.lang='th-TH';u.rate=0.88;u.pitch=1;
 window.speechSynthesis.speak(u);
}
function playBtn(el,t){
 if(curPl)curPl.classList.remove('pl');
 curPl=el;el.classList.add('pl');speak(t);
 setTimeout(()=>{if(curPl===el)el.classList.remove('pl');},3000);
}
function esc(s){return(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');}
function ab(t,e=''){return `<button class="abtn${e?' '+e:''}" onclick="event.stopPropagation();playBtn(this,'${esc(t)}')" title="播放">▶</button>`;}
function ro(cls,t){return `<div class="${cls}${ROM?'':' hid'}">${t||''}</div>`;}
function enzh(clsEn,clsZh,en,zh){const et=en||zh||'',zt=zh||en||'';return `<div class="${clsEn} lang-en${LANG==='en'?'':' hid'}">${et}</div><div class="${clsZh} lang-zh${LANG==='zh'?'':' hid'}">${zt}</div>`;}

/* ================= Vocabulary card (mirrors QA-50's rQ) ================= */
function rV(v){
 const id=v.i,lrn=LRN[id]?'lrn':'',fav=!!FAV[id];
 const num=parseInt(id.slice(1),10);
 const exHtml=(v.ex&&v.ex[0])?`<div class="ans"><div class="anl">例</div><div class="ant"><div class="anth">${v.ex[0]}</div>${ro('anro',v.ex[1]||'')}${enzh('anen','anzh',v.ex[2],v.ex[3])}</div>${ab(v.ex[0])}</div>`:'';
 const note=v.note?`<div class="note ng"><div class="ng-l">📖 語感筆記</div><div class="ng-t">${v.note}</div></div>`:'';
 const lb=LRN[id]?`<button class="lbtn dn" onclick="event.stopPropagation();tLrn('${id}',this)">↩ 改為未熟悉</button>`
  :`<button class="lbtn" onclick="event.stopPropagation();tLrn('${id}',this)">✓ 標記為熟悉</button>`;
 const favBtn=`<button class="favbtn ${fav?'on':''}" onclick="event.stopPropagation();tFav('${id}',this)">${fav?'★ 已收藏':'☆ 收藏'}</button>`;
 return `<div class="qc ${lrn}" id="${id}">
  <div class="qch" onclick="tCard('${id}')">
   <div class="qcn">${num}</div>
   <div class="qcq"><div class="qcth">${v.th}</div>${ro('qcro',v.ro)}${enzh('qcen','qczh',v.en,v.zh)}</div>
   <div class="qca">${ab(v.th)}<button class="xbtn">▾</button></div>
  </div>
  <div class="qcb"><div class="qcbi"><div class="div"></div>
   <div class="vb-tag" style="margin-bottom:9px;">${v.cat}</div>
   ${exHtml}
   <div class="notes">${note}</div>
   <div class="cft">${favBtn}${lb}</div>
  </div></div>
 </div>`;
}
function rVocabAll(){
 const done=getDoneCount();
 return `<div class="sec-blk" id="g-vocab">
  <div class="sec-hd"><div class="sec-n">📚</div>
   <div class="sec-tts"><div class="sec-tzh">詞彙庫</div><div class="sec-tth">คำศัพท์ทั้งหมด</div></div>
   <div class="sec-chip" id="chip-g-vocab">${done}/${VOCAB.length} 已熟悉</div>
  </div>${VOCAB.map(v=>rV(v)).join('')}
 </div>`;
}

/* ================= Compare (近義比較) ================= */
function rCmpRow(row){
 const termCell=row.term&&row.term[0]
  ?`<div class="cmp-term"><div class="cmp-pat">${row.term[0]}${ab(row.term[0])}</div>${ro('cmp-ex-ro',row.term[1])}${enzh('cmp-ex-en','cmp-ex-zh',row.term[2],row.term[3])}</div>`
  :`<div class="cmp-term"><div class="cmp-pat">—</div></div>`;
 return `<div class="cmp-row">${termCell}<div class="cmp-body"><div class="cmp-mean">${row.meaning||''}</div><div class="cmp-ex"><div class="cmp-ex-line"><div class="cmp-ex-tx"><div class="cmp-ex-th">${row.ex[0]}</div>${ro('cmp-ex-ro',row.ex[1])}${enzh('cmp-ex-en','cmp-ex-zh',row.ex[2],row.ex[3])}</div>${ab(row.ex[0])}</div></div></div></div>`;
}
function rCmpCard(c,i){
 return `<div class="cmp-card" id="CMP-${i}"><div class="cmp-title">${c.title}</div>${c.intro?`<div class="cmp-intro">${c.intro}</div>`:''}<div class="cmp-list">${c.rows.map(rCmpRow).join('')}</div>${c.tip?`<div class="cmp-tip">${c.tip}</div>`:''}</div>`;
}
function rCmpSec(){
 return `<div class="apx" id="g-compare"><div class="apx-hd"><div class="apx-ic">⚖️</div><div class="apx-tit"><div class="apx-tzh">近義比較</div><div class="apx-tth">คำใกล้เคียงที่ต้องแยกให้ออก</div></div></div>
  ${CMP.map((c,i)=>rCmpCard(c,i)).join('')}
 </div>`;
}

/* ================= Mistakes (常見錯誤) ================= */
function rMisBox(cls,label,box){
 if(!box)return'';
 return `<div class="mis-box ${cls}"><div class="mis-lbl">${label}</div><div class="mis-tx"><div class="mis-th">${box.th}</div>${ro('mis-ro',box.ro)}${enzh('mis-en','mis-zh',box.en,box.zh)}</div>${ab(box.th)}</div>`;
}
function rMisCard(m,i){
 return `<div class="mis-card" id="MIS-${i}">
  <div class="mis-title">${m.title}</div>
  ${rMisBox('mis-wrong',(m.wrong&&m.wrong.label)?m.wrong.label:'Wrong',m.wrong)}
  ${rMisBox('mis-better',(m.better&&m.better.label)?m.better.label:'Better',m.better)}
  ${m.why?`<div class="mis-why">💡 ${m.why}</div>`:''}
 </div>`;
}
function rMisSec(){
 return `<div class="apx" id="g-mistake"><div class="apx-hd"><div class="apx-ic">🚫</div><div class="apx-tit"><div class="apx-tzh">常見錯誤</div><div class="apx-tth">ข้อผิดพลาดที่พบบ่อย</div></div></div>
  ${MIS.map((m,i)=>rMisCard(m,i)).join('')}
 </div>`;
}

/* ================= Structures (句型結構) ================= */
function rStrExample(ex){
 return `<div class="str-ex"><div style="display:flex;align-items:flex-start;gap:8px;"><div><div class="str-th">${ex[0]}</div>${ro('str-ro',ex[1])}${enzh('str-en','str-zh',ex[2],ex[3])}</div>${ab(ex[0])}</div></div>`;
}
function rStrCard(st,i){
 const examples=(st.examples&&st.examples.length)?st.examples:(st.ex?[st.ex]:[]);
 return `<div class="str-card" id="STR-${i}">
  <div class="str-title">${st.title}</div>
  ${st.meaning?`<div class="str-mean">${st.meaning}</div>`:''}
  ${examples.map(rStrExample).join('')}
 </div>`;
}
function rStrSec(){
 return `<div class="apx" id="g-structure"><div class="apx-hd"><div class="apx-ic">🧩</div><div class="apx-tit"><div class="apx-tzh">句型結構</div><div class="apx-tth">โครงสร้างประโยคที่ใช้บ่อย</div></div></div>
  <div class="str-grid">${STR.map((st,i)=>rStrCard(st,i)).join('')}</div>
 </div>`;
}

/* ================= Dialogues (情境短對話) ================= */
function rDlgTurn(t){
 const side=t.side==='left'?'l':'r';
 return `<div class="dlg-row ${side}"><div class="dlg-bub"><div class="dlg-spk">${t.speaker}</div><div style="display:flex;align-items:flex-start;gap:8px;"><div><div class="dlg-th">${t.th}</div>${ro('dlg-ro',t.ro)}${enzh('dlg-en','dlg-zh',t.en,t.zh)}</div>${ab(t.th)}</div></div></div>`;
}
function rDlgCard(d,i){
 return `<div class="dlg-card" id="DLG-${i}">
  <div class="dlg-title">${d.title}</div>
  <div class="dlg-thread">${d.turns.map(rDlgTurn).join('')}</div>
 </div>`;
}
function rDlgSec(){
 return `<div class="apx" id="g-dialogue"><div class="apx-hd"><div class="apx-ic">💬</div><div class="apx-tit"><div class="apx-tzh">情境短對話</div><div class="apx-tth">บทสนทนาสั้นๆ</div></div></div>
  ${DLG.map((d,i)=>rDlgCard(d,i)).join('')}
 </div>`;
}

/* ================= Sentence groups (例句庫 / 曼谷場景) ================= */
function rSenItem(s){
 return `<div class="sen-item"><div><div class="sen-th">${s.th}</div>${ro('sen-ro',s.ro)}${enzh('sen-en','sen-zh',s.en,s.zh)}</div>${ab(s.th)}</div>`;
}
function rSenGroup(grp,gi,idPrefix){
 return `<div class="sen-group" id="${idPrefix}-${gi}">
  <div class="sen-scene">${grp.scene}</div>
  <div class="sen-grid">${grp.sentences.map(rSenItem).join('')}</div>
 </div>`;
}
function rSenSec(list,secId,title,tth,em,idPrefix){
 return `<div class="apx" id="${secId}"><div class="apx-hd"><div class="apx-ic">${em}</div><div class="apx-tit"><div class="apx-tzh">${title}</div><div class="apx-tth">${tth}</div></div></div>
  ${list.map((g,gi)=>rSenGroup(g,gi,idPrefix)).join('')}
 </div>`;
}

/* ================= Practice (自我測驗) ================= */
function rPrcCard(p,i){
 const prompts=(p.prompts&&p.prompts.length)?p.prompts:(p.prompt?[p.prompt]:[]);
 const answers=(p.answers&&p.answers.length)?p.answers:(p.ans?[p.ans]:[]);
 const promptHtml=prompts.map(t=>`<div class="prc-prompt">${t}</div>`).join('');
 const ansHtml=answers.map(a=>`<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;"><div><div class="str-th">${a[0]}</div>${ro('str-ro',a[1])}${enzh('str-en','str-zh',a[2],a[3])}</div>${ab(a[0])}</div>`).join('');
 return `<div class="prc-card" id="PRC-${i}">
  <div class="prc-title">Q${i+1}｜${p.title||''}</div>
  ${promptHtml}
  <div class="prc-ans-wrap">
   <button class="prc-ans-btn" onclick="tPrc(${i})" id="prc-btn-${i}">👁 顯示答案</button>
   <div class="prc-ans" id="prc-ans-${i}">
    ${ansHtml}
   </div>
  </div>
 </div>`;
}
function rPrcSec(){
 return `<div class="apx" id="g-practice"><div class="apx-hd"><div class="apx-ic">✅</div><div class="apx-tit"><div class="apx-tzh">自我測驗</div><div class="apx-tth">แบบฝึกหัดทบทวนตัวเอง</div></div></div>
  ${PRC.map((p,i)=>rPrcCard(p,i)).join('')}
 </div>`;
}
function tPrc(i){
 const el=document.getElementById('prc-ans-'+i);
 const btn=document.getElementById('prc-btn-'+i);
 const show=el.classList.toggle('show');
 btn.textContent=show?'🙈 隱藏答案':'👁 顯示答案';
}

function rGroups(){
 return GRP.map(g=>{
  if(g.kind==='compare')return rCmpSec();
  if(g.kind==='mistake')return rMisSec();
  if(g.kind==='structure')return rStrSec();
  if(g.kind==='dialogue')return rDlgSec();
  if(g.kind==='practice')return rPrcSec();
  if(g.kind==='sentence'&&g.src==='sentenceBank')return rSenSec(SENB,g.id,g.title,g.tth,g.em,'SB');
  if(g.kind==='sentence'&&g.src==='bangkok')return rSenSec(BKK,g.id,g.title,g.tth,g.em,'BK');
  return '';
 }).join('');
}

/* ================= 我的收藏 ================= */
function renderFavSec(){
 const el=document.getElementById('favSec');
 if(!el)return;
 const ids=Object.keys(FAV).filter(k=>FAV[k]);
 if(!ids.length){
  el.innerHTML=`<div class="sec-hd"><div class="sec-n">⭐</div><div class="sec-tts"><div class="sec-tzh">我的收藏</div><div class="sec-tth">รายการโปรดของฉัน</div></div></div><div class="empty-fav">還沒有收藏，點單字卡上的「☆ 收藏」把它加進這裡，方便之後複習。</div>`;
  return;
 }
 const cards=ids.map(id=>{
  const v=VOCAB.find(x=>x.i===id);
  if(!v)return '';
  return `<div class="sres-item" onclick="jumpTo('${id}')"><span class="sres-tag">詞彙</span><div class="sres-b"><div class="sres-th">${v.th}</div>${ro('sres-ro',v.ro)}${enzh('sres-en','sres-zh',v.en,v.zh)}</div>${ab(v.th)}</div>`;
 }).join('');
 el.innerHTML=`<div class="sec-hd"><div class="sec-n">⭐</div><div class="sec-tts"><div class="sec-tzh">我的收藏</div><div class="sec-tth">รายการโปรดของฉัน</div></div><div class="sec-chip">${ids.length} 筆</div></div><div class="sres-list">${cards}</div>`;
}
function tFav(id,btn){
 FAV[id]=!FAV[id];
 if(!FAV[id])delete FAV[id];
 saveFav();
 if(btn){btn.classList.toggle('on',!!FAV[id]);btn.textContent=FAV[id]?'★ 已收藏':'☆ 收藏';}
 renderFavSec();
 const navB=document.getElementById('nav-favSec-badge');
 if(navB)navB.textContent=Object.keys(FAV).filter(k=>FAV[k]).length;
}

/* ================= Sidebar / Content shell ================= */
function getDoneCount(){return VOCAB.filter(v=>LRN[v.i]).length;}

function rSB(){
 const done=getDoneCount();
 const total=VOCAB.length;
 const totalPct=Math.round(done/total*100);
 const favCount=Object.keys(FAV).filter(k=>FAV[k]).length;
 let h=`<div class="sb-book"><div class="sb-th">${TITLE}</div><div class="sb-zh">${SUBTITLE}</div><div class="sb-ct" id="sb-total">✓ ${done}/${total} 已熟悉</div><div class="sb-track" aria-label="學習進度"><div class="sb-track-fill" id="sb-track-fill" style="width:${totalPct}%"></div></div><div class="sb-filter" aria-label="熟悉狀態篩選"><button class="filter-btn ${FILTER==='all'?'on':''}" data-filter="all" onclick="setFilter('all')">全部</button><button class="filter-btn ${FILTER==='learned'?'on':''}" data-filter="learned" onclick="setFilter('learned')">已熟悉</button><button class="filter-btn ${FILTER==='unlearned'?'on':''}" data-filter="unlearned" onclick="setFilter('unlearned')">未熟悉</button></div><div class="sb-actions"><button class="sb-btn" onclick="resetProgress()">重設進度</button></div><div class="sb-save-note">進度與收藏會記在目前這台裝置的瀏覽器中。</div></div>
  <div class="nav-grp"><div class="nit" id="nav-favSec" onclick="goto('favSec')"><div class="nit-em">⭐</div><div class="nit-tx"><div class="nit-t">我的收藏</div></div><div class="nit-b" id="nav-favSec-badge">${favCount}</div></div></div>
  <div class="nav-grp"><div class="nav-lbl">詞彙</div>
   <div class="nit" id="nav-g-vocab" onclick="goto('g-vocab')"><div class="nit-em">📚</div><div class="nit-tx"><div class="nit-t">詞彙庫</div></div><div class="nit-b" id="nav-count-g-vocab">${done}/${total}</div></div>
   <div class="nprog"><div class="nprog-b" id="nav-prog-g-vocab" style="width:${totalPct}%"></div></div>
  </div>
  <div class="nav-grp"><div class="nav-lbl">延伸內容</div>`;
 GRP.forEach(g=>{
  h+=`<div class="nit" id="nav-${g.id}" onclick="goto('${g.id}')"><div class="nit-em">${g.em}</div><div class="nit-tx"><div class="nit-t">${g.title}</div><div class="nit-s">${g.tth}</div></div></div>`;
 });
 h+=`</div>`;
 document.getElementById('sb').innerHTML=h;
}

function rCnt(){
 document.getElementById('cnt').innerHTML=`<div id="normalView">
   <div class="sec-blk" id="favSec"></div>
   ${rVocabAll()}
   ${rGroups()}
  </div>
  <div id="searchView" class="hid-view"></div>`;
 renderFavSec();
}

function tCard(id){document.getElementById(id).classList.toggle('exp');}
function updateKnownCard(id){
 const known=!!LRN[id];
 const c=document.getElementById(id);
 if(!c)return;
 c.classList.toggle('lrn',known);
 const n=c.querySelector('.qcn');
 if(n)n.style.background=known?'var(--gl)':'var(--gd)';
 const btn=c.querySelector('.lbtn');
 if(btn){
  btn.textContent=known?'↩ 改為未熟悉':'✓ 標記為熟悉';
  btn.classList.toggle('dn',known);
  btn.setAttribute('aria-pressed',String(known));
 }
}
function refreshProgress(){
 const done=getDoneCount(),total=VOCAB.length,pct=Math.round(done/total*100);
 const totalEl=document.getElementById('sb-total');
 const trackEl=document.getElementById('sb-track-fill');
 if(totalEl)totalEl.textContent=`✓ ${done}/${total} 已熟悉`;
 if(trackEl)trackEl.style.width=`${pct}%`;
 const chip=document.getElementById('chip-g-vocab');
 const count=document.getElementById('nav-count-g-vocab');
 const bar=document.getElementById('nav-prog-g-vocab');
 if(chip)chip.textContent=`${done}/${total} 已熟悉`;
 if(count)count.textContent=`${done}/${total}`;
 if(bar)bar.style.width=`${pct}%`;
}
function applyFilter(){
 VOCAB.forEach(v=>{
  const c=document.getElementById(v.i);
  if(!c)return;
  const known=!!LRN[v.i];
  const hide=(FILTER==='learned'&&!known)||(FILTER==='unlearned'&&known);
  c.classList.toggle('filtered-out',hide);
 });
 const vsec=document.getElementById('g-vocab');
 if(vsec){
  const visible=[...vsec.querySelectorAll('.qc')].some(c=>!c.classList.contains('filtered-out'));
  vsec.classList.toggle('filtered-out',!visible);
 }
 document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('on',b.dataset.filter===FILTER));
}
function setFilter(mode){FILTER=mode;applyFilter();}
function tLrn(id,btn){
 LRN[id]=!LRN[id];
 if(!LRN[id])delete LRN[id];
 updateKnownCard(id);
 saveProgress();
 refreshProgress();
 applyFilter();
}
function resetProgress(){
 if(!getDoneCount())return;
 if(!window.confirm('確定要把所有單字改回未熟悉嗎？'))return;
 LRN={};
 VOCAB.forEach(v=>updateKnownCard(v.i));
 saveProgress();
 refreshProgress();
 applyFilter();
}
function syncProgressFromStorage(){
 LRN=loadProgress();
 VOCAB.forEach(v=>updateKnownCard(v.i));
 refreshProgress();
 applyFilter();
}
function goto(id){
 const el=document.getElementById(id);
 if(el){el.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>setAct(id),400);}
 if(isMob)document.getElementById('sb').classList.remove('mob-open');
}
function setAct(id){
 document.querySelectorAll('.nit').forEach(n=>n.classList.remove('act'));
 const nav=document.getElementById('nav-'+id);if(nav)nav.classList.add('act');
}
function toggleSB(){
 const sb=document.getElementById('sb');
 if(isMob)sb.classList.toggle('mob-open');else sb.classList.toggle('col');
}

function toggleLang(){
 LANG=LANG==='zh'?'en':'zh';
 document.querySelectorAll('.lang-en').forEach(e=>e.classList.toggle('hid',LANG!=='en'));
 document.querySelectorAll('.lang-zh').forEach(e=>e.classList.toggle('hid',LANG!=='zh'));
 const b=document.getElementById('btnL');
 b.classList.toggle('on',LANG==='en');
 b.setAttribute('aria-pressed',String(LANG==='en'));
 b.textContent=LANG==='zh'?'中文':'EN';
}
function toggleRom(){
 ROM=!ROM;
 document.querySelectorAll('.qcro,.anro,.furo,.prom,.vro,.fro,.ptro,.par-ro,.sro,.cmp-ex-ro,.mis-ro,.str-ro,.dlg-ro,.sen-ro,.sres-ro').forEach(e=>e.classList.toggle('hid',!ROM));
 const b=document.getElementById('btnR');
 b.classList.toggle('on',ROM);
 b.setAttribute('aria-pressed',String(ROM));
 b.textContent=ROM?'拼音 ✓':'拼音 ✗';
}
function syncViewportMode(){
 const nextMob=window.innerWidth<769;
 const sb=document.getElementById('sb');
 if(nextMob!==isMob){isMob=nextMob;sb.classList.remove('col','mob-open');}
}
function initSpy(){
 const ids=['favSec','g-vocab',...GRP.map(g=>g.id)];
 const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)setAct(e.target.id);});},{threshold:0.15,rootMargin:'-52px 0px -70% 0px'});
 ids.forEach(id=>{const el=document.getElementById(id);if(el)obs.observe(el);});
}

/* ================= 全域搜尋 ================= */
let SEARCH_INDEX=[];
function buildIndex(){
 const idx=[];
 VOCAB.forEach(v=>{
  idx.push({id:v.i,tag:'詞彙庫',th:v.th,ro:v.ro,en:v.en,zh:v.zh||'',
   blob:[v.th,v.ro,v.en,v.zh||'',v.note||'',...(v.ex||[])].join(' ')});
 });
 CMP.forEach((c,i)=>{
  if(c.rows&&c.rows.length){
   c.rows.forEach(row=>{
    const termTh=(row.term&&row.term[0])?row.term[0]:row.ex[0];
    const termRo=(row.term&&row.term[1])?row.term[1]:row.ex[1];
    idx.push({id:'CMP-'+i,tag:'近義比較・'+c.title,th:termTh,ro:termRo,zh:(row.meaning||'')+'　'+row.ex[2],
     blob:[c.title,c.intro||'',(row.term||[]).join(' '),row.meaning||'',row.ex.join(' ')].join(' ')});
   });
  } else {
   idx.push({id:'CMP-'+i,tag:'近義比較',th:c.title,ro:'',zh:c.tip||c.intro||'',blob:c.title+' '+(c.tip||'')+' '+(c.intro||'')});
  }
 });
 MIS.forEach((m,i)=>{
  const w=m.wrong||{},b=m.better||{};
  idx.push({id:'MIS-'+i,tag:'常見錯誤',th:(w.th||'')+' → '+(b.th||''),ro:b.ro||'',en:b.en||'',zh:(b.zh||'')+'　'+m.title+'：'+(m.why||''),
   blob:[m.title,w.th||'',w.ro||'',w.en||'',w.zh||'',b.th||'',b.ro||'',b.en||'',b.zh||'',m.why||''].join(' ')});
 });
 STR.forEach((st,i)=>{
  const examples=(st.examples&&st.examples.length)?st.examples:(st.ex?[st.ex]:[]);
  const first=examples[0]||['','',''];
  idx.push({id:'STR-'+i,tag:'句型結構',th:first[0]||st.title,ro:first[1]||'',en:first[2]||'',zh:(first[3]||'')+'　'+st.title+'　'+(st.meaning||''),
   blob:[st.title,st.meaning||'',examples.map(e=>e.join(' ')).join(' ')].join(' ')});
 });
 DLG.forEach((d,i)=>{
  d.turns.forEach(t=>{
   idx.push({id:'DLG-'+i,tag:'情境對話・'+d.title,th:t.th,ro:t.ro,en:t.en,zh:t.zh||'',
    blob:[d.title,t.speaker,t.th,t.ro,t.en,t.zh||''].join(' ')});
  });
 });
 SENB.forEach((g,gi)=>{
  g.sentences.forEach(s=>{
   idx.push({id:'SB-'+gi,tag:'例句庫・'+g.scene,th:s.th,ro:s.ro,en:s.en,zh:s.zh||'',blob:[g.scene,s.th,s.ro,s.en,s.zh||''].join(' ')});
  });
 });
 BKK.forEach((g,gi)=>{
  g.sentences.forEach(s=>{
   idx.push({id:'BK-'+gi,tag:'曼谷場景・'+g.scene,th:s.th,ro:s.ro,en:s.en,zh:s.zh||'',blob:[g.scene,s.th,s.ro,s.en,s.zh||''].join(' ')});
  });
 });
 PRC.forEach((p,i)=>{
  const prompts=(p.prompts&&p.prompts.length)?p.prompts:(p.prompt?[p.prompt]:[]);
  const answers=(p.answers&&p.answers.length)?p.answers:(p.ans?[p.ans]:[]);
  idx.push({id:'PRC-'+i,tag:'自我測驗',th:prompts.join(' / ')||p.title||'',ro:'',zh:answers.map(a=>a.join(' ')).join(' / '),
   blob:[p.title||'',prompts.join(' '),answers.map(a=>a.join(' ')).join(' ')].join(' ')});
 });
 SEARCH_INDEX=idx;
}
function doSearch(qstr){
 const q=(qstr||'').trim().toLowerCase();
 const nv=document.getElementById('normalView'),sv=document.getElementById('searchView'),clearBtn=document.getElementById('searchClear');
 if(clearBtn)clearBtn.classList.toggle('show',q.length>0);
 if(!q){nv.classList.remove('hid-view');sv.classList.add('hid-view');sv.innerHTML='';return;}
 nv.classList.add('hid-view');sv.classList.remove('hid-view');
 const matches=SEARCH_INDEX.filter(it=>it.blob.toLowerCase().includes(q));
 const seen=new Set(),uniq=[];
 for(const m of matches){const key=m.id+'|'+m.th;if(seen.has(key))continue;seen.add(key);uniq.push(m);if(uniq.length>=60)break;}
 if(!uniq.length){sv.innerHTML=`<div class="sres-hd">沒有找到符合的內容，換個關鍵字試試。</div>`;return;}
 sv.innerHTML=`<div class="sres-hd">找到 ${uniq.length} 筆符合的內容</div><div class="sres-list">${uniq.map(m=>
  `<div class="sres-item" onclick="jumpTo('${m.id}')"><span class="sres-tag">${m.tag}</span><div class="sres-b"><div class="sres-th">${m.th}</div>${m.ro?ro('sres-ro',m.ro):''}${enzh('sres-en','sres-zh',m.en,m.zh)}</div>${ab(m.th)}</div>`
 ).join('')}</div>`;
}
function clearSearch(){
 const input=document.getElementById('searchInput');
 if(input)input.value='';
 doSearch('');
}
function jumpTo(id){
 clearSearch();
 setTimeout(()=>{
  const el=document.getElementById(id);
  if(!el)return;
  if(id[0]==='V')el.classList.add('exp');
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.classList.add('flash');
  setTimeout(()=>el.classList.remove('flash'),1500);
  const parentSec=el.closest('.sec-blk')||el.closest('.apx');
  setAct(parentSec?parentSec.id:id);
  if(isMob)document.getElementById('sb').classList.remove('mob-open');
 },60);
}

rSB();rCnt();refreshProgress();applyFilter();initSpy();buildIndex();
window.addEventListener('resize',syncViewportMode);
window.addEventListener('storage',e=>{
 if(e.key===PROGRESS_KEY)syncProgressFromStorage();
 if(e.key===FAV_KEY){FAV=loadFav();rCnt();initSpy();}
});

</script>
