.top-r{display:flex;gap:6px;}.cbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 11px;border-radius:6px;cursor:pointer;font-size:12px;font-family:var(--fu);transition:all .15s;white-space:nowrap;}.cbtn:hover{background:rgba(255,255,255,.22);}.cbtn.on{background:var(--acc);border-color:var(--acc);}.cbtn:focus-visible,.lbtn:focus-visible,.sb-btn:focus-visible,.filter-btn:focus-visible,.abtn:focus-visible,.xbtn:focus-visible,.burg:focus-visible{outline:2px solid #fff;outline-offset:2px;}
.lay{display:flex;margin-top:52px;height:calc(100vh - 52px);}
.sb{width:258px;flex-shrink:0;background:var(--sb);overflow-y:auto;overflow-x:hidden;transition:width .22s;scrollbar-width:thin;scrollbar-color:var(--sba) var(--sb);}
.sb.col{width:0;}.sb-book{padding:18px 16px 12px;border-bottom:1px solid rgba(255,255,255,.07);}
.sb-th{font-family:var(--ft);font-size:26px;font-weight:700;color:var(--sbti);}.sb-zh{font-family:var(--fz);font-size:10px;color:var(--sbt);margin-top:3px;opacity:.75;}.sb-ct{font-size:10px;color:var(--acc);font-weight:700;margin-top:8px;}.sb-track{height:4px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin-top:7px;}.sb-track-fill{height:100%;width:0;background:var(--acc);border-radius:inherit;transition:width .25s ease;}.sb-actions,.sb-filter{display:flex;gap:6px;margin-top:9px;}.sb-btn,.filter-btn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--sbt);font-family:var(--fz);font-size:10px;line-height:1;padding:6px 8px;border-radius:6px;cursor:pointer;transition:all .15s;}.sb-btn:hover,.filter-btn:hover,.filter-btn.on{background:var(--sba);border-color:rgba(255,255,255,.32);color:var(--sbti);}.sb-btn{color:rgba(255,255,255,.65);}.sb-save-note{font-family:var(--fz);font-size:9px;line-height:1.45;color:rgba(181,212,192,.5);margin-top:8px;}.nit-b{min-width:34px;}

.nit{display:flex;align-items:center;gap:9px;padding:8px 16px;cursor:pointer;color:var(--sbt);font-size:12.5px;transition:background .12s;border-left:3px solid transparent;user-select:none;}.nit:hover{background:var(--sbh);}.nit.act{background:var(--sba);border-left-color:var(--acc);color:var(--sbti);}

.abtn{width:33px;height:33px;border-radius:50%;border:none;cursor:pointer;background:var(--gd);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;flex-shrink:0;}.abtn:hover{background:var(--gm);transform:scale(1.06);}.abtn.pl{background:var(--acc);animation:pulse 1s infinite;}

.qcb{max-height:0;overflow:hidden;transition:max-height .32s ease;}.qc.exp .qcb{max-height:900px;}.qcbi{padding:0 15px 15px;}.div{height:1px;background:var(--bdl);margin:0 -15px 14px;}
.ans{display:flex;align-items:flex-start;gap:11px;padding:9px 11px;border-radius:8px;background:rgba(61,43,36,.045);margin-bottom:8px;}
.anl{flex-shrink:0;width:23px;height:23px;border-radius:50%;background:var(--gd);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:2px;}
.ant{flex:1;min-width:0;}.anth{font-family:var(--ft);font-size:18px;font-weight:500;color:var(--thai);line-height:1.4;}
.anro{font-family:var(--ft);font-size:11.5px;color:var(--rom);font-style:italic;margin-top:2px;}.anzh{font-family:var(--fz);font-size:12px;color:var(--mu);margin-top:3px;}
.subs{margin-top:11px;}.sub-lbl{font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px;}
.sub-chips{display:flex;flex-wrap:wrap;gap:5px;}.schip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:18px;cursor:pointer;background:transparent;border:1px solid var(--bd);transition:all .15s;}.schip:hover{background:var(--accl);border-color:var(--acc);}
.sch-th{font-family:var(--ft);color:var(--thai);font-size:14px;}.sch-zh{font-family:var(--fz);color:var(--mu);font-size:11px;}

.futh{font-family:var(--ft);font-size:17px;color:var(--thai);}.furo{font-family:var(--ft);font-size:11.5px;color:var(--rom);font-style:italic;margin-top:2px;}.fuzh{font-family:var(--fz);font-size:12px;color:var(--mu);margin-top:3px;}

.par-zh{font-family:var(--fz);font-size:13px;font-weight:600;color:var(--t);}.par-ex{font-family:var(--ft);font-size:13px;color:var(--mu);margin-top:2px;}

/* ===== Extended handout styles v2 (vocab-driven, QA-50 architecture) ===== */
.favbtn{display:flex;align-items:center;gap:5px;padding:5px 13px;border-radius:18px;border:1px solid var(--bd);background:transparent;font-size:11px;color:var(--mu);cursor:pointer;font-family:var(--fz);transition:all .15s;margin-right:6px;}

.cft{justify-content:space-between!important;}

@keyframes flashHi{0%{box-shadow:0 0 0 5px rgba(200,154,58,.55);}100%{box-shadow:0 0 0 0 rgba(200,154,58,0);}}

.empty-fav{padding:16px;text-align:center;color:var(--mu);font-family:var(--fz);font-size:12.5px;background:var(--bgc);border:1px dashed var(--bd);border-radius:10px;}

/* search */
.stop-wrap{position:relative;flex:1;max-width:340px;margin:0 10px;}
.sinput{width:100%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:7px 30px 7px 11px;font-size:12.5px;font-family:var(--fz);outline:none;}
.sinput::placeholder{color:rgba(255,255,255,.5);}
.sinput:focus{background:rgba(255,255,255,.18);}
.sclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:13px;display:none;}
.sclear.show{display:block;}
.sres-hd{font-family:var(--fz);font-size:13px;color:var(--mu);margin:0 0 12px;padding-bottom:10px;border-bottom:2px solid var(--bd);}
.sres-list{display:flex;flex-direction:column;gap:8px;}
.sres-item{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-radius:10px;background:var(--bgc);border:1px solid var(--bdl);cursor:pointer;transition:all .15s;}
.sres-item:hover{border-color:var(--gl);box-shadow:0 2px 8px rgba(0,0,0,.06);}
.sres-tag{flex-shrink:0;font-size:9.5px;font-weight:700;color:var(--acc);background:var(--accl);border:1px solid rgba(200,154,58,.3);padding:3px 8px;border-radius:20px;white-space:nowrap;margin-top:2px;}
.sres-b{flex:1;min-width:0;}
.sres-th{font-family:var(--ft);font-size:16px;color:var(--thai);}
.sres-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:1px;}
.sres-zh{font-family:var(--fz);font-size:12px;color:var(--mu);margin-top:2px;}
.hid-view{display:none!important;}

/* compare */
.cmp-card{background:var(--bgc);border:1px solid var(--bdl);border-radius:10px;padding:15px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.cmp-title{font-family:var(--fz);font-size:14.5px;font-weight:700;color:var(--t);margin:0 0 5px;line-height:1.55;}
.cmp-intro{font-family:var(--fz);font-size:12px;color:var(--mu);line-height:1.6;margin-bottom:4px;}
.cmp-list{display:block;}
.cmp-row{display:grid;grid-template-columns:minmax(125px,175px) minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--bdl);align-items:start;}
.cmp-list .cmp-row:first-child{border-top:none;}
.cmp-term{min-width:0;}
.cmp-pat{display:flex;align-items:flex-start;gap:5px;font-family:var(--ft);font-size:16px;line-height:1.4;color:var(--acc);font-weight:700;}
.cmp-pat .abtn{margin-top:0;}
.cmp-ex-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:2px;overflow-wrap:anywhere;}
.cmp-ex-en,.cmp-ex-zh{font-family:var(--fz);font-size:11.5px;color:var(--mu);margin-top:3px;line-height:1.5;}
.cmp-body{min-width:0;}
.cmp-ex{margin-top:7px;padding:8px 10px;border-radius:8px;background:rgba(65,40,47,.045);}
.cmp-ex-line{display:flex;align-items:flex-start;gap:8px;}
.cmp-ex-tx{flex:1;min-width:0;}
.cmp-ex-th{font-family:var(--ft);font-size:15px;color:var(--thai);line-height:1.45;}
.cmp-tip{margin-top:10px;padding:9px 11px;border-radius:8px;background:var(--bgh);border:1px solid var(--bdl);font-family:var(--fz);font-size:12px;color:var(--tm);line-height:1.65;}
@media(max-width:640px){.cmp-row{grid-template-columns:1fr;gap:7px;padding:11px 0}.cmp-pat{font-size:16px}.cmp-ex{margin-top:6px}}

/* mistakes */
.mis-card{background:var(--bgc);border:1px solid var(--bdl);border-radius:10px;padding:15px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.mis-title{font-family:var(--fz);font-size:14.5px;font-weight:700;color:var(--t);margin-bottom:10px;}
.mis-box{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:8px;margin-bottom:8px;}
.mis-wrong{background:rgba(200,60,50,.07);border:1px solid rgba(200,60,50,.18);}
.mis-better{background:rgba(192,138,62,.1);border:1px solid rgba(192,138,62,.24);}
.mis-lbl{flex-shrink:0;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:3px 7px;border-radius:5px;margin-top:2px;}
.mis-wrong .mis-lbl{background:#c0392b;color:#fff;}
.mis-better .mis-lbl{background:var(--gl);color:#fff;}
.mis-tx{flex:1;}
.mis-th{font-family:var(--ft);font-size:15px;color:var(--thai);}
.mis-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:1px;}
.mis-en{font-family:var(--fz);font-size:11.5px;color:var(--mu);margin-top:2px;}
.mis-why{font-family:var(--fz);font-size:12.5px;color:var(--tm);line-height:1.65;padding:9px 11px;border-radius:8px;background:#f8f5f1;border:1px solid var(--bdl);}

/* structures */
.str-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
.str-card{background:var(--bgc);border:1px solid var(--bdl);border-left:4px solid var(--gl);border-radius:10px;padding:13px 14px;}
.str-title{font-family:var(--fz);font-size:13.5px;font-weight:700;color:var(--t);}
.str-mean{font-family:var(--fz);font-size:11.5px;color:var(--mu);margin-top:5px;line-height:1.55;}
.str-ex{margin-top:9px;padding:8px 10px;border-radius:8px;background:rgba(61,43,36,.045);}
.str-th{font-family:var(--ft);font-size:15px;color:var(--thai);}
.str-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:1px;}
.str-en{font-family:var(--fz);font-size:11px;color:var(--mu);margin-top:2px;}

/* dialogues */
.dlg-card{background:var(--bgc);border:1px solid var(--bdl);border-radius:10px;padding:15px;margin-bottom:12px;}
.dlg-title{font-family:var(--fz);font-size:14.5px;font-weight:700;color:var(--t);margin-bottom:11px;}
.dlg-thread{display:flex;flex-direction:column;gap:9px;}
.dlg-row{display:flex;width:100%;}
.dlg-row.l{justify-content:flex-start;}.dlg-row.r{justify-content:flex-end;}
.dlg-bub{max-width:76%;border:1px solid var(--bdl);border-radius:14px;padding:9px 12px;background:#fff;}
.dlg-row.l .dlg-bub{border-top-left-radius:4px;background:#f6faf7;}
.dlg-row.r .dlg-bub{border-top-right-radius:4px;background:#fbf8f0;}
.dlg-spk{font-size:10px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.dlg-th{font-family:var(--ft);font-size:15px;color:var(--thai);}
.dlg-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:1px;}
.dlg-en{font-family:var(--fz);font-size:11.5px;color:var(--mu);margin-top:2px;}

/* sentence groups */
.sen-group{margin-bottom:16px;}
.sen-scene{display:inline-flex;font-size:11px;font-weight:700;color:#fff;background:var(--gm);padding:4px 11px;border-radius:20px;margin-bottom:9px;}
.sen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;}
.sen-item{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:8px;background:var(--bgc);border:1px solid var(--bdl);}
.sen-th{font-family:var(--ft);font-size:14.5px;color:var(--thai);}
.sen-ro{font-family:var(--ft);font-size:10.5px;color:var(--rom);font-style:italic;margin-top:1px;}
.sen-en{font-family:var(--fu);font-size:11px;color:#6b7280;margin-top:2px;}
.qcen,.anen,.sres-en,.mis-en,.str-en,.dlg-en,.cmp-ex-en{font-family:var(--fu);color:#6b7280;}
.qczh,.anzh,.sres-zh,.mis-zh,.str-zh,.dlg-zh,.sen-zh,.cmp-ex-zh{font-family:var(--fz);color:var(--tm);margin-top:3px;line-height:1.55;}
.qcen{font-size:12px;margin-top:3px}.qczh{font-size:13px}.anen,.anzh,.mis-zh,.str-zh,.dlg-zh,.sen-zh,.sres-en,.sres-zh{font-size:11.5px}

/* practice */
.prc-card{background:var(--bgc);border:1px solid var(--bdl);border-radius:10px;padding:13px 14px;margin-bottom:9px;}
.prc-title{font-size:10px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.6px;}
.prc-prompt{font-family:var(--fz);font-size:13.5px;color:var(--t);margin-top:5px;line-height:1.6;}
.prc-ans-wrap{margin-top:9px;}
.prc-ans-btn{font-family:var(--fz);font-size:11.5px;color:var(--gm);background:none;border:1px solid var(--bd);border-radius:16px;padding:5px 12px;cursor:pointer;}
.prc-ans-btn:hover{border-color:var(--gl);}
.prc-ans{display:none;margin-top:9px;padding:9px 11px;border-radius:8px;background:rgba(192,138,62,.09);border:1px solid rgba(192,138,62,.22);}
.prc-ans.show{display:block;}
.prc-ans .str-th{font-size:14.5px;}

@media(max-width:920px){
 .stop-wrap{display:none;}
 .cmp-row{grid-template-columns:1fr;}
 .str-grid,.sen-grid{grid-template-columns:1fr;}
}

<script type="application/json" id="jd">{"title":"Thai Daily Notes","subtitle":"2026-05-28","vocab":[{"th":"ไม่ทัน","ro":"mâi than","en":"not in time; can’t make it","cat":"Practical Usage","note":"時間上來不及；常接ไป/bpai/go、ตอบ/dtɔ̀ɔp/reply。","ex":["ถ้าแวะหลายที่ อาจจะไปไม่ทัน","thâa wɛ́ lǎai thîi, àat jà bpai mâi than","If we stop by many places, we might not make it in time.","如果我們去很多地方，我們可能無法及時趕到。"],"i":"V001","zh":"來不及／趕不上"},{"th":"แวะ","ro":"wɛ́","en":"stop by; drop by","cat":"Local usage","note":"順路停一下，不是正式拜訪。曼谷生活超常用。","ex":["เดี๋ยวแวะยิมก่อนนะ","dǐaw wɛ́ yim gɔ̀ɔn ná","I’ll stop by the gym first.","我先去健身房看看。"],"i":"V002","zh":"順路停一下／順道去一下"},{"th":"เลือกไม่ถูก","ro":"lʉ̂ak mâi thùuk","en":"can’t choose; don’t know which one is right","cat":"Practical Usage","note":"V + ไม่ถูก表示不知道怎麼做才對、哪個方式合適。","ex":["เมนูเยอะจนเลือกไม่ถูก","mee-nuu yə́ jon lʉ̂ak mâi thùuk","There are so many menu items that I can’t choose.","選單專案太多了，我無法選擇。"],"i":"V003","zh":"選不出來／不知道該選哪個"},{"th":"ไม่ออก","ro":"mâi ɔ̀ɔk","en":"can’t get it out; can’t figure it out","cat":"Practical Usage","note":"V + ไม่ออก表示想法、話、記憶、差異「出不來」。","ex":["คิดไม่ออกว่าจะกินอะไร","khít mâi ɔ̀ɔk wâa jà gin à-rai","I can’t think of what to eat.","想不出吃什麼"],"i":"V004","zh":"不出來；想不出／說不出／分不出"},{"th":"จน","ro":"jon","en":"until; so...that","cat":"Practical Usage","note":"把前面的狀態推到後面的結果。可表示時間「直到」或程度「到……」。","ex":["ยุ่งจนกินข้าวไม่ทัน","yûng jon gin khâaw mâi than","I was so busy that I didn’t have time to eat.","我太忙了，沒時間吃飯。"],"i":"V005","zh":"直到／到……的程度；窮"},{"th":"งั้น","ro":"ngán","en":"then; in that case","cat":"Local usage","note":"口語「那、那就、既然這樣」。常放句首，引出下一步決定。","ex":["งั้นเอาอันนี้ก็แล้วกัน","ngán ao an níi gɔ̂ɔ lɛ́ɛw gan","Then I’ll take this one.","那我就拿這個。"],"i":"V006","zh":"那／那就／既然這樣"},{"th":"เหมาะ","ro":"mɔ̀","en":"suitable; fit; appropriate","cat":"Practical Usage","note":"某選擇跟人、場合、條件、目的很搭。常接กับ/gàp/with; for。","ex":["คำนี้ใช้กับเพื่อนได้ แต่ไม่เหมาะกับลูกค้า","kham níi chái gàp phʉ̂an dâai, dtɛ̀ɛ mâi mɔ̀ gàp lûuk-kháa","This word can be used with friends, but it’s not suitable for customers.","這個詞可以和朋友一起使用，但不適合顧客使用。"],"i":"V007","zh":"適合／合適"},{"th":"แรง","ro":"rɛɛng","en":"strong; intense; harsh","cat":"Local usage","note":"可形容風雨、味道、藥效、語氣、反應很強。พูดแรง不是大聲，而是話很重。","ex":["คำนี้แรงไป ใช้กับลูกค้าไม่เหมาะ","kham níi rɛɛng bpai, chái gàp lûuk-kháa mâi mɔ̀","This word is too strong. It’s not suitable to use with customers.","這個詞太強烈了。它不適合與客戶一起使用。"],"i":"V008","zh":"強烈／很重／很猛"},{"th":"วันหยุดไปไหนมามั่ง","ro":"wan-yùt bpai nǎi maa mâang","en":"Where did you go during the holiday?","cat":"Local usage","note":"มา表示去過回來；มั่ง是บ้าง的口語版。","ex":["แล้วเธอล่ะ วันหยุดไปไหนมามั่ง","lɛ́ɛw thəə lâ, wan-yùt bpai nǎi maa mâang","What about you? Where did you go during the holiday?","你呢？ 假期期間你去了哪裡？"],"i":"V009","zh":"假日去了哪裡？"},{"th":"ลืม...ไว้ที่...","ro":"lʉʉm ... wái thîi ...","en":"left ... at ...","cat":"Practical Usage","note":"ไว้表示東西被留在那裡的結果感。交通工具上常用บน。","ex":["ลืมกระเป๋าไว้ที่คาเฟ่ ต้องแวะกลับไปเอา","lʉʉm grà-bpǎo wái thîi kaa-fɛɛ, dtɔ̂ng wɛ́ glàp bpai ao","I left my bag at the café. I have to stop by and get it.","包包忘在咖啡廳了，得繞回去拿。"],"i":"V010","zh":"把……忘在……"},{"th":"ยังไม่ครบ","ro":"yang mâi khróp","en":"still not complete","cat":"Practical Usage","note":"該有的東西、人、資料、餐點還沒有全部齊全。","ex":["วันนี้คำศัพท์ยังไม่ครบ เดี๋ยวค่อยเก็บต่อ","wan-níi kham-sàp yang mâi khróp, dǐaw khɔ̂i gèp dtɔ̀ɔ","Today’s vocabulary isn’t complete yet. We’ll continue collecting it later.","今天的詞彙還沒有完成。我們稍後會繼續收集它。"],"i":"V011","zh":"還沒齊／還不完整"},{"th":"ขาด","ro":"khàat","en":"missing; lack; be short of","cat":"Practical Usage","note":"本來應該有，但少了某一部分。常和ครบ搭配。","ex":["ยังไม่ครบค่ะ ขาดอีกหนึ่งหน้า","yang mâi khróp khâ, khàat ìik nʉ̀ng nâa","It’s still not complete. One more page is missing.","它仍然沒有完成。又少了一頁。"],"i":"V012","zh":"缺少／不足"},{"th":"กินไม่หมด","ro":"gin mâi mòt","en":"can’t finish eating it","cat":"Local usage","note":"食物太多或已經飽了，所以沒辦法全部吃完。不是กินไม่ได้。","ex":["กินไม่หมดค่ะ ขอห่อกลับบ้านได้ไหมคะ","gin mâi mòt khâ, khɔ̌ɔ hɔ̀ɔ glàp bâan dâai mái khá","I can’t finish it. Can I have it packed to go?","我無法完成它。我可以把它打包帶走嗎？"],"i":"V013","zh":"吃不完"},{"th":"ที่ชาร์จ","ro":"thîi châat","en":"charger","cat":"Local usage","note":"英文 charge 的借詞。可泛指充電器；更精準可分充電線與充電頭。","ex":["แบตจะหมดแล้ว ขอยืมที่ชาร์จหน่อยได้ไหมคะ","bɛ̀ɛt jà mòt lɛ́ɛw, khɔ̌ɔ yʉʉm thîi châat nɔ̀i dâai mái khá","My battery is about to die. Can I borrow a charger?","我的電池快沒電了。我可以借一個充電器嗎？"],"i":"V014","zh":"充電器"},{"th":"ยิม","ro":"yim","en":"gym","cat":"Local usage","note":"英文 gym 的泰文音譯。Condo 設施也常說ฟิตเนส/fít-nêt/fitness center。","ex":["เพิ่งกลับจากยิมค่ะ","phə̂ng glàp jàak yim khâ","I just came back from the gym.","我剛從健身房回來。"],"i":"V015","zh":"健身房"},{"th":"ต่อ","ro":"dtɔ̀ɔ","en":"continue; connect; transfer; extend","cat":"Review","note":"核心是「接下去、接上」。今天延伸到ต่อวีซ่า/dtɔ̀ɔ wii-sâa/extend a visa。","ex":["วีซ่าใกล้หมดอายุแล้ว ต้องต่อวีซ่า","wii-sâa glâi mòt aa-yú lɛ́ɛw, dtɔ̂ng dtɔ̀ɔ wii-sâa","My visa is about to expire, so I need to extend it.","我的簽證即將到期，所以我需要延長它。"],"i":"V016","zh":"繼續／接著／連接"},{"th":"มีอายุ","ro":"mii aa-yú","en":"be valid; have an age / duration","cat":"Supplement","note":"可表示人的年齡，也可表示簽證、護照、文件、優惠券的有效期。","ex":["วีซ่านี้มีอายุ 90 วันค่ะ","wii-sâa níi mii aa-yú gâo-sìp wan khâ","This visa is valid for 90 days.","這張簽證有效期為90天。"],"i":"V017","zh":"有年齡；有效期為……"},{"th":"ส่วน","ro":"sùan","en":"part; portion; section; as for","cat":"Practical Usage","note":"表示整體中的某一部分，也可句首表示「至於……」。","ex":["ข้อมูลขาดบางส่วนค่ะ","khɔ̂ɔ-muun khàat baang sùan khâ","Some information is missing.","缺少一些資訊。"],"i":"V018","zh":"部分／份量；至於……"},{"th":"ตั้ง","ro":"dtâng","en":"set up; establish; set; place","cat":"Supplement","note":"核心畫面是「把某物立起來、放定、設定好」。延伸成ตั้งใจ、ตั้งคำถาม、ตั้งอยู่。","ex":["ขอโทษนะคะ ไม่ได้ตั้งใจ","khɔ̌ɔ-thôot ná khá, mâi dâai dtâng-jai","Sorry, I didn’t mean to.","抱歉，我不是故意的。"],"i":"V019","zh":"設立／設定／放置"},{"th":"เปลี่ยน","ro":"bplìian","en":"change; switch; exchange","cat":"Practical Usage","note":"把原本的人、事、物、時間、地點、選項、狀態改成另一個。","ex":["ขอเปลี่ยนเวลาเป็นบ่ายสองได้ไหมคะ","khɔ̌ɔ bplìian wee-laa bpen bàai sɔ̌ɔng dâai mái khá","Can I change the time to 2 p.m.?","我可以把時間改到下午2點嗎？"],"i":"V020","zh":"更換／改變"},{"th":"ไม่...นัก","ro":"mâi ... nák","en":"not very...; not that...","cat":"Supplement","note":"降低程度的句型，比ไม่ค่อย...稍正式、理性。","ex":["คำนี้ไม่เหมาะนักถ้าใช้กับลูกค้า","kham níi mâi mɔ̀ nák thâa chái gàp lûuk-kháa","This word isn’t very suitable if used with customers.","如果對客戶使用，這個詞就不太合適了。"],"i":"V021","zh":"不太……／沒有很……"}],"compare":[{"title":"1. ไม่ถูก vs ไม่ออก vs ไม่ได้ vs ไม่เป็น","rows":[{"term":["พูดไม่ถูก","phûut mâi thùuk","don’t know how to say it properly","不知道怎麼說才合適"],"meaning":"不知道怎麼說才合適","ex":["เรื่องนี้ซับซ้อนมาก พูดไม่ถูก","rʉ̂ang níi sáp-sɔ́ɔn mâak, phûut mâi thùuk","This matter is complicated. I don’t know how to explain it properly.","這件事很複雜，我不知道該怎麼解釋才好。"]},{"term":["พูดไม่ออก","phûut mâi ɔ̀ɔk","speechless","情緒太強，話出不來"],"meaning":"情緒太強，話出不來","ex":["ตกใจจนพูดไม่ออก","dtòk-jai jon phûut mâi ɔ̀ɔk","I was so shocked that I couldn’t speak.","我嚇到說不出話來。"]},{"term":["พูดไม่ได้","phûut mâi dâai","can’t speak","能力、規則、情況上不能說"],"meaning":"能力、規則、情況上不能說","ex":["ฉันพูดภาษาไทยไม่ได้","chǎn phûut phaa-sǎa Thai mâi dâai","I can’t speak Thai.","我不會說泰文。"]},{"term":["พูดไทยไม่เป็น","phûut Thai mâi bpen","don’t know how to speak Thai","不會這項技能"],"meaning":"不會這項技能","ex":["เมื่อก่อนฉันพูดไทยไม่เป็น","mʉ̂a-gɔ̀ɔn chǎn phûut Thai mâi bpen","Before, I didn’t know how to speak Thai.","以前我還不會說泰文。"]}],"tip":"核心差異： ไม่ถูก / mâi thùuk / not in the right way 是「不知道怎麼做才對」； ไม่ออก / mâi ɔ̀ɔk / can’t get it out 是「東西出不來」。"},{"title":"2. ต่อ vs เปลี่ยน ｜接續 / 延長 vs 換掉","rows":[{"term":["ต่อวีซ่า","dtɔ̀ɔ wii-sâa","extend / renew a visa","延長/更新簽證"],"meaning":"續簽、延長已有簽證","ex":["ต้องไปต่อวีซ่าค่ะ","dtɔ̂ng bpai dtɔ̀ɔ wii-sâa khâ","I have to go extend my visa.","我得去辦延長簽證。"]},{"term":["เปลี่ยนวีซ่า","bplìian wii-sâa","change visa type","換簽證類型"],"meaning":"換簽證類型","ex":["อยากเปลี่ยนวีซ่าจากท่องเที่ยวเป็นวีซ่านักเรียน","yàak bplìian wii-sâa jàak thɔ̂ng-thîiao bpen wii-sâa nák-riian","I want to change my visa from a tourist visa to a student visa.","我想把觀光簽證改成學生簽證。"]},{"term":["ต่อเวลา","dtɔ̀ɔ wee-laa","extend time","延長時間"],"meaning":"延長時間","ex":["ขอต่อเวลาอีกสิบนาทีได้ไหมคะ","khɔ̌ɔ dtɔ̀ɔ wee-laa ìik sìp naa-thii dâai mái khá","Can I extend the time by ten more minutes?","可以再延長十分鐘嗎？"]},{"term":["เปลี่ยนเวลา","bplìian wee-laa","change the time","改變時間"],"meaning":"改時間","ex":["ขอเปลี่ยนเวลาเป็นพรุ่งนี้ได้ไหมคะ","khɔ̌ɔ bplìian wee-laa bpen phrûng-níi dâai mái khá","Can I change the time to tomorrow?","我可以把時間改到明天嗎？"]}],"tip":"核心差異： ต่อ / dtɔ̀ɔ / continue; extend 是把原本的東西接下去； เปลี่ยน / bplìian / change; switch 是把 A 改成 B。"},{"title":"3. ครบ / ขาด / พอ / เสร็จ","rows":[{"term":["ครบ","khróp","complete; all present","該有的都有"],"meaning":"該有的都有","ex":["เอกสารครบแล้วค่ะ","èek-gà-sǎan khróp lɛ́ɛw khâ","The documents are complete now.","文件都齊了。"]},{"term":["ขาด","khàat","missing; lacking","缺少／不足"],"meaning":"具體缺某一部分","ex":["เอกสารขาดสำเนาพาสปอร์ตค่ะ","èek-gà-sǎan khàat sǎm-nao phâat-bpɔ̀ɔt khâ","A passport copy is missing from the documents.","文件裡少了一份護照影本。"]},{"term":["พอ","phɔɔ","enough","數量 / 程度足夠"],"meaning":"數量 / 程度足夠","ex":["น้ำไม่พอค่ะ","náam mâi phɔɔ khâ","There isn’t enough water.","水不夠。"]},{"term":["เสร็จ","sèt","finished","事情做完"],"meaning":"事情做完","ex":["โน้ตยังไม่เสร็จค่ะ","nóot yang mâi sèt khâ","The notes are not finished yet.","筆記還沒完成。"]}]},{"title":"4. ไม่...นัก / ไม่ค่อย... / ไม่...เท่าไหร่","rows":[{"term":["ไม่แพงนัก","mâi phɛɛng nák","not very expensive","稍正式、理性"],"meaning":"稍正式、理性","ex":["ร้านนี้ไม่แพงนัก","ráan níi mâi phɛɛng nák","This restaurant isn’t very expensive.","這家餐廳不太貴。"]},{"term":["ไม่ค่อยแพง","mâi khɔ̂i phɛɛng","not really expensive","最日常口語"],"meaning":"最日常口語","ex":["ร้านนี้ไม่ค่อยแพง","ráan níi mâi khɔ̂i phɛɛng","This restaurant isn’t really expensive.","這家餐廳其實不貴。"]},{"term":["ไม่แพงเท่าไหร่","mâi phɛɛng thâo-rài","not that expensive","口語柔和"],"meaning":"口語柔和","ex":["คาเฟ่นี้ไม่แพงเท่าไหร่","gaa-fɛɛ níi mâi phɛɛng thâo-rài","This café isn’t that expensive.","這家咖啡廳沒有那麼貴。"]}],"tip":"曼谷口語提醒： 朋友聊天更常用 ไม่ค่อย... / mâi khɔ̂i... / not really... 或 ไม่...เท่าไหร่ / mâi ... thâo-rài / not really that... ； ไม่...นัก 比較沉穩、文章感。"}],"mistakes":[{"title":"1. 把所有「說不出來」都說成พูดไม่ได้","wrong":{"label":"","th":"ฉันพูดไม่ได้ว่ารู้สึกยังไง","ro":"chǎn phûut mâi dâai wâa rúu-sʉ̀k yang-ngai","en":"I can’t speak how I feel.","zh":"我無法說出我的感受。"},"better":{"label":"","th":"ฉันพูดไม่ถูกว่ารู้สึกยังไง","ro":"chǎn phûut mâi thùuk wâa rúu-sʉ̀k yang-ngai","en":"I don’t know how to say how I feel.","zh":"我不知道該怎麼表達我的感受。"},"why":"พูดไม่ได้/phûut mâi dâai/can’t speak是能力或情況上不能說；พูดไม่ถูก/phûut mâi thùuk/don’t know how to say it properly是不知道怎麼說才合適。"},{"title":"2. 把「忘在某地」說成只用ลืม","wrong":{"label":"","th":"ลืมมือถือที่บ้าน","ro":"lʉʉm mʉʉ-thʉ̌ʉ thîi bâan","en":"forgot phone at home","zh":"把手機忘在家裡了"},"better":{"label":"","th":"ลืมมือถือไว้ที่บ้าน","ro":"lʉʉm mʉʉ-thʉ̌ʉ wái thîi bâan","en":"I left my phone at home.","zh":"我把手機忘在家裡了"},"why":"ไว้/wái/leave; keep讓「東西被留在那裡」很清楚。"},{"title":"3. 把「改時間」說成ต่อเวลา","wrong":{"label":"","th":"ขอต่อเวลาเป็นพรุ่งนี้ได้ไหมคะ","ro":"khɔ̌ɔ dtɔ̀ɔ wee-laa bpen phrûng-níi dâai mái khá","en":"Can I extend the time to tomorrow?","zh":"我可以把時間延長到明天嗎？"},"better":{"label":"","th":"ขอเปลี่ยนเวลาเป็นพรุ่งนี้ได้ไหมคะ","ro":"khɔ̌ɔ bplìian wee-laa bpen phrûng-níi dâai mái khá","en":"Can I change the time to tomorrow?","zh":"我可以把時間改到明天嗎？"},"why":"ต่อเวลา/dtɔ̀ɔ wee-laa/extend time是延長時間；เปลี่ยนเวลา/bplìian wee-laa/change the time才是改時間。"},{"title":"4. 把พูดแรง理解成「說話大聲」","wrong":{"label":"","th":"เขาพูดแรง","ro":"khǎo phûut rɛɛng","en":"He speaks harshly.","zh":"他說話很嚴厲。"},"better":{"label":"","th":"เขาพูดเสียงดัง","ro":"khǎo phûut sǐang dang","en":"He speaks loudly.","zh":"他說話很大聲。"},"why":"พูดแรง/phûut rɛɛng/speak harshly是內容或語氣很重、很衝；不是單純音量大。"}],"dialogues":[{"title":"Dialogue 1｜Restaurant：吃不完、分給朋友、打包","turns":[{"speaker":"A","side":"left","th":"จานนี้ใหญ่จัง กินไม่หมดแน่ ๆ","ro":"jaan níi yài jang, gin mâi mòt nɛ̂ɛ-nɛ̂ɛ","en":"This dish is so big. I definitely can’t finish it.","zh":"這道菜太大了。我絕對無法完成它。"},{"speaker":"B","side":"right","th":"งั้นแบ่งให้เพื่อนก็ได้ หรือขอห่อกลับบ้านไหม","ro":"ngán bɛ̀ng hâi phʉ̂an gɔ̂ɔ dâai, rʉ̌ʉ khɔ̌ɔ hɔ̀ɔ glàp bâan mái","en":"Then you can share it with your friend, or ask to pack it to go.","zh":"然後你可以和你的朋友分享它，或者要求打包帶走。"},{"speaker":"A","side":"left","th":"เดี๋ยวแบ่งให้เพื่อนก่อน ถ้ายังเหลือค่อยห่อกลับบ้าน","ro":"dǐaw bɛ̀ng hâi phʉ̂an gɔ̀ɔn, thâa yang lʉ̌ea khɔ̂i hɔ̀ɔ glàp bâan","en":"I’ll share it with my friend first. If there’s still some left, I’ll pack it to go.","zh":"我會先和我的朋友分享它。如果還剩下一些，我會把它打包帶走。"}]},{"title":"Dialogue 2｜Visa Office：文件缺漏、簽證快到期","turns":[{"speaker":"Officer","side":"left","th":"เอกสารยังไม่ครบค่ะ ขาดสำเนาพาสปอร์ต","ro":"èek-gà-sǎan yang mâi khróp khâ, khàat sǎm-nao phâat-bpɔ̀ɔt","en":"The documents are still incomplete. A passport copy is missing.","zh":"這些檔案仍然不完整。護照影印件不見了。"},{"speaker":"Student","side":"right","th":"ต้องส่งเพิ่มวันนี้เลยไหมคะ","ro":"dtɔ̂ng sòng phə̂əm wan-níi ləəy mái khá","en":"Do I need to submit the additional document today?","zh":"我今天需要提交額外的檔案嗎？"},{"speaker":"Officer","side":"left","th":"ใช่ค่ะ แล้ววีซ่าของคุณใกล้หมดอายุหรือยังคะ","ro":"châi khâ, lɛ́ɛw wii-sâa khɔ̌ɔng khun glâi mòt aa-yú rʉ̌ʉ yang khá","en":"Yes. And is your visa about to expire yet?","zh":"是的。你的簽證快到期了嗎？"},{"speaker":"Student","side":"right","th":"ใกล้หมดอายุแล้วค่ะ เลยต้องมาต่อวีซ่า","ro":"glâi mòt aa-yú lɛ́ɛw khâ, ləəy dtɔ̂ng maa dtɔ̀ɔ wii-sâa","en":"It’s about to expire, so I need to come extend my visa.","zh":"它即將到期，所以我需要來延長我的簽證。"}]},{"title":"Dialogue 3｜BTS / Time：換線、改時間、來不及","turns":[{"speaker":"A","side":"left","th":"ถ้าแวะคาเฟ่ก่อน น่าจะไปไม่ทัน","ro":"thâa wɛ́ kaa-fɛɛ gɔ̀ɔn, nâa-jà bpai mâi than","en":"If we stop by a café first, we probably won’t make it in time.","zh":"如果我們先去一家咖啡廳，我們可能無法及時趕到。"},{"speaker":"B","side":"right","th":"งั้นไม่แวะแล้วกัน ต้องเปลี่ยนสายที่สยามด้วย","ro":"ngán mâi wɛ́ lɛ́ɛw gan, dtɔ̂ng bplìian sǎai thîi Sà-yǎam dûai","en":"Then let’s not stop by. We also need to change lines at Siam.","zh":"那我們別順便過來了。我們還需要在暹羅換線。"},{"speaker":"A","side":"left","th":"ถ้าอย่างนั้น เปลี่ยนเป็นพรุ่งนี้ดีไหม","ro":"thâa yàang nán, bplìian bpen phrûng-níi dii mái","en":"In that case, should we change it to tomorrow?","zh":"在這種情況下，我們應該改到明天嗎？"}]},{"title":"Dialogue 4｜Chat：假日去哪、想不出來","turns":[{"speaker":"A","side":"left","th":"วันหยุดไปไหนมามั่ง","ro":"wan-yùt bpai nǎi maa mâang","en":"Where did you go during the holiday?","zh":"假日去了哪裡？"},{"speaker":"B","side":"right","th":"ไม่ได้ไปไหนเลย อยู่บ้านทั้งวัน","ro":"mâi dâai bpai nǎi ləəy, yùu bâan tháng wan","en":"I didn’t go anywhere. I stayed home all day.","zh":"我哪兒也沒去。我一整天都待在家裡。"},{"speaker":"A","side":"left","th":"ดีเหมือนกันนะ ฉันคิดไม่ออกว่าจะไปไหน","ro":"dii mʉ̌an gan ná, chǎn khít mâi ɔ̀ɔk wâa jà bpai nǎi","en":"That’s nice too. I couldn’t think of where to go.","zh":"那也很好。我想不出該去哪裡。"}]}],"structures":[{"title":"1.V + ไม่ถูก｜不知道怎麼 V 才對","meaning":"","examples":[["Verb + ไม่ถูก","V + mâi thùuk","don’t know how to V properly","不知道如何正確地V"],["คำถามนี้ตอบไม่ถูกเลย","kham-thǎam níi dtɔ̀ɔp mâi thùuk ləəy","I really don’t know how to answer this question.","我真的不知道該怎麼回答這個問題。"]]},{"title":"2.V + ไม่ออก｜V 不出來","meaning":"","examples":[["Verb + ไม่ออก","V + mâi ɔ̀ɔk","can’t get V out; can’t figure out","無法讓V出來；無法弄清楚"],["สองคำนี้คล้ายกันมาก แยกไม่ออก","sɔ̌ɔng kham níi khláai gan mâak, yɛ̂ɛk mâi ɔ̀ɔk","These two words are very similar. I can’t distinguish them.","這兩個詞非常相似。我無法區分它們。"]]},{"title":"3.Adj / State + จน + Result｜……到造成某結果","meaning":"","examples":[["Adj / State + จน + Result","... jon ...","so...that...","所以...那個..."],["เหนื่อยจนพูดไม่ออก","nʉ̀ai jon phûut mâi ɔ̀ɔk","I’m so tired I can’t speak.","我太累了，說不了話。"]]},{"title":"4.ลืม + Object + ไว้ที่ + Place｜把……忘在……","meaning":"","examples":[["ลืมกุญแจไว้บนโต๊ะ","lʉʉm gun-jɛɛ wái bon dtó","I left the keys on the table.","我把鑰匙放在桌子上了。"]]},{"title":"5.เปลี่ยนจาก A เป็น B｜從 A 改成 B","meaning":"","examples":[["ขอเปลี่ยนจากวันจันทร์เป็นวันอังคารได้ไหมคะ","khɔ̌ɔ bplìian jàak wan jan bpen wan ang-khaan dâai mái khá","Can we change it from Monday to Tuesday?","我們可以把它從週一改到週二嗎？"]]},{"title":"6.ไม่ + Adj + นัก｜不算太……","meaning":"","examples":[["คอนโดนี้ไม่ไกลนักจาก BTS","khɔɔn-doo níi mâi glai nák jàak BTS","This condo isn’t very far from the BTS.","這間公寓離 BTS 不算太遠。"]]}],"sentenceBank":[{"scene":"Restaurant｜吃不完 / 分食 / 打包","sentences":[{"th":"จานนี้ใหญ่กว่าที่คิด กินไม่หมดแน่ ๆ","ro":"jaan níi yài gwàa thîi khít, gin mâi mòt nɛ̂ɛ-nɛ̂ɛ","en":"This dish is bigger than I thought. I definitely can’t finish it.","zh":"這道菜比我想象的要大。我絕對無法完成它。"},{"th":"ถ้ากินไม่หมด เดี๋ยวแบ่งให้เพื่อนก็ได้","ro":"thâa gin mâi mòt, dǐaw bɛ̀ng hâi phʉ̂an gɔ̂ɔ dâai","en":"If I can’t finish it, I can share it with my friend.","zh":"如果我無法完成它，我可以和我的朋友分享它。"},{"th":"รสนี้ไม่แรงนัก กินง่ายดี","ro":"rót níi mâi rɛɛng nák, gin ngâai dii","en":"This flavor isn’t too strong. It’s easy to eat.","zh":"這種味道不太濃。很容易吃。"}]},{"scene":"Errands｜忘東西 / 回去拿 / 來不及","sentences":[{"th":"เมื่อกี้ฉันลืมมือถือไว้ที่ร้าน","ro":"mʉ̂a-gîi chǎn lʉʉm mʉʉ-thʉ̌ʉ wái thîi ráan","en":"I just left my phone at the shop.","zh":"我剛把手機忘在店裡了。"},{"th":"งั้นเดี๋ยวแวะกลับไปเอาก่อนนะ","ro":"ngán dǐaw wɛ́ glàp bpai ao gɔ̀ɔn ná","en":"Then I’ll stop by and go back to get it first.","zh":"然後我會順便過來，然後先回去拿它。"},{"th":"ถ้ากลับไปเอาตอนนี้ อาจจะไปไม่ทัน","ro":"thâa glàp bpai ao dtɔɔn-níi, àat jà bpai mâi than","en":"If I go back to get it now, I might not make it in time.","zh":"如果我現在回去拿，我可能趕不上。"}]},{"scene":"Visa Office｜文件 / 缺漏 / 有效期","sentences":[{"th":"เอกสารยังไม่ครบ ขาดข้อมูลบางส่วน","ro":"èek-gà-sǎan yang mâi khróp, khàat khɔ̂ɔ-muun baang sùan","en":"The documents are still incomplete; some information is missing.","zh":"檔案仍然不完整；缺少一些資訊。"},{"th":"กรุณากรอกส่วนนี้ให้ครบค่ะ","ro":"gà-rú-naa grɔ̀ɔk sùan níi hâi khróp khâ","en":"Please fill in this section completely.","zh":"請完整填寫此部分。"},{"th":"พาสปอร์ตต้องมีอายุเหลืออย่างน้อยหกเดือน","ro":"phâat-bpɔ̀ɔt dtɔ̂ng mii aa-yú lʉ̌ea yàang nɔ́ɔi hòk dʉan","en":"The passport must have at least six months of validity remaining.","zh":"護照有效期必須至少還有六個月。"}]},{"scene":"BTS / Gym｜轉線 / 健身房 / 改時間","sentences":[{"th":"ต้องเปลี่ยนสายที่สยาม แล้วต่อรถไปอารีย์","ro":"dtɔ̂ng bplìian sǎai thîi Sà-yǎam, lɛ́ɛw dtɔ̀ɔ rót bpai Aa-rîi","en":"I have to change lines at Siam, then transfer to Ari.","zh":"我必須在暹羅換線路，然後轉到阿里。"},{"th":"ขอเปลี่ยนเป็นพรุ่งนี้ได้ไหมคะ วันนี้ไปไม่ทัน","ro":"khɔ̌ɔ bplìian bpen phrûng-níi dâai mái khá, wan-níi bpai mâi than","en":"Can we change it to tomorrow? I can’t make it today.","zh":"可以改到明天嗎？我今天趕不及。"},{"th":"วันนี้คนที่ยิมเยอะจนไม่อยากเล่นเวท","ro":"wan-níi khon thîi yim yə́ jon mâi yàak lên wêt","en":"There are so many people at the gym today that I don’t want to do weight training.","zh":"今天健身房裡人太多了，我不想做重量訓練。"}]}],"bangkok":[{"scene":"Visa Office｜簽證與文件","sentences":[{"th":"ต้องเตรียมเอกสารอะไรบ้างคะ ถ้าจะต่อวีซ่า","ro":"dtɔ̂ng dtriiam èek-gà-sǎan à-rai bâang khá, thâa jà dtɔ̀ɔ wii-sâa","en":"What documents do I need to prepare if I’m going to extend my visa?","zh":"如果我要延長簽證，我需要準備哪些檔案？"},{"th":"เอกสารส่วนนี้ยังไม่ครบค่ะ","ro":"èek-gà-sǎan sùan níi yang mâi khróp khâ","en":"This section of the documents is still incomplete.","zh":"檔案的這一部分仍然不完整。"},{"th":"วีซ่าของฉันใกล้หมดอายุแล้วค่ะ","ro":"wii-sâa khɔ̌ɔng chǎn glâi mòt aa-yú lɛ́ɛw khâ","en":"My visa is about to expire.","zh":"我的簽證即將到期。"},{"th":"พาสปอร์ตต้องมีอายุเหลืออย่างน้อยหกเดือน","ro":"phâat-bpɔ̀ɔt dtɔ̂ng mii aa-yú lʉ̌ea yàang nɔ́ɔi hòk dʉan","en":"The passport must have at least six months of validity remaining.","zh":"護照有效期必須至少還有六個月。"}]},{"scene":"BTS / MRT｜轉線、來不及、改行程","sentences":[{"th":"ถ้าออกช้ากว่านี้ ก็น่าจะไปไม่ทัน","ro":"thâa ɔ̀ɔk cháa gwàa níi, gɔ̂ɔ nâa-jà bpai mâi than","en":"If we leave later than this, we probably won’t make it in time.","zh":"如果我們比這晚離開，我們可能無法及時趕到。"},{"th":"ต้องเปลี่ยนสายที่อโศกหรือสยามคะ","ro":"dtɔ̂ng bplìian sǎai thîi À-sòok rʉ̌ʉ Sà-yǎam khá","en":"Do I need to change lines at Asok or Siam?","zh":"我需要在Asok或Siam換線嗎？"},{"th":"ถ้างั้นไม่แวะซื้อกาแฟแล้วกัน","ro":"thâa ngán mâi wɛ́ sʉ́ʉ kaa-fɛɛ lɛ́ɛw gan","en":"In that case, let’s not stop by to buy coffee.","zh":"在這種情況下，我們不要停下來買咖啡了。"},{"th":"จากตรงนี้ต้องต่อรถอีกไหมคะ","ro":"jàak dtrong níi dtɔ̂ng dtɔ̀ɔ rót ìik mái khá","en":"From here, do I need to transfer again?","zh":"從這裡開始，我需要再次轉機嗎？"}]},{"scene":"Café / Restaurant｜點餐、吃不完、打包","sentences":[{"th":"เมนูเยอะจนเลือกไม่ถูกเลยค่ะ","ro":"mee-nuu yə́ jon lʉ̂ak mâi thùuk ləəy khâ","en":"There are so many menu items that I really can’t choose.","zh":"選單專案太多了，我真的無法選擇。"},{"th":"จานนี้ใหญ่กว่าที่คิด กินไม่หมดแน่ ๆ","ro":"jaan níi yài gwàa thîi khít, gin mâi mòt nɛ̂ɛ-nɛ̂ɛ","en":"This dish is bigger than I thought. I definitely can’t finish it.","zh":"這道菜比我想象的要大。我絕對無法完成它。"},{"th":"ถ้ากินไม่หมด เดี๋ยวแบ่งให้เพื่อนก็ได้","ro":"thâa gin mâi mòt, dǐaw bɛ̀ng hâi phʉ̂an gɔ̂ɔ dâai","en":"If I can’t finish it, I can share it with my friend.","zh":"如果我無法完成它，我可以和我的朋友分享它。"},{"th":"ขอห่อกลับบ้านได้ไหมคะ","ro":"khɔ̌ɔ hɔ̀ɔ glàp bâan dâai mái khá","en":"Can I have this packed to go?","zh":"我可以把這個打包帶走嗎？"}]},{"scene":"Condo / Gym｜住處、健身房、忘東西","sentences":[{"th":"คอนโดนี้เหมาะกับคนที่ใช้ BTS บ่อย","ro":"khɔɔn-doo níi mɔ̀ gàp khon thîi chái BTS bɔ̀i","en":"This condo is suitable for people who use the BTS often.","zh":"這間公寓很適合常搭 BTS 的人。"},{"th":"ห้องฟิตเนสที่คอนโดไม่ใหญ่ แต่คนไม่เยอะนัก","ro":"hɔ̂ng fít-nêt thîi khɔɔn-doo mâi yài, dtɛ̀ɛ khon mâi yə́ nák","en":"The condo fitness room isn’t big, but it’s not very crowded.","zh":"公寓的健身室不大，但也不是很擁擠。"},{"th":"เมื่อกี้ลืมที่ชาร์จไว้ที่ยิม","ro":"mʉ̂a-gîi lʉʉm thîi châat wái thîi yim","en":"I just left my charger at the gym.","zh":"我剛把充電器忘在健身房了。"},{"th":"เดี๋ยวแวะกลับไปเอาก่อนนะ","ro":"dǐaw wɛ́ glàp bpai ao gɔ̀ɔn ná","en":"I’ll stop by and go back to get it first.","zh":"我會順便過來，然後先回去拿。"}]},{"scene":"Shopping / Mall｜選不出來、適不適合、語氣太強","sentences":[{"th":"สองสีนี้สวยทั้งคู่ เลือกไม่ถูกเลย","ro":"sɔ̌ɔng sǐi níi sǔai tháng khûu, lʉ̂ak mâi thùuk ləəy","en":"Both colors are pretty. I really can’t choose.","zh":"兩種顏色都很漂亮。我真的無法選擇。"},{"th":"อันนี้ก็น่าจะเหมาะกับเธอนะ","ro":"an níi gɔ̂ɔ nâa-jà mɔ̀ gàp thəə ná","en":"This one should probably suit you.","zh":"這個應該適合你。"},{"th":"คำนี้แรงไป ใช้กับพนักงานไม่เหมาะ","ro":"kham níi rɛɛng bpai, chái gàp phá-nák-ngaan mâi mɔ̀","en":"This wording is too strong. It’s not suitable to use with staff.","zh":"這個措辭太強烈了。它不適合和工作人員一起使用。"},{"th":"ถ้างั้นเอาอันนี้ก็แล้วกันค่ะ","ro":"thâa ngán ao an níi gɔ̂ɔ lɛ́ɛw gan khâ","en":"In that case, I’ll take this one.","zh":"在這種情況下，我會拿這個。"}]},{"scene":"Chat / Study｜聊天收尾、筆記還沒完整","sentences":[{"th":"วันนี้พอแค่นี้ก่อนนะ พรุ่งนี้ค่อยต่อ","ro":"wan-níi phɔɔ khɛ̂ɛ níi gɔ̀ɔn ná, phrûng-níi khɔ̂i dtɔ̀ɔ","en":"Let’s stop here for today. We’ll continue tomorrow.","zh":"今天我們到此為止吧。我們明天繼續。"},{"th":"ยังไม่ครบค่ะ เดี๋ยวค่อยเก็บต่ออีกนิด","ro":"yang mâi khróp khâ, dǐaw khɔ̂i gèp dtɔ̀ɔ ìik nít","en":"It’s not complete yet. I’ll continue collecting a bit more later.","zh":"它還沒有完成。我稍後會繼續收集更多。"},{"th":"พูดไม่ถูกเหมือนกัน แต่รู้สึกว่าอันนี้ไม่เหมาะนัก","ro":"phûut mâi thùuk mʉ̌an gan, dtɛ̀ɛ rúu-sʉ̀k wâa an níi mâi mɔ̀ nák","en":"I don’t know how to say it either, but I feel this isn’t very suitable.","zh":"我也不知道該怎麼說，但我覺得這不太合適。"},{"th":"คิดไม่ออกว่าจะตอบยังไงดี","ro":"khít mâi ɔ̀ɔk wâa jà dtɔ̀ɔp yang-ngai dii","en":"I can’t think of how to reply.","zh":"想不出來該怎麼回才好。"}]}],"practice":[{"title":"A. Vocabulary Recall｜看中文想泰文","prompts":["吃不完","把手機忘在家","續簽 / 延長簽證","資料缺了一部分","想不出來要吃什麼","可以改成明天嗎？"],"answers":[["กินไม่หมด","gin mâi mòt","can’t finish eating it","吃不完"],["ลืมมือถือไว้ที่บ้าน","lʉʉm mʉʉ-thʉ̌ʉ wái thîi bâan","left my phone at home","我把手機忘在家裡了"],["ต่อวีซ่า","dtɔ̀ɔ wii-sâa","extend / renew a visa","延長/更新簽證"],["ข้อมูลขาดบางส่วน","khɔ̂ɔ-muun khàat baang sùan","some information is missing","缺少一些資訊"],["คิดไม่ออกว่าจะกินอะไร","khít mâi ɔ̀ɔk wâa jà gin à-rai","can’t think of what to eat","想不出吃什麼"],["เปลี่ยนเป็นพรุ่งนี้ได้ไหมคะ","bplìian bpen phrûng-níi dâai mái khá","Can we change it to tomorrow?","我們可以改到明天嗎？"]]},{"title":"B. Choose the right word｜選詞","prompts":["我不知道怎麼回答才好：ตอบไม่___（ถูก / ออก）","我想不出來：คิดไม่___（ถูก / ออก）","簽證快到期：วีซ่าใกล้___（ครบ / หมดอายุ）","改時間：___เวลา（ต่อ / เปลี่ยน）"],"answers":[["ตอบไม่ถูก","dtɔ̀ɔp mâi thùuk","don’t know how to answer properly","不知道如何正確回答"],["คิดไม่ออก","khít mâi ɔ̀ɔk","can’t think of it","想不出來"],["วีซ่าใกล้หมดอายุ","wii-sâa glâi mòt aa-yú","visa is about to expire","簽證即將到期"],["เปลี่ยนเวลา","bplìian wee-laa","change the time","改變時間"]]}],"g":[{"id":"g-compare","title":"近義比較","tth":"คำใกล้เคียง","em":"⚖️","kind":"compare"},{"id":"g-structure","title":"句型結構","tth":"โครงสร้างประโยค","em":"🧩","kind":"structure"},{"id":"g-mistake","title":"常見錯誤","tth":"ข้อผิดพลาดที่พบบ่อย","em":"🚫","kind":"mistake"},{"id":"g-dialogue","title":"情境短對話","tth":"บทสนทนาสั้นๆ","em":"💬","kind":"dialogue"},{"id":"g-sentence","title":"例句庫","tth":"ประโยคตัวอย่าง","em":"📝","kind":"sentence","src":"sentenceBank"},{"id":"g-bangkok","title":"曼谷生活場景","tth":"ฉากชีวิตกรุงเทพ","em":"🏙️","kind":"sentence","src":"bangkok"},{"id":"g-practice","title":"自我測驗","tth":"แบบฝึกหัด","em":"✅","kind":"practice"}]}</script>
<script>

let ROM=true,LANG='zh',isMob=window.innerWidth<769,curPl=null,FILTER='all';
const PROGRESS_KEY='thai_notes_lrn_2026_05_28_v1';
const FAV_KEY='thai_notes_fav_2026_05_28_v1';
function loadProgress(){
 try{const raw=localStorage.getItem(PROGRESS_KEY);const p=raw?JSON.parse(raw):{};return p&&typeof p==='object'&&!Array.isArray(p)?p:{};}catch(e){return{};}
}
function saveProgress(){try{localStorage.setItem(PROGRESS_KEY,JSON.stringify(LRN));}catch(e){console.warn('無法儲存學習進度。',e);}}
function loadFav(){
 try{const raw=localStorage.getItem(FAV_KEY);const p=raw?JSON.parse(raw):{};return p&&typeof p==='object'&&!Array.isArray(p)?p:{};}catch(e){return{};}
}
function saveFav(){try{localStorage.setItem(FAV_KEY,JSON.stringify(FAV));}catch(e){console.warn('無法儲存收藏。',e);}}
let LRN=loadProgress();
let FAV=loadFav();
const D=JSON.parse(document.getElementById('jd').textContent);
const VOCAB=D.vocab,CMP=D.compare,MIS=D.mistakes,DLG=D.dialogues,STR=D.structures,SENB=D.sentenceBank,BKK=D.bangkok,PRC=D.practice,GRP=D.g;
const TITLE='Thai Daily Notes',SUBTITLE='ไม่ทัน・แวะ・เลือกไม่ถูก';

function speak(t){
 if(!window.speechSynthesis||!t)return;
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);
 u.lang='th-TH';u.rate=0.88;u.pitch=1;
 window.speechSynthesis.speak(u);
}
function playBtn(el,t){
 if(curPl)curPl.classList.remove('pl');
 curPl=el;el.classList.add('pl');speak(t);
 setTimeout(()=>{if(curPl===el)el.classList.remove('pl');},3000);
}
function esc(s){return(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');}
function ab(t,e=''){return `<button class="abtn${e?' '+e:''}" onclick="event.stopPropagation();playBtn(this,'${esc(t)}')" title="播放">▶</button>`;}
function ro(cls,t){return `<div class="${cls}${ROM?'':' hid'}">${t||''}</div>`;}
function enzh(clsEn,clsZh,en,zh){const et=en||zh||'',zt=zh||en||'';return `<div class="${clsEn} lang-en${LANG==='en'?'':' hid'}">${et}</div><div class="${clsZh} lang-zh${LANG==='zh'?'':' hid'}">${zt}</div>`;}

/* ================= Vocabulary card (mirrors QA-50's rQ) ================= */
function rV(v){
 const id=v.i,lrn=LRN[id]?'lrn':'',fav=!!FAV[id];
 const num=parseInt(id.slice(1),10);
 const exHtml=(v.ex&&v.ex[0])?`<div class="ans"><div class="anl">例</div><div class="ant"><div class="anth">${v.ex[0]}</div>${ro('anro',v.ex[1]||'')}${enzh('anen','anzh',v.ex[2],v.ex[3])}</div>${ab(v.ex[0])}</div>`:'';
 const note=v.note?`<div class="note ng"><div class="ng-l">📖 語感筆記</div><div class="ng-t">${v.note}</div></div>`:'';
 const lb=LRN[id]?`<button class="lbtn dn" onclick="event.stopPropagation();tLrn('${id}',this)">↩ 改為未熟悉</button>`
  :`<button class="lbtn" onclick="event.stopPropagation();tLrn('${id}',this)">✓ 標記為熟悉</button>`;
 const favBtn=`<button class="favbtn ${fav?'on':''}" onclick="event.stopPropagation();tFav('${id}',this)">${fav?'★ 已收藏':'☆ 收藏'}</button>`;
 return `<div class="qc ${lrn}" id="${id}">
  <div class="qch" onclick="tCard('${id}')">
   <div class="qcn">${num}</div>
   <div class="qcq"><div class="qcth">${v.th}</div>${ro('qcro',v.ro)}${enzh('qcen','qczh',v.en,v.zh)}</div>
   <div class="qca">${ab(v.th)}<button class="xbtn">▾</button></div>
  </div>
  <div class="qcb"><div class="qcbi"><div class="div"></div>
   <div class="vb-tag" style="margin-bottom:9px;">${v.cat}</div>
   ${exHtml}
   <div class="notes">${note}</div>
   <div class="cft">${favBtn}${lb}</div>
  </div></div>
 </div>`;
}
function rVocabAll(){
 const done=getDoneCount();
 return `<div class="sec-blk" id="g-vocab">
  <div class="sec-hd"><div class="sec-n">📚</div>
   <div class="sec-tts"><div class="sec-tzh">詞彙庫</div><div class="sec-tth">คำศัพท์ทั้งหมด</div></div>
   <div class="sec-chip" id="chip-g-vocab">${done}/${VOCAB.length} 已熟悉</div>
  </div>${VOCAB.map(v=>rV(v)).join('')}
 </div>`;
}

/* ================= Compare (近義比較) ================= */
function rCmpRow(row){
 const termCell=row.term&&row.term[0]
  ?`<div class="cmp-term"><div class="cmp-pat">${row.term[0]}${ab(row.term[0])}</div>${ro('cmp-ex-ro',row.term[1])}${enzh('cmp-ex-en','cmp-ex-zh',row.term[2],row.term[3])}</div>`
  :`<div class="cmp-term"><div class="cmp-pat">—</div></div>`;
 return `<div class="cmp-row">${termCell}<div class="cmp-body"><div class="cmp-ex"><div class="cmp-ex-line"><div class="cmp-ex-tx"><div class="cmp-ex-th">${row.ex[0]}</div>${ro('cmp-ex-ro',row.ex[1])}${enzh('cmp-ex-en','cmp-ex-zh',row.ex[2],row.ex[3])}</div>${ab(row.ex[0])}</div></div></div></div>`;
}
function rCmpCard(c,i){
 return `<div class="cmp-card" id="CMP-${i}"><div class="cmp-title">${c.title}</div>${c.intro?`<div class="cmp-intro">${c.intro}</div>`:''}<div class="cmp-list">${c.rows.map(rCmpRow).join('')}</div>${c.tip?`<div class="cmp-tip">${c.tip}</div>`:''}</div>`;
}
function rCmpSec(){
 return `<div class="apx" id="g-compare"><div class="apx-hd"><div class="apx-ic">⚖️</div><div class="apx-tit"><div class="apx-tzh">近義比較</div><div class="apx-tth">คำใกล้เคียงที่ต้องแยกให้ออก</div></div></div>
  ${CMP.map((c,i)=>rCmpCard(c,i)).join('')}
 </div>`;
}

/* ================= Mistakes (常見錯誤) ================= */
function rMisBox(cls,label,box){
 if(!box)return'';
 return `<div class="mis-box ${cls}"><div class="mis-lbl">${label}</div><div class="mis-tx"><div class="mis-th">${box.th}</div>${ro('mis-ro',box.ro)}${enzh('mis-en','mis-zh',box.en,box.zh)}</div>${ab(box.th)}</div>`;
}
function rMisCard(m,i){
 return `<div class="mis-card" id="MIS-${i}">
  <div class="mis-title">${m.title}</div>
  ${rMisBox('mis-wrong',(m.wrong&&m.wrong.label)?m.wrong.label:'Wrong',m.wrong)}
  ${rMisBox('mis-better',(m.better&&m.better.label)?m.better.label:'Better',m.better)}
  ${m.why?`<div class="mis-why">💡 ${m.why}</div>`:''}
 </div>`;
}
function rMisSec(){
 return `<div class="apx" id="g-mistake"><div class="apx-hd"><div class="apx-ic">🚫</div><div class="apx-tit"><div class="apx-tzh">常見錯誤</div><div class="apx-tth">ข้อผิดพลาดที่พบบ่อย</div></div></div>
  ${MIS.map((m,i)=>rMisCard(m,i)).join('')}
 </div>`;
}

/* ================= Structures (句型結構) ================= */
function rStrExample(ex){
 return `<div class="str-ex"><div style="display:flex;align-items:flex-start;gap:8px;"><div><div class="str-th">${ex[0]}</div>${ro('str-ro',ex[1])}${enzh('str-en','str-zh',ex[2],ex[3])}</div>${ab(ex[0])}</div></div>`;
}
function rStrCard(st,i){
 const examples=(st.examples&&st.examples.length)?st.examples:(st.ex?[st.ex]:[]);
 return `<div class="str-card" id="STR-${i}">
  <div class="str-title">${st.title}</div>
  ${st.meaning?`<div class="str-mean">${st.meaning}</div>`:''}
  ${examples.map(rStrExample).join('')}
 </div>`;
}
function rStrSec(){
 return `<div class="apx" id="g-structure"><div class="apx-hd"><div class="apx-ic">🧩</div><div class="apx-tit"><div class="apx-tzh">句型結構</div><div class="apx-tth">โครงสร้างประโยคที่ใช้บ่อย</div></div></div>
  <div class="str-grid">${STR.map((st,i)=>rStrCard(st,i)).join('')}</div>
 </div>`;
}

/* ================= Dialogues (情境短對話) ================= */
function rDlgTurn(t){
 const side=t.side==='left'?'l':'r';
 return `<div class="dlg-row ${side}"><div class="dlg-bub"><div class="dlg-spk">${t.speaker}</div><div style="display:flex;align-items:flex-start;gap:8px;"><div><div class="dlg-th">${t.th}</div>${ro('dlg-ro',t.ro)}${enzh('dlg-en','dlg-zh',t.en,t.zh)}</div>${ab(t.th)}</div></div></div>`;
}
function rDlgCard(d,i){
 return `<div class="dlg-card" id="DLG-${i}">
  <div class="dlg-title">${d.title}</div>
  <div class="dlg-thread">${d.turns.map(rDlgTurn).join('')}</div>
 </div>`;
}
function rDlgSec(){
 return `<div class="apx" id="g-dialogue"><div class="apx-hd"><div class="apx-ic">💬</div><div class="apx-tit"><div class="apx-tzh">情境短對話</div><div class="apx-tth">บทสนทนาสั้นๆ</div></div></div>
  ${DLG.map((d,i)=>rDlgCard(d,i)).join('')}
 </div>`;
}

/* ================= Sentence groups (例句庫 / 曼谷場景) ================= */
function rSenItem(s){
 return `<div class="sen-item"><div><div class="sen-th">${s.th}</div>${ro('sen-ro',s.ro)}${enzh('sen-en','sen-zh',s.en,s.zh)}</div>${ab(s.th)}</div>`;
}
function rSenGroup(grp,gi,idPrefix){
 return `<div class="sen-group" id="${idPrefix}-${gi}">
  <div class="sen-scene">${grp.scene}</div>
  <div class="sen-grid">${grp.sentences.map(rSenItem).join('')}</div>
 </div>`;
}
function rSenSec(list,secId,title,tth,em,idPrefix){
 return `<div class="apx" id="${secId}"><div class="apx-hd"><div class="apx-ic">${em}</div><div class="apx-tit"><div class="apx-tzh">${title}</div><div class="apx-tth">${tth}</div></div></div>
  ${list.map((g,gi)=>rSenGroup(g,gi,idPrefix)).join('')}
 </div>`;
}

/* ================= Practice (自我測驗) ================= */
function rPrcCard(p,i){
 const prompts=(p.prompts&&p.prompts.length)?p.prompts:(p.prompt?[p.prompt]:[]);
 const answers=(p.answers&&p.answers.length)?p.answers:(p.ans?[p.ans]:[]);
 const promptHtml=prompts.map(t=>`<div class="prc-prompt">${t}</div>`).join('');
 const ansHtml=answers.map(a=>`<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;"><div><div class="str-th">${a[0]}</div>${ro('str-ro',a[1])}${enzh('str-en','str-zh',a[2],a[3])}</div>${ab(a[0])}</div>`).join('');
 return `<div class="prc-card" id="PRC-${i}">
  <div class="prc-title">Q${i+1}｜${p.title||''}</div>
  ${promptHtml}
  <div class="prc-ans-wrap">
   <button class="prc-ans-btn" onclick="tPrc(${i})" id="prc-btn-${i}">👁 顯示答案</button>
   <div class="prc-ans" id="prc-ans-${i}">
    ${ansHtml}
   </div>
  </div>
 </div>`;
}
function rPrcSec(){
 return `<div class="apx" id="g-practice"><div class="apx-hd"><div class="apx-ic">✅</div><div class="apx-tit"><div class="apx-tzh">自我測驗</div><div class="apx-tth">แบบฝึกหัดทบทวนตัวเอง</div></div></div>
  ${PRC.map((p,i)=>rPrcCard(p,i)).join('')}
 </div>`;
}
function tPrc(i){
 const el=document.getElementById('prc-ans-'+i);
 const btn=document.getElementById('prc-btn-'+i);
 const show=el.classList.toggle('show');
 btn.textContent=show?'🙈 隱藏答案':'👁 顯示答案';
}

function rGroups(){
 return GRP.map(g=>{
  if(g.kind==='compare')return rCmpSec();
  if(g.kind==='mistake')return rMisSec();
  if(g.kind==='structure')return rStrSec();
  if(g.kind==='dialogue')return rDlgSec();
  if(g.kind==='practice')return rPrcSec();
  if(g.kind==='sentence'&&g.src==='sentenceBank')return rSenSec(SENB,g.id,g.title,g.tth,g.em,'SB');
  if(g.kind==='sentence'&&g.src==='bangkok')return rSenSec(BKK,g.id,g.title,g.tth,g.em,'BK');
  return '';
 }).join('');
}

/* ================= 我的收藏 ================= */
function renderFavSec(){
 const el=document.getElementById('favSec');
 if(!el)return;
 const ids=Object.keys(FAV).filter(k=>FAV[k]);
 if(!ids.length){
  el.innerHTML=`<div class="sec-hd"><div class="sec-n">⭐</div><div class="sec-tts"><div class="sec-tzh">我的收藏</div><div class="sec-tth">รายการโปรดของฉัน</div></div></div><div class="empty-fav">還沒有收藏，點單字卡上的「☆ 收藏」把它加進這裡，方便之後複習。</div>`;
  return;
 }
 const cards=ids.map(id=>{
  const v=VOCAB.find(x=>x.i===id);
  if(!v)return '';
  return `<div class="sres-item" onclick="jumpTo('${id}')"><span class="sres-tag">詞彙</span><div class="sres-b"><div class="sres-th">${v.th}</div>${ro('sres-ro',v.ro)}${enzh('sres-en','sres-zh',v.en,v.zh)}</div>${ab(v.th)}</div>`;
 }).join('');
 el.innerHTML=`<div class="sec-hd"><div class="sec-n">⭐</div><div class="sec-tts"><div class="sec-tzh">我的收藏</div><div class="sec-tth">รายการโปรดของฉัน</div></div><div class="sec-chip">${ids.length} 筆</div></div><div class="sres-list">${cards}</div>`;
}
function tFav(id,btn){
 FAV[id]=!FAV[id];
 if(!FAV[id])delete FAV[id];
 saveFav();
 if(btn){btn.classList.toggle('on',!!FAV[id]);btn.textContent=FAV[id]?'★ 已收藏':'☆ 收藏';}
 renderFavSec();
 const navB=document.getElementById('nav-favSec-badge');
 if(navB)navB.textContent=Object.keys(FAV).filter(k=>FAV[k]).length;
}

/* ================= Sidebar / Content shell ================= */
function getDoneCount(){return VOCAB.filter(v=>LRN[v.i]).length;}

function rSB(){
 const done=getDoneCount();
 const total=VOCAB.length;
 const totalPct=Math.round(done/total*100);
 const favCount=Object.keys(FAV).filter(k=>FAV[k]).length;
 let h=`<div class="sb-book"><div class="sb-th">${TITLE}</div><div class="sb-zh">${SUBTITLE}</div><div class="sb-ct" id="sb-total">✓ ${done}/${total} 已熟悉</div><div class="sb-track" aria-label="學習進度"><div class="sb-track-fill" id="sb-track-fill" style="width:${totalPct}%"></div></div><div class="sb-filter" aria-label="熟悉狀態篩選"><button class="filter-btn ${FILTER==='all'?'on':''}" data-filter="all" onclick="setFilter('all')">全部</button><button class="filter-btn ${FILTER==='learned'?'on':''}" data-filter="learned" onclick="setFilter('learned')">已熟悉</button><button class="filter-btn ${FILTER==='unlearned'?'on':''}" data-filter="unlearned" onclick="setFilter('unlearned')">未熟悉</button></div><div class="sb-actions"><button class="sb-btn" onclick="resetProgress()">重設進度</button></div><div class="sb-save-note">進度與收藏會記在目前這台裝置的瀏覽器中。</div></div>
  <div class="nav-grp"><div class="nit" id="nav-favSec" onclick="goto('favSec')"><div class="nit-em">⭐</div><div class="nit-tx"><div class="nit-t">我的收藏</div></div><div class="nit-b" id="nav-favSec-badge">${favCount}</div></div></div>
  <div class="nav-grp"><div class="nav-lbl">詞彙</div>
   <div class="nit" id="nav-g-vocab" onclick="goto('g-vocab')"><div class="nit-em">📚</div><div class="nit-tx"><div class="nit-t">詞彙庫</div></div><div class="nit-b" id="nav-count-g-vocab">${done}/${total}</div></div>
   <div class="nprog"><div class="nprog-b" id="nav-prog-g-vocab" style="width:${totalPct}%"></div></div>
  </div>
  <div class="nav-grp"><div class="nav-lbl">延伸內容</div>`;
 GRP.forEach(g=>{
  h+=`<div class="nit" id="nav-${g.id}" onclick="goto('${g.id}')"><div class="nit-em">${g.em}</div><div class="nit-tx"><div class="nit-t">${g.title}</div><div class="nit-s">${g.tth}</div></div></div>`;
 });
 h+=`</div>`;
 document.getElementById('sb').innerHTML=h;
}

function rCnt(){
 document.getElementById('cnt').innerHTML=`<div id="normalView">
   <div class="sec-blk" id="favSec"></div>
   ${rVocabAll()}
   ${rGroups()}
  </div>
  <div id="searchView" class="hid-view"></div>`;
 renderFavSec();
}

function tCard(id){document.getElementById(id).classList.toggle('exp');}
function updateKnownCard(id){
 const known=!!LRN[id];
 const c=document.getElementById(id);
 if(!c)return;
 c.classList.toggle('lrn',known);
 const n=c.querySelector('.qcn');
 if(n)n.style.background=known?'var(--gl)':'var(--gd)';
 const btn=c.querySelector('.lbtn');
 if(btn){
  btn.textContent=known?'↩ 改為未熟悉':'✓ 標記為熟悉';
  btn.classList.toggle('dn',known);
  btn.setAttribute('aria-pressed',String(known));
 }
}
function refreshProgress(){
 const done=getDoneCount(),total=VOCAB.length,pct=Math.round(done/total*100);
 const totalEl=document.getElementById('sb-total');
 const trackEl=document.getElementById('sb-track-fill');
 if(totalEl)totalEl.textContent=`✓ ${done}/${total} 已熟悉`;
 if(trackEl)trackEl.style.width=`${pct}%`;
 const chip=document.getElementById('chip-g-vocab');
 const count=document.getElementById('nav-count-g-vocab');
 const bar=document.getElementById('nav-prog-g-vocab');
 if(chip)chip.textContent=`${done}/${total} 已熟悉`;
 if(count)count.textContent=`${done}/${total}`;
 if(bar)bar.style.width=`${pct}%`;
}
function applyFilter(){
 VOCAB.forEach(v=>{
  const c=document.getElementById(v.i);
  if(!c)return;
  const known=!!LRN[v.i];
  const hide=(FILTER==='learned'&&!known)||(FILTER==='unlearned'&&known);
  c.classList.toggle('filtered-out',hide);
 });
 const vsec=document.getElementById('g-vocab');
 if(vsec){
  const visible=[...vsec.querySelectorAll('.qc')].some(c=>!c.classList.contains('filtered-out'));
  vsec.classList.toggle('filtered-out',!visible);
 }
 document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('on',b.dataset.filter===FILTER));
}
function setFilter(mode){FILTER=mode;applyFilter();}
function tLrn(id,btn){
 LRN[id]=!LRN[id];
 if(!LRN[id])delete LRN[id];
 updateKnownCard(id);
 saveProgress();
 refreshProgress();
 applyFilter();
}
function resetProgress(){
 if(!getDoneCount())return;
 if(!window.confirm('確定要把所有單字改回未熟悉嗎？'))return;
 LRN={};
 VOCAB.forEach(v=>updateKnownCard(v.i));
 saveProgress();
 refreshProgress();
 applyFilter();
}
function syncProgressFromStorage(){
 LRN=loadProgress();
 VOCAB.forEach(v=>updateKnownCard(v.i));
 refreshProgress();
 applyFilter();
}
function goto(id){
 const el=document.getElementById(id);
 if(el){el.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>setAct(id),400);}
 if(isMob)document.getElementById('sb').classList.remove('mob-open');
}
function setAct(id){
 document.querySelectorAll('.nit').forEach(n=>n.classList.remove('act'));
 const nav=document.getElementById('nav-'+id);if(nav)nav.classList.add('act');
}
function toggleSB(){
 const sb=document.getElementById('sb');
 if(isMob)sb.classList.toggle('mob-open');else sb.classList.toggle('col');
}

function toggleLang(){
 LANG=LANG==='zh'?'en':'zh';
 document.querySelectorAll('.lang-en').forEach(e=>e.classList.toggle('hid',LANG!=='en'));
 document.querySelectorAll('.lang-zh').forEach(e=>e.classList.toggle('hid',LANG!=='zh'));
 const b=document.getElementById('btnL');
 b.classList.toggle('on',LANG==='en');
 b.setAttribute('aria-pressed',String(LANG==='en'));
 b.textContent=LANG==='zh'?'中文':'EN';
}
function toggleRom(){
 ROM=!ROM;
 document.querySelectorAll('.qcro,.anro,.furo,.prom,.vro,.fro,.ptro,.par-ro,.sro,.cmp-ex-ro,.mis-ro,.str-ro,.dlg-ro,.sen-ro,.sres-ro').forEach(e=>e.classList.toggle('hid',!ROM));
 const b=document.getElementById('btnR');
 b.classList.toggle('on',ROM);
 b.setAttribute('aria-pressed',String(ROM));
 b.textContent=ROM?'拼音 ✓':'拼音 ✗';
}
function syncViewportMode(){
 const nextMob=window.innerWidth<769;
 const sb=document.getElementById('sb');
 if(nextMob!==isMob){isMob=nextMob;sb.classList.remove('col','mob-open');}
}
function initSpy(){
 const ids=['favSec','g-vocab',...GRP.map(g=>g.id)];
 const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)setAct(e.target.id);});},{threshold:0.15,rootMargin:'-52px 0px -70% 0px'});
 ids.forEach(id=>{const el=document.getElementById(id);if(el)obs.observe(el);});
}

/* ================= 全域搜尋 ================= */
let SEARCH_INDEX=[];
function buildIndex(){
 const idx=[];
 VOCAB.forEach(v=>{
  idx.push({id:v.i,tag:'詞彙庫',th:v.th,ro:v.ro,en:v.en,zh:v.zh||'',
   blob:[v.th,v.ro,v.en,v.zh||'',v.note||'',...(v.ex||[])].join(' ')});
 });
 CMP.forEach((c,i)=>{
  if(c.rows&&c.rows.length){
   c.rows.forEach(row=>{
    const termTh=(row.term&&row.term[0])?row.term[0]:row.ex[0];
    const termRo=(row.term&&row.term[1])?row.term[1]:row.ex[1];
    const termEn=(row.term&&row.term[2])?row.term[2]:'';
    const termZh=(row.term&&row.term[3])?row.term[3]:(row.meaning||'');
    idx.push({id:'CMP-'+i,tag:'近義比較・'+c.title,th:termTh,ro:termRo,en:termEn+'　'+(row.ex[2]||''),zh:termZh+'　'+(row.ex[3]||''),
     blob:[c.title,c.intro||'',(row.term||[]).join(' '),row.meaning||'',row.ex.join(' ')].join(' ')});
   });
  } else {
   idx.push({id:'CMP-'+i,tag:'近義比較',th:c.title,ro:'',zh:c.tip||c.intro||'',blob:c.title+' '+(c.tip||'')+' '+(c.intro||'')});
  }
 });
 MIS.forEach((m,i)=>{
  const w=m.wrong||{},b=m.better||{};
  idx.push({id:'MIS-'+i,tag:'常見錯誤',th:(w.th||'')+' → '+(b.th||''),ro:b.ro||'',en:b.en||'',zh:(b.zh||'')+'　'+m.title+'：'+(m.why||''),
   blob:[m.title,w.th||'',w.ro||'',w.en||'',w.zh||'',b.th||'',b.ro||'',b.en||'',b.zh||'',m.why||''].join(' ')});
 });
 STR.forEach((st,i)=>{
  const examples=(st.examples&&st.examples.length)?st.examples:(st.ex?[st.ex]:[]);
  const first=examples[0]||['','',''];
  idx.push({id:'STR-'+i,tag:'句型結構',th:first[0]||st.title,ro:first[1]||'',en:first[2]||'',zh:(first[3]||'')+'　'+st.title+'　'+(st.meaning||''),
   blob:[st.title,st.meaning||'',examples.map(e=>e.join(' ')).join(' ')].join(' ')});
 });
 DLG.forEach((d,i)=>{
  d.turns.forEach(t=>{
   idx.push({id:'DLG-'+i,tag:'情境對話・'+d.title,th:t.th,ro:t.ro,en:t.en,zh:t.zh||'',
    blob:[d.title,t.speaker,t.th,t.ro,t.en,t.zh||''].join(' ')});
  });
 });
 SENB.forEach((g,gi)=>{
  g.sentences.forEach(s=>{
   idx.push({id:'SB-'+gi,tag:'例句庫・'+g.scene,th:s.th,ro:s.ro,en:s.en,zh:s.zh||'',blob:[g.scene,s.th,s.ro,s.en,s.zh||''].join(' ')});
  });
 });
 BKK.forEach((g,gi)=>{
  g.sentences.forEach(s=>{
   idx.push({id:'BK-'+gi,tag:'曼谷場景・'+g.scene,th:s.th,ro:s.ro,en:s.en,zh:s.zh||'',blob:[g.scene,s.th,s.ro,s.en,s.zh||''].join(' ')});
  });
 });
 PRC.forEach((p,i)=>{
  const prompts=(p.prompts&&p.prompts.length)?p.prompts:(p.prompt?[p.prompt]:[]);
  const answers=(p.answers&&p.answers.length)?p.answers:(p.ans?[p.ans]:[]);
  idx.push({id:'PRC-'+i,tag:'自我測驗',th:prompts.join(' / ')||p.title||'',ro:'',zh:answers.map(a=>a.join(' ')).join(' / '),
   blob:[p.title||'',prompts.join(' '),answers.map(a=>a.join(' ')).join(' ')].join(' ')});
 });
 SEARCH_INDEX=idx;
}
function doSearch(qstr){
 const q=(qstr||'').trim().toLowerCase();
 const nv=document.getElementById('normalView'),sv=document.getElementById('searchView'),clearBtn=document.getElementById('searchClear');
 if(clearBtn)clearBtn.classList.toggle('show',q.length>0);
 if(!q){nv.classList.remove('hid-view');sv.classList.add('hid-view');sv.innerHTML='';return;}
 nv.classList.add('hid-view');sv.classList.remove('hid-view');
 const matches=SEARCH_INDEX.filter(it=>it.blob.toLowerCase().includes(q));
 const seen=new Set(),uniq=[];
 for(const m of matches){const key=m.id+'|'+m.th;if(seen.has(key))continue;seen.add(key);uniq.push(m);if(uniq.length>=60)break;}
 if(!uniq.length){sv.innerHTML=`<div class="sres-hd">沒有找到符合的內容，換個關鍵字試試。</div>`;return;}
 sv.innerHTML=`<div class="sres-hd">找到 ${uniq.length} 筆符合的內容</div><div class="sres-list">${uniq.map(m=>
  `<div class="sres-item" onclick="jumpTo('${m.id}')"><span class="sres-tag">${m.tag}</span><div class="sres-b"><div class="sres-th">${m.th}</div>${m.ro?ro('sres-ro',m.ro):''}${enzh('sres-en','sres-zh',m.en,m.zh)}</div>${ab(m.th)}</div>`
 ).join('')}</div>`;
}
function clearSearch(){
 const input=document.getElementById('searchInput');
 if(input)input.value='';
 doSearch('');
}
function jumpTo(id){
 clearSearch();
 setTimeout(()=>{
  const el=document.getElementById(id);
  if(!el)return;
  if(id[0]==='V')el.classList.add('exp');
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.classList.add('flash');
  setTimeout(()=>el.classList.remove('flash'),1500);
  const parentSec=el.closest('.sec-blk')||el.closest('.apx');
  setAct(parentSec?parentSec.id:id);
  if(isMob)document.getElementById('sb').classList.remove('mob-open');
 },60);
}

rSB();rCnt();refreshProgress();applyFilter();initSpy();buildIndex();
window.addEventListener('resize',syncViewportMode);
window.addEventListener('storage',e=>{
 if(e.key===PROGRESS_KEY)syncProgressFromStorage();
 if(e.key===FAV_KEY){FAV=loadFav();rCnt();initSpy();}
});

</script>
