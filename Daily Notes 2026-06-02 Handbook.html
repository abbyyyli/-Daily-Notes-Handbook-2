.top-r{display:flex;gap:6px;}.cbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 11px;border-radius:6px;cursor:pointer;font-size:12px;font-family:var(--fu);transition:all .15s;white-space:nowrap;}.cbtn:hover{background:rgba(255,255,255,.22);}.cbtn.on{background:var(--acc);border-color:var(--acc);}.cbtn:focus-visible,.lbtn:focus-visible,.sb-btn:focus-visible,.filter-btn:focus-visible,.abtn:focus-visible,.xbtn:focus-visible,.burg:focus-visible{outline:2px solid #fff;outline-offset:2px;}
.lay{display:flex;margin-top:52px;height:calc(100vh - 52px);}

.sb-th{font-family:var(--ft);font-size:26px;font-weight:700;color:var(--sbti);}.sb-zh{font-family:var(--fz);font-size:10px;color:var(--sbt);margin-top:3px;opacity:.75;}.sb-ct{font-size:10px;color:var(--acc);font-weight:700;margin-top:8px;}.sb-track{height:4px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin-top:7px;}.sb-track-fill{height:100%;width:0;background:var(--acc);border-radius:inherit;transition:width .25s ease;}.sb-actions,.sb-filter{display:flex;gap:6px;margin-top:9px;}.sb-btn,.filter-btn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--sbt);font-family:var(--fz);font-size:10px;line-height:1;padding:6px 8px;border-radius:6px;cursor:pointer;transition:all .15s;}.sb-btn:hover,.filter-btn:hover,.filter-btn.on{background:var(--sba);border-color:rgba(255,255,255,.32);color:var(--sbti);}.sb-btn{color:rgba(255,255,255,.65);}.sb-save-note{font-family:var(--fz);font-size:9px;line-height:1.45;color:rgba(181,212,192,.5);margin-top:8px;}.nit-b{min-width:34px;}

.qcb{max-height:0;overflow:hidden;transition:max-height .32s ease;}.qc.exp .qcb{max-height:900px;}.qcbi{padding:0 15px 15px;}.div{height:1px;background:var(--bdl);margin:0 -15px 14px;}
.ans{display:flex;align-items:flex-start;gap:11px;padding:9px 11px;border-radius:8px;background:rgba(61,43,36,.045);margin-bottom:8px;}
.anl{flex-shrink:0;width:23px;height:23px;border-radius:50%;background:var(--gd);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:2px;}
.ant{flex:1;min-width:0;}.anth{font-family:var(--ft);font-size:18px;font-weight:500;color:var(--thai);line-height:1.4;}
.anro{font-family:var(--ft);font-size:11.5px;color:var(--rom);font-style:italic;margin-top:2px;}.anzh{font-family:var(--fz);font-size:12px;color:var(--mu);margin-top:3px;}
.subs{margin-top:11px;}.sub-lbl{font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px;}

/* ===== Extended handout styles v2 (vocab-driven, QA-50 architecture) ===== */
.favbtn{display:flex;align-items:center;gap:5px;padding:5px 13px;border-radius:18px;border:1px solid var(--bd);background:transparent;font-size:11px;color:var(--mu);cursor:pointer;font-family:var(--fz);transition:all .15s;margin-right:6px;}

.cft{justify-content:space-between!important;}

.empty-fav{padding:16px;text-align:center;color:var(--mu);font-family:var(--fz);font-size:12.5px;background:var(--bgc);border:1px dashed var(--bd);border-radius:10px;}

/* search */
.stop-wrap{position:relative;flex:1;max-width:340px;margin:0 10px;}
.sinput{width:100%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:7px 30px 7px 11px;font-size:12.5px;font-family:var(--fz);outline:none;}
.sinput::placeholder{color:rgba(255,255,255,.5);}
.sinput:focus{background:rgba(255,255,255,.18);}
.sclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:13px;display:none;}
.sclear.show{display:block;}
.sres-hd{font-family:var(--fz);font-size:13px;color:var(--mu);margin:0 0 12px;padding-bottom:10px;border-bottom:2px solid var(--bd);}

.sres-item:hover{border-color:var(--gl);box-shadow:0 2px 8px rgba(0,0,0,.06);}
.sres-tag{flex-shrink:0;font-size:9.5px;font-weight:700;color:var(--acc);background:var(--accl);border:1px solid rgba(200,154,58,.3);padding:3px 8px;border-radius:20px;white-space:nowrap;margin-top:2px;}
.sres-b{flex:1;min-width:0;}
.sres-th{font-family:var(--ft);font-size:16px;color:var(--thai);}
.sres-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:1px;}
.sres-zh{font-family:var(--fz);font-size:12px;color:var(--mu);margin-top:2px;}
.hid-view{display:none!important;}

/* compare */
.cmp-card{background:var(--bgc);border:1px solid var(--bdl);border-radius:10px;padding:15px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.cmp-title{font-family:var(--fz);font-size:14.5px;font-weight:700;color:var(--t);margin:0 0 5px;line-height:1.55;}
.cmp-intro{font-family:var(--fz);font-size:12px;color:var(--mu);line-height:1.6;margin-bottom:4px;}
.cmp-list{display:block;}
.cmp-row{display:grid;grid-template-columns:minmax(125px,175px) minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--bdl);align-items:start;}
.cmp-list .cmp-row:first-child{border-top:none;}
.cmp-term{min-width:0;}
.cmp-pat{display:flex;align-items:flex-start;gap:5px;font-family:var(--ft);font-size:16px;line-height:1.4;color:var(--acc);font-weight:700;}
.cmp-pat .abtn{margin-top:0;}
.cmp-ex-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:2px;overflow-wrap:anywhere;}
.cmp-ex-en,.cmp-ex-zh{font-family:var(--fz);font-size:11.5px;color:var(--mu);margin-top:3px;line-height:1.5;}
.cmp-body{min-width:0;}
.cmp-ex{margin-top:7px;padding:8px 10px;border-radius:8px;background:rgba(65,40,47,.045);}
.cmp-ex-line{display:flex;align-items:flex-start;gap:8px;}
.cmp-ex-tx{flex:1;min-width:0;}
.cmp-ex-th{font-family:var(--ft);font-size:15px;color:var(--thai);line-height:1.45;}
.cmp-tip{margin-top:10px;padding:9px 11px;border-radius:8px;background:var(--bgh);border:1px solid var(--bdl);font-family:var(--fz);font-size:12px;color:var(--tm);line-height:1.65;}
@media(max-width:640px){.cmp-row{grid-template-columns:1fr;gap:7px;padding:11px 0}.cmp-pat{font-size:16px}.cmp-ex{margin-top:6px}}

/* mistakes */
.mis-card{background:var(--bgc);border:1px solid var(--bdl);border-radius:10px;padding:15px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.mis-title{font-family:var(--fz);font-size:14.5px;font-weight:700;color:var(--t);margin-bottom:10px;}
.mis-box{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:8px;margin-bottom:8px;}
.mis-wrong{background:rgba(200,60,50,.07);border:1px solid rgba(200,60,50,.18);}
.mis-better{background:rgba(192,138,62,.1);border:1px solid rgba(192,138,62,.24);}
.mis-lbl{flex-shrink:0;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:3px 7px;border-radius:5px;margin-top:2px;}
.mis-wrong .mis-lbl{background:#c0392b;color:#fff;}
.mis-better .mis-lbl{background:var(--gl);color:#fff;}
.mis-tx{flex:1;}
.mis-th{font-family:var(--ft);font-size:15px;color:var(--thai);}
.mis-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:1px;}
.mis-en{font-family:var(--fz);font-size:11.5px;color:var(--mu);margin-top:2px;}
.mis-why{font-family:var(--fz);font-size:12.5px;color:var(--tm);line-height:1.65;padding:9px 11px;border-radius:8px;background:#f8f5f1;border:1px solid var(--bdl);}

/* structures */
.str-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
.str-card{background:var(--bgc);border:1px solid var(--bdl);border-left:4px solid var(--gl);border-radius:10px;padding:13px 14px;}
.str-title{font-family:var(--fz);font-size:13.5px;font-weight:700;color:var(--t);}
.str-mean{font-family:var(--fz);font-size:11.5px;color:var(--mu);margin-top:5px;line-height:1.55;}
.str-ex{margin-top:9px;padding:8px 10px;border-radius:8px;background:rgba(61,43,36,.045);}
.str-th{font-family:var(--ft);font-size:15px;color:var(--thai);}
.str-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:1px;}
.str-en{font-family:var(--fz);font-size:11px;color:var(--mu);margin-top:2px;}

/* dialogues */
.dlg-card{background:var(--bgc);border:1px solid var(--bdl);border-radius:10px;padding:15px;margin-bottom:12px;}
.dlg-title{font-family:var(--fz);font-size:14.5px;font-weight:700;color:var(--t);margin-bottom:11px;}
.dlg-thread{display:flex;flex-direction:column;gap:9px;}
.dlg-row{display:flex;width:100%;}
.dlg-row.l{justify-content:flex-start;}.dlg-row.r{justify-content:flex-end;}
.dlg-bub{max-width:76%;border:1px solid var(--bdl);border-radius:14px;padding:9px 12px;background:#fff;}
.dlg-row.l .dlg-bub{border-top-left-radius:4px;background:#f6faf7;}
.dlg-row.r .dlg-bub{border-top-right-radius:4px;background:#fbf8f0;}
.dlg-spk{font-size:10px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.dlg-th{font-family:var(--ft);font-size:15px;color:var(--thai);}
.dlg-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:1px;}
.dlg-en{font-family:var(--fz);font-size:11.5px;color:var(--mu);margin-top:2px;}

/* sentence groups */
.sen-group{margin-bottom:16px;}
.sen-scene{display:inline-flex;font-size:11px;font-weight:700;color:#fff;background:var(--gm);padding:4px 11px;border-radius:20px;margin-bottom:9px;}
.sen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;}
.sen-item{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:8px;background:var(--bgc);border:1px solid var(--bdl);}
.sen-th{font-family:var(--ft);font-size:14.5px;color:var(--thai);}
.sen-ro{font-family:var(--ft);font-size:10.5px;color:var(--rom);font-style:italic;margin-top:1px;}
.sen-en{font-family:var(--fu);font-size:11px;color:#6b7280;margin-top:2px;}
.qcen,.anen,.sres-en,.mis-en,.str-en,.dlg-en,.cmp-ex-en{font-family:var(--fu);color:#6b7280;}
.qczh,.anzh,.sres-zh,.mis-zh,.str-zh,.dlg-zh,.sen-zh,.cmp-ex-zh{font-family:var(--fz);color:var(--tm);margin-top:3px;line-height:1.55;}
.qcen{font-size:12px;margin-top:3px}.qczh{font-size:13px}.anen,.anzh,.mis-zh,.str-zh,.dlg-zh,.sen-zh,.sres-en,.sres-zh{font-size:11.5px}

/* practice */
.prc-card{background:var(--bgc);border:1px solid var(--bdl);border-radius:10px;padding:13px 14px;margin-bottom:9px;}
.prc-title{font-size:10px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.6px;}
.prc-prompt{font-family:var(--fz);font-size:13.5px;color:var(--t);margin-top:5px;line-height:1.6;}
.prc-ans-wrap{margin-top:9px;}
.prc-ans-btn{font-family:var(--fz);font-size:11.5px;color:var(--gm);background:none;border:1px solid var(--bd);border-radius:16px;padding:5px 12px;cursor:pointer;}
.prc-ans-btn:hover{border-color:var(--gl);}
.prc-ans{display:none;margin-top:9px;padding:9px 11px;border-radius:8px;background:rgba(192,138,62,.09);border:1px solid rgba(192,138,62,.22);}
.prc-ans.show{display:block;}
.prc-ans .str-th{font-size:14.5px;}

@media(max-width:920px){
 .stop-wrap{display:none;}
 .cmp-row{grid-template-columns:1fr;}
 .str-grid,.sen-grid{grid-template-columns:1fr;}
}

x":["ฉันแค่อยากช่วยเท่านั้น","chǎn khɛ̂ɛ yàak chûai thâo-nán","I only wanted to help.","我只是想幫忙。"],"i":"V008","zh":"只是……而已／只有……而已"},{"th":"ก็เลย","ro":"gɔ̂ɔ ləəy","en":"so; that’s why","cat":"Local usage","note":"比 therefore 更聊天，像中文「所以就…… / 結果就……」。","ex":["ไม่รู้ก็เลยถาม","mâi rúu gɔ̂ɔ ləəy thǎam","I didn’t know, so I asked.","我不知道，所以我問了。"],"i":"V009","zh":"所以就……／結果就……"},{"th":"ง่วง","ro":"ngûang","en":"sleepy; drowsy","cat":"Practical Usage","note":"不是累，而是想睡。","ex":["กินข้าวแล้วง่วง","gin khâaw lɛ́ɛw ngûang","I get sleepy after eating.","我吃完飯後就困了。"],"i":"V010","zh":"想睡／睏"},{"th":"นับ","ro":"náp","en":"count; consider","cat":"Local usage","note":"除了數數，也表示算不算、從某時開始算、算是。","ex":["อันนี้ไม่นับนะ","an-níi mâi náp ná","This doesn’t count.","這不算數。"],"i":"V011","zh":"數／計算／算作"},{"th":"ต้องการ","ro":"dtɔ̂ng-gaan","en":"want; need; require","cat":"Practical Usage","note":"比อยาก更正式、更有需求感，介於想要與需要。","ex":["ฉันต้องการเวลาหน่อย","chǎn dtɔ̂ng-gaan wee-laa nɔ̀i","I need some time.","我需要一些時間。"],"i":"V012","zh":"需要／想要（較正式）"},{"th":"เป็นอะไร","ro":"bpen à-rai","en":"what’s wrong?","cat":"Local usage","note":"字面不是「是什麼」，自然語感是「怎麼了 / 還好嗎」。","ex":["ทำไมเงียบจัง เป็นอะไรหรือเปล่า","tham-mai ngîiap jang, bpen à-rai rʉ̌ʉ bplào","Why are you so quiet? Is something wrong?","你為什麼這麼安靜？ 有什麼問題嗎？"],"i":"V013","zh":"怎麼了？／還好嗎？"},{"th":"ทั้ง...และ...","ro":"tháng...lɛ́ʔ...","en":"both...and...","cat":"Textbook-based","note":"強調 A 和 B 都成立，適合特質、身份、大項目並列。","ex":["ร้านนี้ทั้งถูกและอร่อย","ráan níi tháng thùuk lɛ́ʔ à-rɔ̀i","This restaurant is both cheap and delicious.","這家餐廳既便宜又美味。"],"i":"V014","zh":"既……又……／A 和 B 都……"},{"th":"ลง","ro":"long","en":"go down; register; post","cat":"Practical Usage","note":"核心是下去、放下去；延伸為註冊、選課、發照片、簽名。","ex":["ทำไมไม่ลงรูปเลย","tham-mai mâi long rûup ləəy","Why don’t you post any photos?","你為什麼不釋出任何照片？"],"i":"V015","zh":"下去；登記／發文／簽名"},{"th":"ดีขึ้น","ro":"dii khʉ̂n","en":"better; improve","cat":"Practical Usage","note":"Adj + ขึ้น表示變得更……；ดีขึ้น是變好、改善、進步。","ex":["วันนี้รู้สึกดีขึ้นแล้ว","wan-níi rúu-sʉ̀k dii khʉ̂n lɛ́ɛw","I feel better today.","我今天感覺好多了。"],"i":"V016","zh":"變好／改善"},{"th":"ได้จาก","ro":"dâai jàak","en":"get from; obtain from","cat":"Practical Usage","note":"表示從某人、某處、某經驗得到資訊、知識、靈感。","ex":["เธอได้ข้อมูลนี้มาจากไหน","thəə dâai khɔ̂ɔ-muun níi maa jàak nǎi","Where did you get this information from?","你從哪裡得到這個資訊的？"],"i":"V017","zh":"從……得到"},{"th":"ผู้เริ่มต้น","ro":"phûu-rə̂əm-dtôn","en":"beginner","cat":"Practical Usage","note":"常見於課程、書籍、學習網站。","ex":["คอร์สนี้เหมาะสำหรับผู้เริ่มต้น","khɔ̂ɔt níi mɔ̀ sǎm-ràp phûu-rə̂əm-dtôn","This course is suitable for beginners.","這門課程適合初學者。"],"i":"V018","zh":"初學者"},{"th":"ขี้-","ro":"khîi-","en":"tend to; prone to","cat":"Local usage","note":"像中文「愛…… / 很容易…… / 動不動就……」。","ex":["ฉันขี้ลืมมากเลย","chǎn khîi-lʉʉm mâak ləəy","I’m really forgetful.","我真的很健忘。"],"i":"V019","zh":"愛……／容易……／有……傾向"},{"th":"อาย","ro":"aai","en":"embarrassed; shy","cat":"Emotional usage","note":"表示當下害羞、尷尬、不好意思。和ขี้อาย不同。","ex":["ฉันอายที่พูดผิด","chǎn aai thîi phûut phìt","I’m embarrassed that I spoke incorrectly.","我很尷尬，因為我說錯了。"],"i":"V020","zh":"害羞／尷尬／不好意思"},{"th":"ไปด้วยกัน","ro":"bpai dûai gan","en":"go together","cat":"Local usage","note":"ไปด้วย是我也去；ไปด้วยกัน是我們一起去。","ex":["เราไป BTS ด้วยกันไหม","rao bpai BTS dûai gan mái","Shall we take the BTS together?","我們一起帶BTS好嗎？"],"i":"V021","zh":"一起去"},{"th":"การ","ro":"gaan","en":"the act of; -ing","cat":"Textbook-based","note":"把動作變成名詞，像「……這件事 / ……的過程」。","ex":["การเรียนภาษาไทยไม่ง่าย","gaan-riian phaa-sǎa thai mâi ngâai","Studying thai is not easy.","學習泰文並不容易。"],"i":"V022","zh":"把動作變成名詞的前綴"},{"th":"ความ","ro":"khwaam","en":"abstract noun marker","cat":"Textbook-based","note":"把狀態、感覺、性質變成抽象名詞。","ex":["ความรู้สำคัญกว่าคะแนน","khwaam-rúu sǎm-khan gwàa khà-nɛɛn","Knowledge is more important than scores.","知識比分數更重要。"],"i":"V023","zh":"把狀態或性質變成抽象名詞的前綴"}],"compare":[{"title":"1. การ vs ความ vs กัน｜三個 gaan / khwaam / gan 不要混","rows":[{"term":["การ","gaan","the act of; -ing","把動作變成名詞的前綴"],"meaning":"把動作變名詞：……這件事","ex":["การเรียนภาษาไทยไม่ง่าย","gaan-riian phaa-sǎa thai mâi ngâai","Studying Thai is not easy.","學習泰文並不容易。"]},{"term":["ความ","khwaam","abstract noun marker","把狀態或性質變成抽象名詞的前綴"],"meaning":"把狀態、性質變抽象名詞","ex":["ความมั่นใจของเธอดีขึ้นมาก","khwaam-mân-jai khɔ̌ɔng thəə dii khʉ̂n mâak","Your confidence has improved a lot.","你變得有自信多了。"]},{"term":["กัน","gan","together; each other","一起、互相"],"meaning":"一起、互相","ex":["เราไปด้วยกันไหม","rao bpai dûai gan mái","Shall we go together?","我們一起去好嗎？"]}]},{"title":"2. ไป Pattern Family｜V ไป V ไป vs V ไป V มา","rows":[{"term":["V + ไป + V + ไป","V bpai V bpai","keep doing / do while doing","邊……邊……；做著做著；一直……下去"],"meaning":"邊……邊……；做著做著；一直……下去","ex":["คิดไปคิดไปก็เครียด","khít bpai khít bpai gɔ̂ɔ khrîiat","The more I thought about it, the more stressed I became.","越想越有壓力。"]},{"term":["V + ไป + V + มา","V bpai V maa","after doing for a while","想來想去、聊著聊著、看來看去"],"meaning":"想來想去、聊著聊著、看來看去","ex":["คุยไปคุยมาก็เป็นเพื่อนกัน","khui bpai khui maa gɔ̂ɔ bpen phʉ̂an gan","We talked and talked and eventually became friends.","我們聊了又聊，最後成為了朋友。"]}]},{"title":"3. อาย vs ขี้อาย vs เขิน｜當下害羞、個性害羞、曖昧害羞","rows":[{"term":["อาย","aai","embarrassed; shy","害羞／尷尬／不好意思"],"meaning":"當下尷尬、不好意思","ex":["ฉันอายที่พูดผิด","chǎn aai thîi phûut phìt","I’m embarrassed that I spoke incorrectly.","我很尷尬，因為我說錯了。"]},{"term":["ขี้อาย","khîi-aai","shy","個性容易害羞"],"meaning":"個性容易害羞","ex":["ฉันเป็นคนขี้อาย","chǎn bpen khon khîi-aai","I’m a shy person.","我是個害羞的人。"]},{"term":["เขิน","khə̌ən","bashful; flustered","被稱讚、曖昧、心動的害羞"],"meaning":"被稱讚、曖昧、心動的害羞","ex":["เขาชมฉัน ฉันเขินมาก","khǎo chom chǎn, chǎn khə̌ən mâak","He complimented me and I got really bashful.","他誇了我，我整個超害羞。"]}]},{"title":"4. ต้องการ vs อยาก vs ต้อง｜想要、需要、必須","rows":[{"term":["อยาก","yàak","want","想"],"meaning":"想","ex":["ฉันอยากกินกาแฟ","chǎn yàak gin gaa-fɛɛ","I want to drink coffee.","我想喝咖啡。"]},{"term":["ต้องการ","dtɔ̂ng-gaan","want; need","需要／想要（較正式）"],"meaning":"需要、想要取得","ex":["ฉันต้องการเวลาหน่อย","chǎn dtɔ̂ng-gaan wee-laa nɔ̀i","I need some time.","我需要一些時間。"]},{"term":["ต้อง","dtɔ̂ng","must","必須"],"meaning":"必須","ex":["ฉันต้องทำงานให้เสร็จก่อน","chǎn dtɔ̂ng tham-ngaan hâi sèt gɔ̀ɔn","I must finish the work first.","我得先把工作做完。"]}]}],"mistakes":[{"title":"1. 把 ง่วง 和 เหนื่อย 混在一起","wrong":{"label":"Wrong","th":"ฉันเหนื่อย อยากนอน","ro":"chǎn nʉ̀ai, yàak nɔɔn","en":"I’m tired and want to sleep.","zh":"我累了，想睡覺。"},"better":{"label":"Better","th":"ฉันง่วง อยากนอน","ro":"chǎn ngûang, yàak nɔɔn","en":"I’m sleepy and want to sleep.","zh":"我困了，想睡覺。"},"why":"เหนื่อย是累；ง่วง是想睡。"},{"title":"2. 把 สะดวก 只理解成 convenient","wrong":{"label":"Too literal","th":"สะดวกคุยไหม","ro":"sà-dùak khui mái","en":"Is talking convenient?","zh":"你有空談談嗎？"},"better":{"label":"Natural meaning","th":"สะดวกคุยไหม","ro":"sà-dùak khui mái","en":"Are you available to talk?","zh":"你有空談談嗎？"},"why":"這裡是在問「現在方便 / 有空聊嗎」。"},{"title":"3. 把 ถูก 全部當便宜","wrong":{"label":"Wrong mindset","th":"ถูกถาม","ro":"thùuk thǎam","en":"cheap ask","zh":"被詢問"},"better":{"label":"Better","th":"ถูกถาม","ro":"thùuk thǎam","en":"be asked","zh":"被詢問"},"why":"ถูก + V是被動，不是便宜。"},{"title":"4. ฉันไปด้วยกัน 不如 ฉันไปด้วย 自然","wrong":{"label":"Less natural","th":"ฉันไปด้วยกัน","ro":"chǎn bpai dûai gan","en":"I go together.","zh":"我一起去。"},"better":{"label":"Better","th":"ฉันไปด้วย","ro":"chǎn bpai dûai","en":"I’ll go too.","zh":"我也要去。"},"why":"主詞是「我」時，通常用ไปด้วย；ไปด้วยกัน強調「我們一起去」。"},{"title":"5. 把 การ / ความ / กัน 混在一起","wrong":{"label":"Wrong","th":"กันเรียนภาษาไทยไม่ง่าย","ro":"gan-riian phaa-sǎa thai mâi ngâai","en":"Together studying Thai is not easy.","zh":"一起學習泰文並不容易。"},"better":{"label":"Better","th":"การเรียนภาษาไทยไม่ง่าย","ro":"gaan-riian phaa-sǎa thai mâi ngâai","en":"Studying Thai is not easy.","zh":"學習泰文並不容易。"},"why":"การ名詞化動作；กัน是一起。"}],"dialogues":[{"title":"Dialogue 1｜Thai Class：請老師舉例","turns":[{"speaker":"Student","side":"left","th":"คำนี้สำคัญไหมคะ","ro":"kham níi sǎm-khan mái khá","en":"Is this word important?","zh":"這個詞重要嗎？"},{"speaker":"Teacher","side":"right","th":"สำคัญมากค่ะ ใช้บ่อยมาก","ro":"sǎm-khan mâak khâ, chái bɔ̀i mâak","en":"Very important. It’s used very often.","zh":"非常重要。它經常被使用。"},{"speaker":"Student","side":"left","th":"ช่วยยกตัวอย่างหน่อยได้ไหมคะ","ro":"chûai yók dtua-yàang nɔ̀i dâai mái khá","en":"Could you give an example?","zh":"你能舉個例子嗎？"}]},{"title":"Dialogue 2｜Friends：可以一起去嗎","turns":[{"speaker":"A","side":"left","th":"พรุ่งนี้จะไปคาเฟ่ไหม","ro":"phrûng-níi jà bpai khaa-fɛɛ mái","en":"Are you going to a café tomorrow?","zh":"明天要不要去咖啡廳？"},{"speaker":"B","side":"right","th":"ไปสิ เธอจะไปด้วยไหม","ro":"bpai sì, thəə jà bpai dûai mái","en":"Yes. Do you want to come too?","zh":"是的。你也想來嗎？"},{"speaker":"A","side":"left","th":"ไปด้วยกันดีกว่า","ro":"bpai dûai gan dii gwàa","en":"Let’s go together.","zh":"我們一起去吧。"}]},{"title":"Dialogue 3｜Work：方便開會嗎","turns":[{"speaker":"A","side":"left","th":"คุณสะดวกประชุมตอนบ่ายสองไหมคะ","ro":"khun sà-dùak bprà-chum dtɔɔn bàai sɔ̌ɔng mái khá","en":"Are you available for a meeting at 2 PM?","zh":"你下午2點有空開會嗎？"},{"speaker":"B","side":"right","th":"สะดวกค่ะ แต่ฉันต้องการข้อมูลเพิ่มเติมก่อน","ro":"sà-dùak khâ, dtɛ̀ɛ chǎn dtɔ̂ng-gaan khɔ̂ɔ-muun phə̂əm-dtəəm gɔ̀ɔn","en":"I’m available, but I need more information first.","zh":"我有空，但我首先需要更多的資訊。"}]},{"title":"Dialogue 4｜Chat：你怎麼了","turns":[{"speaker":"A","side":"left","th":"วันนี้ดูเหนื่อย ๆ เป็นอะไรไหม","ro":"wan-níi duu nʉ̀ai-nʉ̀ai, bpen à-rai mái","en":"You look tired today. Are you okay?","zh":"你今天看起來很累。你還好嗎？"},{"speaker":"B","side":"right","th":"ไม่เป็นไร แค่ง่วงนิดหน่อย","ro":"mâi bpen-rai, khɛ̂ɛ ngûang nít nɔ̀i","en":"It’s okay. I’m just a little sleepy.","zh":"沒關係。我只是有點困。"},{"speaker":"A","side":"left","th":"พักก่อนก็ได้นะ เดี๋ยวค่อยต่อ","ro":"phák gɔ̀ɔn gɔ̂ɔ dâai ná, dǐaw khɔ̂i dtɔ̀ɔ","en":"You can rest first. We can continue later.","zh":"你可以先休息。我們可以晚點繼續。"}]}],"structures":[{"title":"Pattern 1｜แค่...เท่านั้น = 只是……而已","meaning":"","examples":[["ฉันแค่อยากช่วยเท่านั้น","chǎn khɛ̂ɛ yàak chûai thâo-nán","I only wanted to help.","我只是想幫忙。"],["นี่เป็นแค่ตัวอย่างเท่านั้น","nîi bpen khɛ̂ɛ dtua-yàang thâo-nán","This is only an example.","這只是一個例子。"]]},{"title":"Pattern 2｜A ก็เลย B = A，所以就 B","meaning":"","examples":[["ไม่รู้ก็เลยถาม","mâi rúu gɔ̂ɔ ləəy thǎam","I didn’t know, so I asked.","我不知道，所以我問了。"],["ตื่นสายก็เลยไม่ทัน","dtʉ̀ʉn sǎai gɔ̂ɔ ləəy mâi than","I woke up late, so I wasn’t in time.","我起晚了，所以我沒來得及。"]]},{"title":"Pattern 3｜นับว่า = 算是","meaning":"","examples":[["แบบนี้ก็นับว่าดีแล้ว","bɛ̀ɛp níi gɔ̂ɔ náp wâa dii lɛ́ɛw","This can already be considered good.","這已經可以被認為是好的了。"],["อันนี้ไม่นับนะ","an-níi mâi náp ná","This doesn’t count.","這不算數。"]]},{"title":"Pattern 4｜Adj + ขึ้น = 變得更……","meaning":"","examples":[["ภาษาไทยของเธอดีขึ้นมาก","phaa-sǎa thai khɔ̌ɔng thəə dii khʉ̂n mâak","Your Thai has improved a lot.","你的泰文進步了很多。"],["ตอนนี้อ่านง่ายขึ้นแล้ว","dtɔɔn-níi àan ngâai khʉ̂n lɛ́ɛw","Reading is easier now.","現在閱讀更容易了。"]]},{"title":"Pattern 5｜ได้...จาก... = 從……得到……","meaning":"","examples":[["ฉันได้ความรู้จากหนังสือเล่มนี้","chǎn dâai khwaam-rúu jàak nǎng-sʉ̌ʉ lêm níi","I got knowledge from this book.","我從這本書中得到了知識。"],["เธอได้คำนี้มาจากไหน","thəə dâai kham níi maa jàak nǎi","Where did you learn this word from?","你從哪裡學來的這個單詞？"]]},{"title":"Pattern 6｜ขี้ + Adj / Verb = 容易……的人","meaning":"","examples":[["ฉันขี้ลืมมากเลย","chǎn khîi-lʉʉm mâak ləəy","I’m really forgetful.","我真的很健忘。"],["ฉันขี้ง่วงตอนบ่าย","chǎn khîi-ngûang dtɔɔn bàai","I get sleepy easily in the afternoon.","我下午很容易犯困。"]]}],"sentenceBank":[{"scene":"Sleep / Brain｜ง่วง / สมองล้า / ดีขึ้น","sentences":[{"th":"เมื่อคืนฉันนอนดึก วันนี้ก็เลยง่วงมาก","ro":"mʉ̂a-khʉʉn chǎn nɔɔn dʉ̀k, wan-níi gɔ̂ɔ ləəy ngûang mâak","en":"I slept late last night, so I’m very sleepy today.","zh":"我昨晚睡得很晚，所以今天我很困。"},{"th":"วันนี้เรียนทั้งวันจนสมองล้า","ro":"wan-níi riian tháng wan jon sà-mɔ̌ɔng láa","en":"Today I studied all day until my brain got tired.","zh":"今天我學習了一整天，直到我的大腦疲憊不堪。"},{"th":"หลังจากพักก็ดีขึ้น","ro":"lǎng jàak phák gɔ̂ɔ dii khʉ̂n","en":"After resting, I got better.","zh":"休息後，我好多了。"}]},{"scene":"Convenient / Important｜สะดวก / สำคัญ","sentences":[{"th":"พรุ่งนี้สะดวกคุยไหม","ro":"phrûng-níi sà-dùak khui mái","en":"Are you available to talk tomorrow?","zh":"你明天有空談談嗎？"},{"th":"ตามสะดวกเลย ไม่ต้องรีบ","ro":"dtaam sà-dùak ləəy, mâi dtɔ̂ng rîip","en":"Whatever works for you. No need to hurry.","zh":"無論什麼適合你。不用著急。"},{"th":"เรื่องนี้สำคัญมาก อย่าลืมนะ","ro":"rʉ̂ang níi sǎm-khan mâak, yàa lʉʉm ná","en":"This matter is very important. Don’t forget.","zh":"這件事非常重要。別忘了。"}]},{"scene":"Count / Source｜นับ / ได้จาก","sentences":[{"th":"รอบซ้อมไม่นับ เริ่มจับเวลารอบจริงนะ","ro":"rɔ̂ɔp sɔ́ɔm mâi náp rə̂əm jàp wee-laa rɔ̂ɔp jing ná","en":"The practice round doesn’t count; start timing the real round now.","zh":"練習回合不算，現在開始正式計時。"},{"th":"ถ้านับรวมค่ารถก็แพงนะ","ro":"thâa náp ruam khâa-rót gɔ̂ɔ phɛɛng ná","en":"If transportation is included, it’s expensive.","zh":"如果包括交通，那就很貴了。"},{"th":"ข้อมูลนี้ได้มาจากเว็บไซต์ของมหาวิทยาลัย","ro":"khɔ̂ɔ-muun níi dâai maa jàak wép-sai khɔ̌ɔng má-hǎa-wít-thá-yaa-lai","en":"This information came from the university website.","zh":"這份資料來自大學網站。"}]},{"scene":"Chat / Feeling｜เป็นอะไร / อาย / ขี้อาย","sentences":[{"th":"วันนี้ดูเงียบกว่าปกติ มีอะไรอยากเล่าไหม","ro":"wan-níi duu ngîiap gwàa bpòk-gà-dtì mii à-rai yàak lâo mái","en":"You seem quieter than usual today. Is there anything you want to talk about?","zh":"你今天看起來比平常安靜，有什麼想說的嗎？"},{"th":"อายจัง พูดผิดอีกแล้ว","ro":"aai jang, phûut phìt ìik lɛ́ɛw","en":"So embarrassing, I made a mistake again.","zh":"太尷尬了，我又犯了一個錯誤。"},{"th":"ฉันขี้อาย เลยไม่กล้าพูดก่อน","ro":"chǎn khîi-aai ləəy mâi glâa phûut gɔ̀ɔn","en":"I’m shy, so I don’t dare speak first.","zh":"我很害羞，所以我不敢先說話。"}]},{"scene":"Social Media / University｜ลง","sentences":[{"th":"ต้องลงทะเบียนก่อนถึงจะเข้าได้","ro":"dtɔ̂ng long tha-biian gɔ̀ɔn thʉ̌ng jà khâo dâai","en":"You need to register first before you can enter.","zh":"您需要先註冊才能進入。"}, rts with simple sentences and suits new learners.","zh":"這一課從簡單句開始，很適合剛學的人。"},{"th":"คำนี้ใช้ตอนไหน ช่วยยกตัวอย่างในชีวิตจริงหน่อยค่ะ","ro":"kham níi chái dtɔɔn nǎi chûai yók dtua-yàang nai chii-wít jing nɔ̀i khâ","en":"When is this word used? Please give me a real-life example.","zh":"這個詞什麼時候用？請舉一個生活中的例子。"},{"th":"การออกเสียงของเธอดีขึ้นเยอะเลย","ro":"gaan ɔ̀ɔk-sǐiang khɔ̌ɔng thəə dii khʉ̂n yə́ ləəy","en":"Your pronunciation has improved a lot.","zh":"你的發音進步了很多。"}]},{"scene":"Work｜方便、重要、需要資料","sentences":[{"th":"คุณสะดวกประชุมบ่ายสองไหม","ro":"khun sà-dùak bprà-chum bàai sɔ̌ɔng mái","en":"Are you available for a meeting at 2 PM?","zh":"你下午2點有空開會嗎？"},{"th":"ฉันต้องการข้อมูลเพิ่มเติม","ro":"chǎn dtɔ̂ng-gaan khɔ̂ɔ-muun phə̂əm-dtəəm","en":"I need more information.","zh":"我需要更多資訊。"},{"th":"เรื่องนี้มีความสำคัญมาก","ro":"rʉ̂ang níi mii khwaam-sǎm-khan mâak","en":"This matter is very important.","zh":"這件事非常重要。"}]},{"scene":"Friends｜邊吃邊聊、想來想去","sentences":[{"th":"เรากินไปคุยไป สนุกดี","ro":"rao gin bpai khui bpai, sà-nùk dii","en":"We ate while chatting. It was fun.","zh":"我們一邊聊天一邊吃飯。很有趣。"},{"th":"คิดไปคิดมาก็ยังไม่รู้จะทำยังไง","ro":"khít bpai khít maa gɔ̂ɔ yang mâi rúu jà tham yang-ngai","en":"After thinking it over, I still don’t know what to do.","zh":"經過思考，我仍然不知道該怎麼辦。"},{"th":"ตอนแรกแค่ถามทาง สุดท้ายคุยกันยาวเลย","ro":"dtɔɔn rɛ̂ɛk khɛ̂ɛ thǎam thaang sùt-tháai khui gan yaao ləəy","en":"At first I only asked for directions, but we ended up talking for a long time.","zh":"一開始只是問路，結果聊了很久。"}]},{"scene":"Emotion｜只是、害羞、怎麼了","sentences":[{"th":"ฉันแค่ถามเท่านั้น ไม่ได้โกรธ","ro":"chǎn khɛ̂ɛ thǎam thâo-nán, mâi dâai gròot","en":"I was only asking. I wasn’t angry.","zh":"我只是問問而已。我沒有生氣。"},{"th":"เป็นไรอะ ทำหน้าเครียดจัง","ro":"bpen-rai à, tham nâa khrîiat jang","en":"What’s wrong? You look stressed.","zh":"怎麼了？ 你看起來壓力很大。"},{"th":"เขินนิดหน่อย แต่ไม่ได้โกรธ","ro":"khə̌ən nít nɔ̀i, dtɛ̀ɛ mâi dâai gròot","en":"I’m a little bashful, but I’m not angry.","zh":"我有點生氣，但我不生氣。"}]}],"practice":[{"title":"Vocabulary Recall｜填入 Thai","prompts":["1. sleepy / 想睡：________","2. convenient; available / 方便、有空：________","3. doesn’t count / 不算：________","4. only; just / 只是……而已：________","5. beginner / 初學者：________"],"answers":[["ง่วง","ngûang","sleepy","想睡／睏"],["สะดวก","sà-dùak","convenient; available","方便／有空／合適"],["ไม่นับ","mâi náp","doesn’t count","不算"],["แค่...เท่านั้น","khɛ̂ɛ...thâo-nán","only; just","只是……而已／只有……而已"],["ผู้เริ่มต้น","phûu-rə̂əm-dtôn","beginner","初學者"]]},{"title":"Choose the right word｜選詞","prompts":["1. Are you available to talk now?คุณ ______ คุยตอนนี้ไหม","2. This doesn’t count.อันนี้ ______ นะ","3. I was only asking.ฉัน ______ ถาม ______","4. Shall we go together?เราไป ______ ไหม"],"answers":[["คุณสะดวกคุยตอนนี้ไหม","khun sà-dùak khui dtɔɔn-níi mái","Are you available to talk now?","你現在有空說話嗎？"],["อันนี้ไม่นับนะ","an-níi mâi náp ná","This doesn’t count.","這不算數。"],["ฉันแค่ถามเท่านั้น","chǎn khɛ̂ɛ thǎam thâo-nán","I was only asking.","我只是問問而已。"],["เราไปด้วยกันไหม","rao bpai dûai gan mái","Shall we go together?","我們一起去好嗎？"]]},{"title":"Chinese → Thai｜翻成自然泰文","prompts":["1. 我不知道，所以就問了。","2. 今天又累又睏。","3. 這個課程適合初學者。","4. 邊吃邊聊。"],"answers":[["ไม่รู้ก็เลยถาม","mâi rúu gɔ̂ɔ ləəy thǎam","I didn’t know, so I asked.","我不知道，所以我問了。"],["วันนี้ทั้งเหนื่อยทั้งง่วง","wan-níi tháng nʉ̀ai tháng ngûang","Today I’m both tired and sleepy.","今天我既累又困。"],["คอร์สนี้เหมาะสำหรับผู้เริ่มต้น","khɔ̂ɔt níi mɔ̀ sǎm-ràp phûu-rə̂əm-dtôn","This course is suitable for beginners.","這門課程適合初學者。"],["กินไปคุยไป","gin bpai khui bpai","eat while chatting","邊吃邊聊天"]]}],"g":[{"id":"g-compare","title":"近義比較","tth":"คำใกล้เคียง","em":"⚖️","kind":"compare"},{"id":"g-structure","title":"句型結構","tth":"โครงสร้างประโยค","em":"🧩","kind":"structure"},{"id":"g-mistake","title":"常見錯誤","tth":"ข้อผิดพลาดที่พบบ่อย","em":"🚫","kind":"mistake"},{"id":"g-dialogue","title":"情境短對話","tth":"บทสนทนาสั้นๆ","em":"💬","kind":"dialogue"},{"id":"g-sentence","title":"例句庫","tth":"ประโยคตัวอย่าง","em":"📝","kind":"sentence","src":"sentenceBank"},{"id":"g-bangkok","title":"曼谷生活場景","tth":"ฉากชีวิตกรุงเทพ","em":"🏙️","kind":"sentence","src":"bangkok"},{"id":"g-practice","title":"自我測驗","tth":"แบบฝึกหัด","em":"✅","kind":"practice"}]}</script>
<script>

let ROM=true,LANG='zh',isMob=window.innerWidth<769,curPl=null,FILTER='all';
const PROGRESS_KEY='thai_notes_lrn_2026_06_02_v1';
const FAV_KEY='thai_notes_fav_2026_06_02_v1';
function loadProgress(){
 try{const raw=localStorage.getItem(PROGRESS_KEY);const p=raw?JSON.parse(raw):{};return p&&typeof p==='object'&&!Array.isArray(p)?p:{};}catch(e){return{};}
}
function saveProgress(){try{localStorage.setItem(PROGRESS_KEY,JSON.stringify(LRN));}catch(e){console.warn('無法儲存學習進度。',e);}}
function loadFav(){
 try{const raw=localStorage.getItem(FAV_KEY);const p=raw?JSON.parse(raw):{};return p&&typeof p==='object'&&!Array.isArray(p)?p:{};}catch(e){return{};}
}
function saveFav(){try{localStorage.setItem(FAV_KEY,JSON.stringify(FAV));}catch(e){console.warn('無法儲存收藏。',e);}}
let LRN=loadProgress();
let FAV=loadFav();
const D=JSON.parse(document.getElementById('jd').textContent);
const VOCAB=D.vocab,CMP=D.compare,MIS=D.mistakes,DLG=D.dialogues,STR=D.structures,SENB=D.sentenceBank,BKK=D.bangkok,PRC=D.practice,GRP=D.g;
const TITLE='Thai Daily Notes',SUBTITLE='ง่าย・สมองล้า・ตัวอย่าง';

function speak(t){
 if(!window.speechSynthesis||!t)return;
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);
 u.lang='th-TH';u.rate=0.88;u.pitch=1;
 window.speechSynthesis.speak(u);
}
function playBtn(el,t){
 if(curPl)curPl.classList.remove('pl');
 curPl=el;el.classList.add('pl');speak(t);

let SEARCH_INDEX=[];
function buildIndex(){
 const idx=[];
 VOCAB.forEach(v=>{
  idx.push({id:v.i,tag:'詞彙庫',th:v.th,ro:v.ro,en:v.en,zh:v.zh||'',
   blob:[v.th,v.ro,v.en,v.zh||'',v.note||'',...(v.ex||[])].join(' ')});
 });
 CMP.forEach((c,i)=>{
  if(c.rows&&c.rows.length){
   c.rows.forEach(row=>{
    const termTh=(row.term&&row.term[0])?row.term[0]:row.ex[0];
    const termRo=(row.term&&row.term[1])?row.term[1]:row.ex[1];
    const termEn=(row.term&&row.term[2])?row.term[2]:'';
    const termZh=(row.term&&row.term[3])?row.term[3]:(row.meaning||'');
    idx.push({id:'CMP-'+i,tag:'近義比較・'+c.title,th:termTh,ro:termRo,en:termEn+'　'+(row.ex[2]||''),zh:termZh+'　'+(row.ex[3]||''),
     blob:[c.title,c.intro||'',(row.term||[]).join(' '),row.meaning||'',row.ex.join(' ')].join(' ')});
   });
  } else {
   idx.push({id:'CMP-'+i,tag:'近義比較',th:c.title,ro:'',zh:c.tip||c.intro||'',blob:c.title+' '+(c.tip||'')+' '+(c.intro||'')});
  }
 });
 MIS.forEach((m,i)=>{
  const w=m.wrong||{},b=m.better||{};
  idx.push({id:'MIS-'+i,tag:'常見錯誤',th:(w.th||'')+' → '+(b.th||''),ro:b.ro||'',en:b.en||'',zh:(b.zh||'')+'　'+m.title+'：'+(m.why||''),
   blob:[m.title,w.th||'',w.ro||'',w.en||'',w.zh||'',b.th||'',b.ro||'',b.en||'',b.zh||'',m.why||''].join(' ')});
 });
 STR.forEach((st,i)=>{
  const examples=(st.examples&&st.examples.length)?st.examples:(st.ex?[st.ex]:[]);
  const first=examples[0]||['','',''];
  idx.push({id:'STR-'+i,tag:'句型結構',th:first[0]||st.title,ro:first[1]||'',en:first[2]||'',zh:(first[3]||'')+'　'+st.title+'　'+(st.meaning||''),
   blob:[st.title,st.meaning||'',examples.map(e=>e.join(' ')).join(' ')].join(' ')});
 });
 DLG.forEach((d,i)=>{
  d.turns.forEach(t=>{
   idx.push({id:'DLG-'+i,tag:'情境對話・'+d.title,th:t.th,ro:t.ro,en:t.en,zh:t.zh||'',
    blob:[d.title,t.speaker,t.th,t.ro,t.en,t.zh||''].join(' ')});
  });
 });
 SENB.forEach((g,gi)=>{
  g.sentences.forEach(s=>{
   idx.push({id:'SB-'+gi,tag:'例句庫・'+g.scene,th:s.th,ro:s.ro,en:s.en,zh:s.zh||'',blob:[g.scene,s.th,s.ro,s.en,s.zh||''].join(' ')});
  });
 });
 BKK.forEach((g,gi)=>{
  g.sentences.forEach(s=>{
   idx.push({id:'BK-'+gi,tag:'曼谷場景・'+g.scene,th:s.th,ro:s.ro,en:s.en,zh:s.zh||'',blob:[g.scene,s.th,s.ro,s.en,s.zh||''].join(' ')});
  });
 });
 PRC.forEach((p,i)=>{
  const prompts=(p.prompts&&p.prompts.length)?p.prompts:(p.prompt?[p.prompt]:[]);
  const answers=(p.answers&&p.answers.length)?p.answers:(p.ans?[p.ans]:[]);
  idx.push({id:'PRC-'+i,tag:'自我測驗',th:prompts.join(' / ')||p.title||'',ro:'',zh:answers.map(a=>a.join(' ')).join(' / '),
   blob:[p.title||'',prompts.join(' '),answers.map(a=>a.join(' ')).join(' ')].join(' ')});
 });
 SEARCH_INDEX=idx;
}
function doSearch(qstr){
 const q=(qstr||'').trim().toLowerCase();
 const nv=document.getElementById('normalView'),sv=document.getElementById('searchView'),clearBtn=document.getElementById('searchClear');
 if(clearBtn)clearBtn.classList.toggle('show',q.length>0);
 if(!q){nv.classList.remove('hid-view');sv.classList.add('hid-view');sv.innerHTML='';return;}
 nv.classList.add('hid-view');sv.classList.remove('hid-view');
 const matches=SEARCH_INDEX.filter(it=>it.blob.toLowerCase().includes(q));
 const seen=new Set(),uniq=[];
 for(const m of matches){const key=m.id+'|'+m.th;if(seen.has(key))continue;seen.add(key);uniq.push(m);if(uniq.length>=60)break;}
 if(!uniq.length){sv.innerHTML=`<div class="sres-hd">沒有找到符合的內容，換個關鍵字試試。</div>`;return;}
 sv.innerHTML=`<div class="sres-hd">找到 ${uniq.length} 筆符合的內容</div><div class="sres-list">${uniq.map(m=>
  `<div class="sres-item" onclick="jumpTo('${m.id}')"><span class="sres-tag">${m.tag}</span><div class="sres-b"><div class="sres-th">${m.th}</div>${m.ro?ro('sres-ro',m.ro):''}${enzh('sres-en','sres-zh',m.en,m.zh)}</div>${ab(m.th)}</div>`
 ).join('')}</div>`;
}
function clearSearch(){
 const input=document.getElementById('searchInput');
 if(input)input.value='';
 doSearch('');
}
function jumpTo(id){
 clearSearch();
 setTimeout(()=>{
  const el=document.getElementById(id);
  if(!el)return;
  if(id[0]==='V')el.classList.add('exp');
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.classList.add('flash');
  setTimeout(()=>el.classList.remove('flash'),1500);
  const parentSec=el.closest('.sec-blk')||el.closest('.apx');
  setAct(parentSec?parentSec.id:id);
  if(isMob)document.getElementById('sb').classList.remove('mob-open');
 },60);
}

rSB();rCnt();refreshProgress();applyFilter();initSpy();buildIndex();
window.addEventListener('resize',syncViewportMode);
window.addEventListener('storage',e=>{
 if(e.key===PROGRESS_KEY)syncProgressFromStorage();
 if(e.key===FAV_KEY){FAV=loadFav();rCnt();initSpy();}
});
