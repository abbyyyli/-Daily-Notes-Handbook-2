*{margin:0;padding:0;box-sizing:border-box;}

.top-r{display:flex;gap:6px;}.cbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 11px;border-radius:6px;cursor:pointer;font-size:12px;font-family:var(--fu);transition:all .15s;white-space:nowrap;}.cbtn:hover{background:rgba(255,255,255,.22);}.cbtn.on{background:var(--acc);border-color:var(--acc);}.cbtn:focus-visible,.lbtn:focus-visible,.sb-btn:focus-visible,.filter-btn:focus-visible,.abtn:focus-visible,.xbtn:focus-visible,.burg:focus-visible{outline:2px solid #fff;outline-offset:2px;}
.lay{display:flex;margin-top:52px;height:calc(100vh - 52px);}
.sb{width:258px;flex-shrink:0;background:var(--sb);overflow-y:auto;overflow-x:hidden;transition:width .22s;scrollbar-width:thin;scrollbar-color:var(--sba) var(--sb);}
.sb.col{width:0;}.sb-book{padding:18px 16px 12px;border-bottom:1px solid rgba(255,255,255,.07);}
.sb-th{font-family:var(--ft);font-size:26px;font-weight:700;color:var(--sbti);}.sb-zh{font-family:var(--fz);font-size:10px;color:var(--sbt);margin-top:3px;opacity:.75;}.sb-ct{font-size:10px;color:var(--acc);font-weight:700;margin-top:8px;}.sb-track{height:4px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin-top:7px;}.sb-track-fill{height:100%;width:0;background:var(--acc);border-radius:inherit;transition:width .25s ease;}.sb-actions,.sb-filter{display:flex;gap:6px;margin-top:9px;}.sb-btn,.filter-btn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--sbt);font-family:var(--fz);font-size:10px;line-height:1;padding:6px 8px;border-radius:6px;cursor:pointer;transition:all .15s;}.sb-btn:hover,.filter-btn:hover,.filter-btn.on{background:var(--sba);border-color:rgba(255,255,255,.32);color:var(--sbti);}.sb-btn{color:rgba(255,255,255,.65);}.sb-save-note{font-family:var(--fz);font-size:9px;line-height:1.45;color:rgba(181,212,192,.5);margin-top:8px;}.nit-b{min-width:34px;}
.nav-grp{padding:6px 0;}.nav-lbl{font-size:9px;font-weight:700;letter-spacing:1.5px;color:rgba(181,212,192,.4);padding:8px 16px 3px;text-transform:uppercase;}
.nit{display:flex;align-items:center;gap:9px;padding:8px 16px;cursor:pointer;color:var(--sbt);font-size:12.5px;transition:background .12s;border-left:3px solid transparent;user-select:none;}.nit:hover{background:var(--sbh);}.nit.act{background:var(--sba);border-left-color:var(--acc);color:var(--sbti);}

.qcq{flex:1;min-width:0;}.qcth{font-family:var(--ft);font-size:20px;font-weight:500;color:var(--thai);line-height:1.4;}
.qcro{font-family:var(--ft);font-size:12.5px;color:var(--rom);font-style:italic;margin-top:2px;}.qczh{font-family:var(--fz);font-size:13px;color:var(--tm);margin-top:3px;}
.hid{display:none!important;}.qca{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.abtn{width:33px;height:33px;border-radius:50%;border:none;cursor:pointer;background:var(--gd);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;flex-shrink:0;}.abtn:hover{background:var(--gm);transform:scale(1.06);}.abtn.pl{background:var(--acc);animation:pulse 1s infinite;}
.xbtn{width:27px;height:27px;border-radius:50%;border:1px solid var(--bd);background:transparent;cursor:pointer;color:var(--mu);display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .2s;}.xbtn:hover{background:var(--bdl);}.qc.exp .xbtn{transform:rotate(180deg);}
.qcb{max-height:0;overflow:hidden;transition:max-height .32s ease;}.qc.exp .qcb{max-height:900px;}.qcbi{padding:0 15px 15px;}.div{height:1px;background:var(--bdl);margin:0 -15px 14px;}
.ans{display:flex;align-items:flex-start;gap:11px;padding:9px 11px;border-radius:8px;background:rgba(61,43,36,.045);margin-bottom:8px;}
.anl{flex-shrink:0;width:23px;height:23px;border-radius:50%;background:var(--gd);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:2px;}
.ant{flex:1;min-width:0;}.anth{font-family:var(--ft);font-size:18px;font-weight:500;color:var(--thai);line-height:1.4;}
.anro{font-family:var(--ft);font-size:11.5px;color:var(--rom);font-style:italic;margin-top:2px;}.anzh{font-family:var(--fz);font-size:12px;color:var(--mu);margin-top:3px;}
.subs{margin-top:11px;}.sub-lbl{font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px;}
.sub-chips{display:flex;flex-wrap:wrap;gap:5px;}.schip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:18px;cursor:pointer;background:transparent;border:1px solid var(--bd);transition:all .15s;}.schip:hover{background:var(--accl);border-color:var(--acc);}
.sch-th{font-family:var(--ft);color:var(--thai);font-size:14px;}.sch-zh{font-family:var(--fz);color:var(--mu);font-size:11px;}
.fu{margin-top:13px;padding:9px 11px;border-radius:8px;background:rgba(200,154,58,.08);border-left:3px solid var(--acc);}
.fu-lbl{font-size:9px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;}.fu-row{display:flex;align-items:flex-start;gap:9px;}.fu-tx{flex:1;}
.futh{font-family:var(--ft);font-size:17px;color:var(--thai);}.furo{font-family:var(--ft);font-size:11.5px;color:var(--rom);font-style:italic;margin-top:2px;}.fuzh{font-family:var(--fz);font-size:12px;color:var(--mu);margin-top:3px;}

.ng{background:rgba(192,138,62,.09);border:1px solid rgba(192,138,62,.22);}.ng-l{font-size:9px;font-weight:700;color:var(--gm);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}.ng-t{font-family:var(--ft);font-size:13.5px;color:#6b7280;line-height:1.65;}
.nc{background:rgba(52,82,220,.04);border:1px solid rgba(52,82,220,.1);}.nc-l{font-size:9px;font-weight:700;color:#4A5ADB;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}.nc-t{font-family:var(--fz);font-size:12.5px;color:var(--tm);line-height:1.7;}

.plist{display:flex;flex-direction:column;gap:7px;}.prow{display:flex;align-items:flex-start;gap:11px;padding:9px 13px;border-radius:8px;background:var(--bgc);border:1px solid var(--bdl);}

.ptx{flex:1;}.pth{font-family:var(--ft);font-size:17px;color:var(--thai);line-height:1.4;}.prom{font-family:var(--ft);font-size:11.5px;color:var(--rom);font-style:italic;margin-top:2px;}.pzh{font-family:var(--fz);font-size:12px;color:var(--mu);margin-top:3px;}

.vth{font-family:var(--ft);font-size:19px;color:var(--thai);font-weight:500;}.vro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:2px;}.vzh{font-family:var(--fz);font-size:11.5px;color:var(--mu);margin-top:3px;}

.fth{font-family:var(--ft);font-size:16px;color:var(--thai);font-weight:500;}.fro{font-family:var(--ft);font-size:10.5px;color:var(--rom);font-style:italic;margin-top:2px;}.fzh{font-family:var(--fz);font-size:11.5px;color:var(--mu);margin-top:3px;}

.pton{font-family:var(--ft);font-size:26px;color:var(--thai);font-weight:600;}.ptro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:2px;}.ptzh{font-family:var(--fz);font-size:12.5px;font-weight:600;color:var(--t);margin-top:4px;}.ptuse{font-family:var(--fz);font-size:10.5px;color:var(--mu);margin-top:2px;line-height:1.4;}

.par-th{font-family:var(--ft);font-size:21px;color:var(--acc);font-weight:700;}.par-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;}
.par-zh{font-family:var(--fz);font-size:13px;font-weight:600;color:var(--t);}.par-ex{font-family:var(--ft);font-size:13px;color:var(--mu);margin-top:2px;}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:7px;}

.sth{font-family:var(--ft);font-size:19px;color:var(--thai);font-weight:600;}.sro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:2px;}.szh{font-family:var(--fz);font-size:12.5px;color:var(--t);font-weight:500;margin-top:4px;}.sex{font-family:var(--fz);font-size:11px;color:var(--mu);margin-top:2px;}
.hlist{display:flex;flex-direction:column;gap:9px;}.hrow{display:flex;gap:11px;padding:11px 13px;background:var(--bgc);border:1px solid var(--bdl);border-radius:8px;}

.ch-th{font-family:var(--ft);font-size:17px;color:var(--thai);}.ch-zh{font-family:var(--fz);font-size:11px;color:var(--mu);margin-top:2px;}

/* ===== Extended handout styles v2 (vocab-driven, QA-50 architecture) ===== */
.favbtn{display:flex;align-items:center;gap:5px;padding:5px 13px;border-radius:18px;border:1px solid var(--bd);background:transparent;font-size:11px;color:var(--mu);cursor:pointer;font-family:var(--fz);transition:all .15s;margin-right:6px;}

.favbtn.on{background:var(--acc);border-color:var(--acc);color:#fff;}
.cft{justify-content:space-between!important;}

@keyframes flashHi{0%{box-shadow:0 0 0 5px rgba(200,154,58,.55);}100%{box-shadow:0 0 0 0 rgba(200,154,58,0);}}
.flash{animation:flashHi 1.4s ease;border-radius:10px;}
.empty-fav{padding:16px;text-align:center;color:var(--mu);font-family:var(--fz);font-size:12.5px;background:var(--bgc);border:1px dashed var(--bd);border-radius:10px;}

/* search */
.stop-wrap{position:relative;flex:1;max-width:340px;margin:0 10px;}
.sinput{width:100%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:7px 30px 7px 11px;font-size:12.5px;font-family:var(--fz);outline:none;}
.sinput::placeholder{color:rgba(255,255,255,.5);}
.sinput:focus{background:rgba(255,255,255,.18);}
.sclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:13px;display:none;}
.sclear.show{display:block;}
.sres-hd{font-family:var(--fz);font-size:13px;color:var(--mu);margin:0 0 12px;padding-bottom:10px;border-bottom:2px solid var(--bd);}
.sres-list{display:flex;flex-direction:column;gap:8px;}
.sres-item{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-radius:10px;background:var(--bgc);border:1px solid var(--bdl);cursor:pointer;transition:all .15s;}
.sres-item:hover{border-color:var(--gl);box-shadow:0 2px 8px rgba(0,0,0,.06);}
.sres-tag{flex-shrink:0;font-size:9.5px;font-weight:700;color:var(--acc);background:var(--accl);border:1px solid rgba(200,154,58,.3);padding:3px 8px;border-radius:20px;white-space:nowrap;margin-top:2px;}
.sres-b{flex:1;min-width:0;}
.sres-th{font-family:var(--ft);font-size:16px;color:var(--thai);}
.sres-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:1px;}
.sres-zh{font-family:var(--fz);font-size:12px;color:var(--mu);margin-top:2px;}
.hid-view{display:none!important;}

/* compare */
.cmp-card{background:var(--bgc);border:1px solid var(--bdl);border-radius:10px;padding:15px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.cmp-title{font-family:var(--fz);font-size:14.5px;font-weight:700;color:var(--t);margin:0 0 5px;line-height:1.55;}
.cmp-intro{font-family:var(--fz);font-size:12px;color:var(--mu);line-height:1.6;margin-bottom:4px;}
.cmp-list{display:block;}
.cmp-row{display:grid;grid-template-columns:minmax(125px,175px) minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--bdl);align-items:start;}
.cmp-list .cmp-row:first-child{border-top:none;}
.cmp-term{min-width:0;}
.cmp-pat{display:flex;align-items:flex-start;gap:5px;font-family:var(--ft);font-size:16px;line-height:1.4;color:var(--acc);font-weight:700;}
.cmp-pat .abtn{margin-top:0;}
.cmp-ex-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:2px;overflow-wrap:anywhere;}
.cmp-ex-en,.cmp-ex-zh{font-family:var(--fz);font-size:11.5px;color:var(--mu);margin-top:3px;line-height:1.5;}
.cmp-body{min-width:0;}
.cmp-mean{font-family:var(--fz);font-size:12.5px;color:var(--tm);line-height:1.65;}
.cmp-ex{margin-top:7px;padding:8px 10px;border-radius:8px;background:rgba(65,40,47,.045);}
.cmp-ex-line{display:flex;align-items:flex-start;gap:8px;}
.cmp-ex-tx{flex:1;min-width:0;}
.cmp-ex-th{font-family:var(--ft);font-size:15px;color:var(--thai);line-height:1.45;}
.cmp-tip{margin-top:10px;padding:9px 11px;border-radius:8px;background:var(--bgh);border:1px solid var(--bdl);font-family:var(--fz);font-size:12px;color:var(--tm);line-height:1.65;}
@media(max-width:640px){.cmp-row{grid-template-columns:1fr;gap:7px;padding:11px 0}.cmp-pat{font-size:16px}.cmp-ex{margin-top:6px}}

/* mistakes */
.mis-card{background:var(--bgc);border:1px solid var(--bdl);border-radius:10px;padding:15px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.mis-title{font-family:var(--fz);font-size:14.5px;font-weight:700;color:var(--t);margin-bottom:10px;}
.mis-box{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:8px;margin-bottom:8px;}
.mis-wrong{background:rgba(200,60,50,.07);border:1px solid rgba(200,60,50,.18);}
.mis-better{background:rgba(192,138,62,.1);border:1px solid rgba(192,138,62,.24);}
.mis-lbl{flex-shrink:0;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:3px 7px;border-radius:5px;margin-top:2px;}
.mis-wrong .mis-lbl{background:#c0392b;color:#fff;}
.mis-better .mis-lbl{background:var(--gl);color:#fff;}
.mis-tx{flex:1;}
.mis-th{font-family:var(--ft);font-size:15px;color:var(--thai);}
.mis-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:1px;}
.mis-en{font-family:var(--fz);font-size:11.5px;color:var(--mu);margin-top:2px;}
.mis-why{font-family:var(--fz);font-size:12.5px;color:var(--tm);line-height:1.65;padding:9px 11px;border-radius:8px;background:#f8f5f1;border:1px solid var(--bdl);}

/* structures */
.str-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
.str-card{background:var(--bgc);border:1px solid var(--bdl);border-left:4px solid var(--gl);border-radius:10px;padding:13px 14px;}
.str-title{font-family:var(--fz);font-size:13.5px;font-weight:700;color:var(--t);}
.str-mean{font-family:var(--fz);font-size:11.5px;color:var(--mu);margin-top:5px;line-height:1.55;}
.str-ex{margin-top:9px;padding:8px 10px;border-radius:8px;background:rgba(61,43,36,.045);}
.str-th{font-family:var(--ft);font-size:15px;color:var(--thai);}
.str-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:1px;}
.str-en{font-family:var(--fz);font-size:11px;color:var(--mu);margin-top:2px;}

/* dialogues */
.dlg-card{background:var(--bgc);border:1px solid var(--bdl);border-radius:10px;padding:15px;margin-bottom:12px;}
.dlg-title{font-family:var(--fz);font-size:14.5px;font-weight:700;color:var(--t);margin-bottom:11px;}
.dlg-thread{display:flex;flex-direction:column;gap:9px;}
.dlg-row{display:flex;width:100%;}
.dlg-row.l{justify-content:flex-start;}.dlg-row.r{justify-content:flex-end;}
.dlg-bub{max-width:76%;border:1px solid var(--bdl);border-radius:14px;padding:9px 12px;background:#fff;}
.dlg-row.l .dlg-bub{border-top-left-radius:4px;background:#f6faf7;}
.dlg-row.r .dlg-bub{border-top-right-radius:4px;background:#fbf8f0;}
.dlg-spk{font-size:10px;font-weight:700;color:var(--acc);margin-bottom:4px;}
.dlg-th{font-family:var(--ft);font-size:15px;color:var(--thai);}
.dlg-ro{font-family:var(--ft);font-size:11px;color:var(--rom);font-style:italic;margin-top:1px;}
.dlg-en{font-family:var(--fz);font-size:11.5px;color:var(--mu);margin-top:2px;}

/* sentence groups */
.sen-group{margin-bottom:16px;}
.sen-scene{display:inline-flex;font-size:11px;font-weight:700;color:#fff;background:var(--gm);padding:4px 11px;border-radius:20px;margin-bottom:9px;}
.sen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;}
.sen-item{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:8px;background:var(--bgc);border:1px solid var(--bdl);}
.sen-th{font-family:var(--ft);font-size:14.5px;color:var(--thai);}
.sen-ro{font-family:var(--ft);font-size:10.5px;color:var(--rom);font-style:italic;margin-top:1px;}
.sen-en{font-family:var(--fu);font-size:11px;color:#6b7280;margin-top:2px;}
.qcen,.anen,.sres-en,.mis-en,.str-en,.dlg-en,.cmp-ex-en{font-family:var(--fu);color:#6b7280;}
.qczh,.anzh,.sres-zh,.mis-zh,.str-zh,.dlg-zh,.sen-zh,.cmp-ex-zh{font-family:var(--fz);color:var(--tm);margin-top:3px;line-height:1.55;}
.qcen{font-size:12px;margin-top:3px}.qczh{font-size:13px}.anen,.anzh,.mis-zh,.str-zh,.dlg-zh,.sen-zh,.sres-en,.sres-zh{font-size:11.5px}

/* practice */
.prc-card{background:var(--bgc);border:1px solid var(--bdl);border-radius:10px;padding:13px 14px;margin-bottom:9px;}
.prc-title{font-size:10px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.6px;}
.prc-prompt{font-family:var(--fz);font-size:13.5px;color:var(--t);margin-top:5px;line-height:1.6;}
.prc-ans-wrap{margin-top:9px;}
.prc-ans-btn{font-family:var(--fz);font-size:11.5px;color:var(--gm);background:none;border:1px solid var(--bd);border-radius:16px;padding:5px 12px;cursor:pointer;}
.prc-ans-btn:hover{border-color:var(--gl);}
.prc-ans{display:none;margin-top:9px;padding:9px 11px;border-radius:8px;background:rgba(192,138,62,.09);border:1px solid rgba(192,138,62,.22);}
.prc-ans.show{display:block;}
.prc-ans .str-th{font-size:14.5px;}

@media(max-width:920px){
 .stop-wrap{display:none;}
 .cmp-row{grid-template-columns:1fr;}
 .str-grid,.sen-grid{grid-template-columns:1fr;}
}

<script type="application/json" id="jd">{"title":"Thai Daily Notes","subtitle":"2026-05-25","vocab":[{"th":"ตลอดชีวิต","ro":"dtà-lɔ̀ɔt chii-wít","en":"throughout one’s life; for one’s whole life","cat":"Practical Usage","note":"語氣有重量，常用於人生經驗、承諾、深刻記憶。日常也常用ทั้งชีวิต/tháng chii-wít/one’s whole life。","ex":["ฉันจะไม่ลืมเรื่องนี้ตลอดชีวิต","chǎn jà mâi lʉʉm rʉ̂ang níi dtà-lɔ̀ɔt chii-wít","I will never forget this for the rest of my life.","我這輩子都不會忘記這件事。"],"i":"V001","zh":"一輩子／一生之中"},{"th":"โดย","ro":"dooi","en":"by; via; by means of","cat":"Textbook-based","note":"正式、書面、被動句、交通方式說明常用。日常交通更自然說นั่งเครื่องบินมา/nâng khrʉ̂ang-bin maa/came by plane。","ex":["หนังสือเล่มนี้เขียนโดยนักเขียนไทย","nǎng-sʉ̌ʉ lêm níi khǐian dooi nák-khǐian Thai","This book was written by a Thai writer.","這本書是由泰國作家寫的。"],"i":"V002","zh":"由／藉由／以……方式（較正式）"},{"th":"ผ่าน","ro":"phàan","en":"through; via","cat":"Local usage","note":"平台、朋友、管道最自然的「透過」。比โดย更口語生活。","ex":["เราคุยกันผ่านไลน์ได้ค่ะ","rao khui gan phàan LINE dâai khâ","We can talk via LINE.","我們可以透過 LINE 聊。"],"i":"V003","zh":"經過／透過／經歷／通過"},{"th":"ต่าง","ro":"dtàang","en":"different; separate; various","cat":"Practical Usage","note":"日常常用ต่างกัน/dtàang gan/different from each other。固定詞ต่างประเทศ是「國外」。","ex":["สองคำนี้ต่างกันยังไงคะ","sɔ̌ɔng kham níi dtàang gan yang-ngai khá","How are these two words different?","這兩個詞有什麼不同？"],"i":"V004","zh":"不同／各自／各種"},{"th":"เดี๋ยวก่อน","ro":"dǐaw gɔ̀ɔn","en":"hold on; wait a moment","cat":"Local usage","note":"叫對方或自己「先等一下、先不要急」。不是「晚點再做」。","ex":["เดี๋ยวก่อนนะคะ ขอคิดแป๊บนึง","dǐaw gɔ̀ɔn ná khá, khɔ̌ɔ khít bpɛ́ɛp nʉng","One moment, please. Let me think for a second.","請等一下，讓我想一下。"],"i":"V005","zh":"等一下／先等等"},{"th":"เดี๋ยวค่อย...","ro":"dǐaw khɔ̂i...","en":"later then...; do ... later","cat":"Local usage","note":"某件事晚點再做。聊天中เดี๋ยวค่อยคุย可能偏冷，加กันนะ比較柔和。","ex":["เดี๋ยวว่างแล้วค่อยคุยกันนะ","dǐaw wâang lɛ́ɛw khɔ̂i khui gan ná","When I’m free, let’s talk later, okay?","等我有空，我們再聊喔。"],"i":"V006","zh":"待會兒再……"},{"th":"เพิ่ง","ro":"phə̂ng","en":"just; just recently","cat":"Practical Usage","note":"放在動詞前，表示剛剛才、最近才。固定搭配อย่าเพิ่ง/yàa phə̂ng/don’t ... yet。","ex":["เพิ่งเห็นข้อความค่ะ","phə̂ng hěn khɔ̂ɔ-khwaam khâ","I just saw the message.","我剛剛才看到訊息。"],"i":"V007","zh":"才剛／剛剛"},{"th":"ตอนที่","ro":"dtɔɔn thîi","en":"when; at the time that","cat":"Local usage","note":"日常最安全的「當……的時候」，適合具體事件、回憶、背景時間。","ex":["ตอนที่ฉันอยู่กรุงเทพฯ ฉันชอบไปคาเฟ่","dtɔɔn thîi chǎn yùu grung-thêep, chǎn chɔ̂ɔp bpai kaa-fɛɛ","When I was in Bangkok, I liked going to cafés.","我在曼谷的時候，很喜歡去咖啡廳。"],"i":"V008","zh":"當……的時候"},{"th":"พอ...ก็...","ro":"phɔɔ...gɔ̂ɔ...","en":"once..., then...; as soon as...","cat":"Local usage","note":"強調 A 發生後 B 接著發生。不是單純背景時間，而是事件觸發。","ex":["พอถึงบ้านก็หลับเลย","phɔɔ thʉ̌ng bâan gɔ̂ɔ làp ləəy","Once I got home, I fell asleep right away.","一到家就直接睡著了。"],"i":"V009","zh":"一……就……"},{"th":"ตาม","ro":"dtaam","en":"follow; according to; along","cat":"Practical Usage","note":"核心是「跟著某個人、路線、規則、計畫走」。","ex":["ไปก่อนเลย เดี๋ยวตามไป","bpai gɔ̀ɔn ləəy, dǐaw dtaam bpai","Go ahead first. I’ll follow later.","你先去，我待會兒跟上。"],"i":"V010","zh":"跟著／依照／沿著"},{"th":"เกรงใจ","ro":"greeng-jai","en":"feel bad to impose; be considerate","cat":"Local usage","note":"泰國文化核心詞：不好意思麻煩、怕造成別人負擔。不是單純shy。","ex":["ฉันเกรงใจคุณมากค่ะ","chǎn greeng-jai khun mâak khâ","I feel really bad about troubling you.","這樣麻煩你，我真的很不好意思。"],"i":"V011","zh":"怕麻煩別人／覺得不好意思"},{"th":"ถูกใจ","ro":"thùuk-jai","en":"be to one’s taste; be pleased with","cat":"Local usage","note":"比ชอบ/chɔ̂ɔp/like更有「打中喜好、很中意」的感覺。","ex":["อันนี้ถูกใจฉันมาก","an níi thùuk-jai chǎn mâak","This one is really to my taste.","這個真的很合我心意。"],"i":"V012","zh":"合心意／很中意"},{"th":"ต่อ","ro":"dtɔ̀ɔ","en":"continue; connect; transfer; per","cat":"Practical Usage","note":"核心是「接續、連接」。可表示繼續、轉車、排隊、殺價、每單位。","ex":["วันนี้พอแค่นี้ก่อน พรุ่งนี้ค่อยต่อ","wan-níi phɔɔ khɛ̂ɛ níi gɔ̀ɔn, phrûng-níi khɔ̂i dtɔ̀ɔ","That’s enough for today. We’ll continue tomorrow.","今天先到這裡，明天再繼續。"],"i":"V013","zh":"繼續／接著／連接"},{"th":"แบบ","ro":"bɛ̀ɛp","en":"type; style; model; pattern; like","cat":"Local usage","note":"樣子、類型、款式、方式；口語中也像 English “like / kind of”。","ex":["ช่วยอธิบายแบบง่าย ๆ ได้ไหมคะ","chûai à-thí-baai bɛ̀ɛp ngâai-ngâai dâai mái khá","Can you explain it in a simple way?","可以用簡單一點的方式說明嗎？"],"i":"V014","zh":"樣式／類型／方式／像……那樣"},{"th":"บาง","ro":"baang","en":"some; certain; partial","cat":"Practical Usage","note":"放在名詞前，表示「某些、有些」。注意跟บ้าง/bâang/some; a bit不同。","ex":["บางอย่างอธิบายยาก","baang yàang à-thí-baai yâak","Some things are hard to explain.","有些事情很難解釋。"],"i":"V015","zh":"某些／一部分"},{"th":"บ้าง","ro":"bâang","en":"some; a bit; among others","cat":"Common mistake","note":"常放句尾或動詞後，表示一些、多少、有哪些。聲調是 falling tone。","ex":["พูดไทยได้บ้างค่ะ","phûut Thai dâai bâang khâ","I can speak some Thai.","我會說一點泰文。"],"i":"V016","zh":"一些／一點；列舉部分情況"},{"th":"ตรงกลาง","ro":"dtrong-glaang","en":"in the middle; at the center","cat":"Practical Usage","note":"具體位置的正中間。若是 A 和 B 之間，用ระหว่าง/rá-wàang/between。","ex":["วางไว้ตรงกลางโต๊ะได้เลยค่ะ","waang wái dtrong-glaang dtó dâai ləəy khâ","You can put it in the middle of the table.","直接放在桌子正中間就可以。"],"i":"V017","zh":"正中間／中央"},{"th":"งั้น","ro":"ngán","en":"then; in that case","cat":"Local usage","note":"最口語的「那……、那就……」。比ถ้าอย่างนั้น短很多。","ex":["งั้นพักก่อนนะ ไว้ค่อยคุยกัน","ngán phák gɔ̀ɔn ná, wái khɔ̂i khui gan","Then rest first. We can talk later.","然後先休息。我們可以晚點再談。"],"i":"V018","zh":"那／那就／既然這樣"},{"th":"เยอะ","ro":"yə́","en":"a lot; many; much","cat":"Local usage","note":"口語高頻「很多」。偏數量多，不是所有「很」都能用。คิดเยอะ是「想太多」。","ex":["วันนี้คนเยอะมาก","wan-níi khon yə́ mâak","There are so many people today.","今天有這麼多人。"],"i":"V019","zh":"很多"},{"th":"ก็แล้วกัน","ro":"gɔ̂ɔ lɛ́ɛw gan","en":"then; let’s settle on that; I guess... then","cat":"Local usage","note":"做決定、選東西、收尾、妥協時用。語氣可能自然，也可能有「算了」感。","ex":["งั้นเอาอันนี้ก็แล้วกันค่ะ","ngán ao an níi gɔ̂ɔ lɛ́ɛw gan khâ","Then I’ll take this one.","那我就拿這個。"],"i":"V020","zh":"那就這樣吧／就決定這個吧"}],"compare":[{"title":"1. โดย / ผ่าน / ทาง / ด้วย / ใช้ / จาก｜by / through / via 怎麼自然說？","rows":[{"term":["โดย","dooi","by; via","由／藉由／以……方式（較正式）"],"meaning":"書面、正式、課本清楚","ex":["หนังสือเล่มนี้เขียนโดยนักเขียนไทย","nǎng-sʉ̌ʉ lêm níi khǐian dooi nák-khǐian Thai","This book was written by a Thai writer.","這本書是由泰國作家寫的。"]},{"term":["ผ่าน","phàan","through; via","經過／透過／經歷／通過"],"meaning":"生活中最自然的「透過」","ex":["เราเจอกันผ่านเพื่อนค่ะ","rao jəə gan phàan phʉ̂an khâ","We met through a friend.","我們是透過朋友認識的。"]},{"term":["ทาง","thaang","via; by way of","客服、文件、商務管道"],"meaning":"客服、文件、商務管道","ex":["ส่งเอกสารทางอีเมลได้ไหมคะ","sòng èek-gà-sǎan thaang ii-meeo dâai mái khá","Can I send the documents by email?","可以用電子郵件寄文件嗎？"]},{"term":["ด้วย","dûai","with; by means of","也／一起／麻煩也……"],"meaning":"用某工具完成","ex":["จ่ายด้วยบัตรเครดิตได้ไหมคะ","jàai dûai bàt khree-dìt dâai mái khá","Can I pay with a credit card?","可以用信用卡付款嗎？"]},{"term":["ใช้","chái","use","用／使用"],"meaning":"強調「使用」","ex":["ฉันใช้ ChatGPT เรียนภาษาไทย","chǎn chái ChatGPT riian phaa-sǎa Thai","I use ChatGPT to learn Thai.","我用 ChatGPT 學泰文。"]},{"term":["จาก","jàak","from","來源、起點"],"meaning":"來源、起點","ex":["ฉันรู้เรื่องนี้จากเพื่อน","chǎn rúu rʉ̂ang níi jàak phʉ̂an","I heard about this from a friend.","我是從朋友那裡聽說這件事的。"]}],"tip":"核心差異： 中文「透過」和英文 by / through / via 不要全部翻成 โดย / dooi / by 。泰文會依「交通、平台、工具、來源、正式管道」換字。"},{"title":"2. เมื่อ / ตอนที่ / เวลา / สมัยที่ / พอ｜五種 when","rows":[{"term":["เมื่อ","mʉ̂a","when; at the time when","正式、書面、公告、故事旁白"],"meaning":"正式、書面、公告、故事旁白","ex":["เมื่อได้รับเอกสารแล้ว กรุณาติดต่อเจ้าหน้าที่","mʉ̂a dâai-ráp èek-gà-sǎan lɛ́ɛw, gà-rú-naa dtìt-dtɔ̀ɔ jâo-nâa-thîi","When you have received the documents, please contact the staff.","收到文件後，請聯絡工作人員。"]},{"term":["ตอนที่","dtɔɔn thîi","when; at the time that","當……的時候"],"meaning":"日常最安全的「當……的時候」","ex":["ตอนที่มาถึงแล้ว บอกฉันหน่อยนะ","dtɔɔn thîi maa thʉ̌ng lɛ́ɛw, bɔ̀ɔk chǎn nɔ̀i ná","When you arrive, tell me, okay?","到了跟我說喔。"]},{"term":["เวลา","wee-laa","when; whenever","每當、一般情況、習慣"],"meaning":"每當、一般情況、習慣","ex":["เวลาคนไทยพูดเร็ว ฉันฟังไม่ทัน","wee-laa khon Thai phûut rew, chǎn fang mâi than","When Thai people speak fast, I can’t keep up.","泰國人說話很快時，我會聽不及。"]},{"term":["สมัยที่","sà-mǎi thîi","back when; in the period when","以前某個時期、學生時代、小時候"],"meaning":"以前某個時期、學生時代、小時候","ex":["สมัยที่เรียนมหาลัย ฉันทำงานพาร์ตไทม์ด้วย","sà-mǎi thîi riian má-hǎa-lai, chǎn tham-ngaan pháat-thai dûai","Back when I was in university, I also worked part-time.","大學時期，我也有打工。"]},{"term":["พอ...ก็...","phɔɔ...gɔ̂ɔ...","once..., then...","一……就……"],"meaning":"一……就……，強調事件接續","ex":["พอเข้าร้าน พนักงานก็ถามว่าเอาอะไรดีคะ","phɔɔ khâo ráan, phá-nák-ngaan gɔ̂ɔ thǎam wâa ao à-rai dii khá","As soon as I entered the shop, the staff asked, “What would you like?”","我一走進店裡，店員就問：「想要點什麼呢？」"]}],"tip":"快速判斷： 日常具體事件用 ตอนที่ ；一般習慣用 เวลา ；正式書面用 เมื่อ ；以前某時期用 สมัยที่ ；一……就……用 พอ...ก็... 。"},{"title":"3. เกรงใจ / กลัว / อาย / รบกวน","rows":[{"term":["เกรงใจ","greeng-jai","feel bad to impose","怕麻煩別人／覺得不好意思"],"meaning":"不好意思麻煩、顧慮對方","ex":["ฉันเกรงใจ ไม่อยากรบกวนเขา","chǎn greeng-jai, mâi yàak róp-guan khǎo","I feel bad; I don’t want to bother him/her.","我覺得很不好意思，不想麻煩他。"]},{"term":["กลัว","glua","afraid; scared","真的害怕"],"meaning":"真的害怕","ex":["ฉันกลัวหมา","chǎn glua mǎa","I’m afraid of dogs.","我怕狗。"]},{"term":["อาย","aai","embarrassed; shy","害羞／尷尬／不好意思"],"meaning":"尷尬、害羞、丟臉","ex":["ฉันอายเวลาพูดภาษาไทยผิด","chǎn aai wee-laa phûut phaa-sǎa Thai phìt","I feel embarrassed when I speak Thai incorrectly.","我說錯泰文時會覺得很丟臉。"]},{"term":["รบกวน","róp-guan","bother; trouble","打擾、麻煩別人"],"meaning":"打擾、麻煩別人","ex":["ขอโทษที่รบกวนนะคะ","khɔ̌ɔ-thôot thîi róp-guan ná khá","Sorry for bothering you.","不好意思打擾了。"]}]},{"title":"4. ถูกใจ / ชอบ / พอใจ / ประทับใจ","rows":[{"term":["ชอบ","chɔ̂ɔp","like","一般喜歡"],"meaning":"一般喜歡","ex":["ฉันชอบร้านนี้","chǎn chɔ̂ɔp ráan níi","I like this shop.","我喜歡這家店。"]},{"term":["ถูกใจ","thùuk-jai","be to one’s taste","合心意／很中意"],"meaning":"合心意、很中意","ex":["ร้านนี้ถูกใจฉันมาก","ráan níi thùuk-jai chǎn mâak","This shop is really to my taste.","這家店很合我的喜好。"]},{"term":["พอใจ","phɔɔ-jai","satisfied","對結果、標準滿意"],"meaning":"對結果、標準滿意","ex":["ฉันพอใจกับผลลัพธ์นี้","chǎn phɔɔ-jai gàp phǒn-láp níi","I’m satisfied with this result.","我對這個結果很滿意。"]},{"term":["ประทับใจ","bprà-tháp-jai","impressed","印象深刻、被打動"],"meaning":"印象深刻、被打動","ex":["ฉันประทับใจบริการของร้านนี้มาก","chǎn bprà-tháp-jai bɔɔ-rí-gaan khɔ̌ɔng ráan níi mâak","I’m very impressed by this restaurant’s service.","這家餐廳的服務讓我印象非常深刻。"]}]},{"title":"5. บาง / บ้าง","rows":[{"term":["บาง","baang","some; certain","某些／一部分"],"meaning":"名詞前","ex":["บางคนพูดไทยเร็วมาก","baang khon phûut Thai rew mâak","Some people speak Thai very fast.","有些人說泰文說得很快。"]},{"term":["บ้าง","bâang","some; a bit; among others","一些／一點；列舉部分情況"],"meaning":"句尾 / 動詞後","ex":["คุณชอบกินอะไรบ้าง","khun chɔ̂ɔp gin à-rai bâang","What kinds of things do you like to eat?","你喜歡吃哪一類的東西？"]}],"tip":"Common mistake： บาง / baang / some; certain 放名詞前； บ้าง / bâang / some; a bit 常放句尾或動詞後。"},{"title":"6. เยอะ / มาก / หลาย","rows":[{"term":["เยอะ","yə́","a lot","很多"],"meaning":"數量很多、口語","ex":["ข้อความเยอะมาก อ่านไม่ทัน","khɔ̂ɔ-khwaam yə́ mâak, àan mâi than","There are so many messages; I can’t keep up reading them.","訊息太多了，我看都看不完。"]},{"term":["มาก","mâak","very; much","程度很，最通用"],"meaning":"程度很，最通用","ex":["วันนี้ฉันเหนื่อยมาก","wan-níi chǎn nʉ̀ai mâak","I’m very tired today.","我今天很累。"]},{"term":["หลาย","lǎai","many; several","好幾個、好幾種，常接量詞 / 名詞"],"meaning":"好幾個、好幾種，常接量詞 / 名詞","ex":["มีหลายแบบให้เลือก","mii lǎai bɛ̀ɛp hâi lʉ̂ak","There are many styles to choose from.","有很多款式可以選。"]}]},{"title":"7. ก็ได้ / ก็แล้วกัน / แล้วกัน","rows":[{"term":["ก็ได้","gɔ̂ɔ dâai","okay; fine","好的；那行"],"meaning":"接受、也可以，有時是妥協","ex":["ร้านนี้ก็ได้","ráan níi gɔ̂ɔ dâai","This restaurant is fine too.","這家餐廳也可以。"]},{"term":["ก็แล้วกัน","gɔ̂ɔ lɛ́ɛw gan","let’s settle on that","那就這樣吧／就決定這個吧"],"meaning":"做最後決定、收尾","ex":["ร้านนี้ก็แล้วกัน","ráan níi gɔ̂ɔ lɛ́ɛw gan","Let’s choose this restaurant then.","那我們就選這家餐廳吧。"]},{"term":["แล้วกัน","lɛ́ɛw gan","then; settle on that","更短、更口語"],"meaning":"更短、更口語","ex":["เอาอันนี้แล้วกัน","ao an níi lɛ́ɛw gan","I’ll take this one then.","那我就選這個好了。"]}]}],"mistakes":[{"title":"","wrong":{"label":"","th":"คุยโดยไลน์","ro":"khui dooi LINE","en":"talk by LINE","zh":"透過LINE交談"},"better":{"label":"","th":"คุยผ่านไลน์","ro":"khui phàan LINE","en":"talk via LINE","zh":"透過LINE交談"},"why":"โดย/dooi/by偏正式；平台、管道日常更自然用ผ่าน/phàan/through; via。"},{"title":"","wrong":{"label":"","th":"ฉันใช้เครื่องบินมา","ro":"chǎn chái khrʉ̂ang-bin maa","en":"I used an airplane to come.","zh":"我坐飛機來了。"},"better":{"label":"","th":"ฉันนั่งเครื่องบินมา","ro":"chǎn nâng khrʉ̂ang-bin maa","en":"I came by plane.","zh":"我是坐飛機來的。"},"why":"交通工具日常用นั่ง + vehicle + มา/ไป/nâng + vehicle + maa/bpai/come/go by vehicle。"},{"title":"","wrong":{"label":"","th":"เดี๋ยวก่อนกิน","ro":"dǐaw gɔ̀ɔn gin","en":"wait first eat","zh":"等待，先吃"},"better":{"label":"","th":"เดี๋ยวค่อยกิน","ro":"dǐaw khɔ̂i gin","en":"I’ll eat later.","zh":"我晚點再吃。"},"why":"เดี๋ยวก่อน是叫人先等；「等一下再吃」要用เดี๋ยวค่อยกิน。"},{"title":"","wrong":{"label":"","th":"ฉันกินเพิ่ง","ro":"chǎn gin phə̂ng","en":"I ate just","zh":"我剛吃了"},"better":{"label":"","th":"ฉันเพิ่งกิน","ro":"chǎn phə̂ng gin","en":"I just ate.","zh":"我剛吃了。"},"why":"เพิ่ง/phə̂ng/just recently通常放在動詞前。"},{"title":"","wrong":{"label":"","th":"บ้างคน","ro":"bâang khon","en":"some people","zh":"一些人"},"better":{"label":"","th":"บางคน","ro":"baang khon","en":"some people","zh":"一些人"},"why":"บาง放名詞前；บ้าง常放句尾或動詞後。"},{"title":"","wrong":{"label":"","th":"พูดไทยได้บาง","ro":"phûut Thai dâai baang","en":"can speak some Thai","zh":"會說一些泰文"},"better":{"label":"","th":"พูดไทยได้บ้าง","ro":"phûut Thai dâai bâang","en":"can speak some Thai","zh":"會說一些泰文"},"why":"「會一些」用句尾บ้าง/bâang/some; a bit。"},{"title":"","wrong":{"label":"","th":"ฉันเหนื่อยเยอะ","ro":"chǎn nʉ̀ai yə́","en":"I’m tired a lot.","zh":"我很累。"},"better":{"label":"","th":"ฉันเหนื่อยมาก","ro":"chǎn nʉ̀ai mâak","en":"I’m very tired.","zh":"我很累。"},"why":"เยอะ是數量多；情緒或狀態程度用มาก。"},{"title":"","wrong":{"label":"","th":"สมัยที่ฉันกินข้าว โทรศัพท์ดัง","ro":"sà-mǎi thîi chǎn gin khâaw, thoo-rá-sàp dang","en":"Back when I was eating, the phone rang.","zh":"當我在吃飯的時候，電話響了。"},"better":{"label":"","th":"ตอนที่ฉันกินข้าว โทรศัพท์ดัง","ro":"dtɔɔn thîi chǎn gin khâaw, thoo-rá-sàp dang","en":"When I was eating, the phone rang.","zh":"當我在吃飯的時候，電話響了。"},"why":"สมัยที่用於一段時期，不適合短暫動作。"}],"dialogues":[{"title":"","turns":[{"speaker":"Staff","side":"left","th":"รับอะไรดีคะ","ro":"ráp à-rai dii khá","en":"What would you like?","zh":"你想要什麼？"},{"speaker":"Customer","side":"right","th":"เดี๋ยวก่อนนะคะ ขอคิดแป๊บนึง","ro":"dǐaw gɔ̀ɔn ná khá, khɔ̌ɔ khít bpɛ́ɛp nʉng","en":"One moment, please. Let me think for a second.","zh":"請等一下，讓我想一下。"},{"speaker":"Customer","side":"right","th":"งั้นเอากาแฟเย็นก็แล้วกันค่ะ","ro":"ngán ao kaa-fɛɛ yen gɔ̂ɔ lɛ́ɛw gan khâ","en":"Then I’ll take iced coffee.","zh":"然後我要冰咖啡。"}]},{"title":"","turns":[{"speaker":"Customer","side":"left","th":"แบบนี้มีสีอื่นไหมคะ","ro":"bɛ̀ɛp níi mii sǐi ùuen mái khá","en":"Does this style come in another color?","zh":"這種風格有其他顏色嗎？"},{"speaker":"Seller","side":"right","th":"มีสีขาวกับสีน้ำตาลค่ะ","ro":"mii sǐi khǎaw gàp sǐi náam-dtaan khâ","en":"We have white and brown.","zh":"我們有白色和棕色的。"},{"speaker":"Customer","side":"left","th":"งั้นเอาสีน้ำตาลก็แล้วกันค่ะ ถูกใจมาก","ro":"ngán ao sǐi náam-dtaan gɔ̂ɔ lɛ́ɛw gan khâ, thùuk-jai mâak","en":"Then I’ll take brown. I really like it.","zh":"那我就拿棕色的。我真的很喜歡它。"}]},{"title":"","turns":[{"speaker":"A","side":"left","th":"จากตรงนี้ไปสยามต้องต่อรถไหม","ro":"jàak dtrong níi bpai Sà-yǎam dtɔ̂ng dtɔ̀ɔ rót mái","en":"From here to Siam, do we need to transfer?","zh":"從這裡去暹羅需要轉車嗎？"},{"speaker":"B","side":"right","th":"ไม่ต้อง นั่งบีทีเอสไปตรง ๆ ได้เลย","ro":"mâi dtɔ̂ng, nâng BTS bpai dtrong-dtrong dâai ləəy","en":"No need. You can take the BTS straight there.","zh":"不需要。你可以直接乘坐BTS去那裡。"},{"speaker":"A","side":"left","th":"โอเค งั้นเดินตาม Google Maps ไปก่อนนะ","ro":"oo-khee, ngán dəən dtaam Google Maps bpai gɔ̀ɔn ná","en":"Okay, then let’s follow Google Maps first.","zh":"好的，那我們先跟著谷歌地圖走。"}]},{"title":"","turns":[{"speaker":"A","side":"left","th":"วันนี้ฉันงานเยอะมาก อาจจะไปไม่ได้","ro":"wan-níi chǎn ngaan yə́ mâak, àat-jà bpai mâi dâai","en":"I have a lot of work today. I may not be able to go.","zh":"我今天有很多工作要做。我可能去不了。"},{"speaker":"B","side":"right","th":"ถ้างั้นไว้วันหลังก็ได้ ไม่ต้องเกรงใจนะ","ro":"thâa ngán wái wan lǎng gɔ̂ɔ dâai, mâi dtɔ̂ng greeng-jai ná","en":"Then another day is fine. Don’t feel bad.","zh":"那就改天吧。不要感到難過。"},{"speaker":"A","side":"left","th":"ขอบคุณนะ เกรงใจมากเลย","ro":"khɔ̀ɔp-khun ná, greeng-jai mâak ləəy","en":"Thank you. I really feel bad.","zh":"謝謝你。我真的感覺很糟糕。"}]}],"structures":[{"title":"1. เดี๋ยวค่อย + Verb","meaning":"等一下再……、晚點再……。適合把動作延後。","examples":[["เดี๋ยวค่อยดูนะ","dǐaw khɔ̂i duu ná","I’ll look later, okay?","我稍後再看看，好嗎？"],["เดี๋ยวค่อยบอกนะ","dǐaw khɔ̂i bɔ̀ɔk ná","I’ll tell you later, okay?","我稍後再告訴你，好嗎？"]]},{"title":"2. เพิ่ง + Verb","meaning":"","examples":[["เพิ่ง","phə̂ng","just; only recently","才剛／剛剛"],["ฉันเพิ่งถึงบ้านค่ะ","chǎn phə̂ng thʉ̌ng bâan khâ","I just got home.","我剛到家。"],["ฉันเพิ่งเคยกินอาหารเหนือ","chǎn phə̂ng khəəy gin aa-hǎan nʉ̌a","I just tried Northern Thai food for the first time.","我剛剛第一次嘗試了泰國北部的食物。"]]},{"title":"3. อย่าเพิ่ง + Verb","meaning":"先不要……、還不要急著……。","examples":[["อย่าเพิ่งไปนะ","yàa phə̂ng bpai ná","Don’t go yet.","先別走。"],["อย่าเพิ่งรีบตัดสินใจ","yàa phə̂ng rîip dtàt-sǐn-jai","Don’t rush to decide yet.","先別急著做決定。"]]},{"title":"4. พอ + A + ก็ + B","meaning":"一 A 就 B。強調事件接續或反應。","examples":[["พอเห็นข้อความก็รีบตอบ","phɔɔ hěn khɔ̂ɔ-khwaam gɔ̂ɔ rîip dtɔ̀ɔp","As soon as I saw the message, I replied quickly.","我一看到訊息，就很快回復了。"]]},{"title":"5. ตามที่ + clause","meaning":"依照……所說 / 所約定 / 所理解。","examples":[["ตามที่คุณบอก ฉันจะส่งเอกสารให้วันนี้","dtaam thîi khun bɔ̀ɔk, chǎn jà sòng èek-gà-sǎan hâi wan-níi","As you said, I’ll send the documents today.","正如你所說，我今天會把檔案寄出去。"],["ตามที่ตกลงกันไว้ เราจะเริ่มประชุมตอนสิบโมง","dtaam thîi dtòk-long gan wái, rao jà rə̂əm bprà-chum dtɔɔn sìp moong","As agreed, we will start the meeting at 10.","按照約定，我們將在10點開始會議。"]]},{"title":"6. Verb + ต่อ","meaning":"繼續做某事。","examples":[["พรุ่งนี้ค่อยทำต่อนะ","phrûng-níi khɔ̂i tham dtɔ̀ɔ ná","Let’s continue doing it tomorrow.","我們明天繼續做吧。"],["คืนนี้ดูซีรีส์ต่อไหม","khʉʉn-níi duu sii-rîi dtɔ̀ɔ mái","Do you want to continue watching the series tonight?","你今晚想繼續看這個系列嗎？"]]},{"title":"7. งั้น + decision + ก็แล้วกัน","meaning":"那就……好了；做收尾決定。","examples":[["งั้นเอาแบบนี้ก็แล้วกัน","ngán ao bɛ̀ɛp níi gɔ̂ɔ lɛ́ɛw gan","Then let’s do it this way.","那我們就這樣做吧。"],["งั้นไว้พรุ่งนี้ก็แล้วกัน","ngán wái phrûng-níi gɔ̂ɔ lɛ́ɛw gan","Then let’s leave it for tomorrow.","那我們把它留到明天吧。"]]},{"title":"8. ต่อให้...ก็...","meaning":"就算……也……。","examples":[["ต่อให้ยาก ฉันก็อยากลอง","dtɔ̀ɔ hâi yâak, chǎn gɔ̂ɔ yàak lɔɔng","Even if it’s difficult, I still want to try.","即使很難，我仍然想嘗試。"]]}],"sentenceBank":[{"scene":"Café / Restaurant｜點餐猶豫 / 人很多 / 推薦","sentences":[{"th":"ร้านนี้คนเยอะมาก งั้นไปร้านอื่นไหม","ro":"ráan níi khon yə́ mâak, ngán bpai ráan ùuen mái","en":"This place is really crowded. Then should we go to another place?","zh":"這個地方真的很擁擠。那我們應該去別的地方嗎？"},{"th":"เดี๋ยวก่อนนะคะ ขอคิดแป๊บนึง","ro":"dǐaw gɔ̀ɔn ná khá, khɔ̌ɔ khít bpɛ́ɛp nʉng","en":"One moment, please. Let me think for a second.","zh":"請等一下，讓我想一下。"},{"th":"งั้นเอาชาไทยก็แล้วกันค่ะ","ro":"ngán ao chaa Thai gɔ̂ɔ lɛ́ɛw gan khâ","en":"Then I’ll take Thai tea.","zh":"那我就喝泰式茶。"},{"th":"มีอะไรแนะนำบ้างคะ","ro":"mii à-rai náe-nam bâang khá","en":"What do you recommend?","zh":"你推薦什麼？"}]},{"scene":"Street Stall / Mall｜款式 / 喜好 / 殺價","sentences":[{"th":"แบบนี้มีไซซ์เล็กไหมคะ","ro":"bɛ̀ɛp níi mii sái lék mái khá","en":"Does this style come in a small size?","zh":"這個款式有小尺寸的嗎？"},{"th":"อันนี้ไม่ค่อยถูกใจฉันเท่าไหร่","ro":"an níi mâi khɔ̂i thùuk-jai chǎn thâo-rài","en":"This one isn’t really to my taste.","zh":"這個不太符合我的口味。"},{"th":"อันนี้สไตล์ฉันเลย","ro":"an níi sà-dtai chǎn ləəy","en":"This is totally my style.","zh":"這完全是我的風格。"},{"th":"ลดให้อีกนิดได้ไหมคะ","ro":"lót hâi ìik nít dâai mái khá","en":"Could you lower it a little more?","zh":"你能再降低一點嗎？"}]},{"scene":"BTS / MRT｜轉乘 / 地點 / 路線","sentences":[{"th":"จากที่นี่ต้องต่อบีทีเอสอีกสายหนึ่ง","ro":"jàak thîi-nîi dtɔ̂ng dtɔ̀ɔ BTS ìik sǎai nʉ̀ng","en":"From here, you need to transfer to another BTS line.","zh":"從這裡，你需要轉到另一條BTS線路。"},{"th":"เดินตาม Google Maps ไปได้เลย","ro":"dəən dtaam Google Maps bpai dâai ləəy","en":"Just follow Google Maps.","zh":"只需關注谷歌地圖。"},{"th":"ร้านอยู่ตรงกลางระหว่าง BTS กับ MRT","ro":"ráan yùu dtrong-glaang rá-wàang BTS gàp MRT","en":"The shop is right in the middle between the BTS and MRT.","zh":"這家商店就在BTS和MRT的中間。"},{"th":"เวลาฝนตก กรุงเทพฯ รถติดมาก","ro":"wee-laa fǒn dtòk, grung-thêep rót-dtìt mâak","en":"When it rains, Bangkok traffic is terrible.","zh":"下雨的時候，曼谷的交通很糟糕。"}]},{"scene":"Work / School｜學習 / 文件 / 繼續","sentences":[{"th":"ช่วยอธิบายแบบง่าย ๆ ได้ไหมคะ","ro":"chûai à-thí-baai bɛ̀ɛp ngâai-ngâai dâai mái khá","en":"Can you explain it in a simple way?","zh":"可以用簡單一點的方式說明嗎？"},{"th":"วันนี้พอแค่นี้ก่อน พรุ่งนี้ค่อยต่อ","ro":"wan-níi phɔɔ khɛ̂ɛ níi gɔ̀ɔn, phrûng-níi khɔ̂i dtɔ̀ɔ","en":"That’s enough for today. We’ll continue tomorrow.","zh":"今天先到這裡，明天再繼續。"},{"th":"บางคำยากมาก แต่ใช้บ่อย","ro":"baang kham yâak mâak, dtɛ̀ɛ chái bɔ̀i","en":"Some words are very difficult, but they are used often.","zh":"有些單詞很難，但它們經常被使用。"},{"th":"ฉันเพิ่งเริ่มเรียนภาษาไทยเองค่ะ","ro":"chǎn phə̂ng rə̂əm riian phaa-sǎa Thai eeng khâ","en":"I only just started learning Thai.","zh":"我才剛剛開始學習泰文。"}]},{"scene":"Friends / Chat｜回覆 / 想太多 / 收尾","sentences":[{"th":"เพิ่งเห็นข้อความค่ะ ขอโทษที่ตอบช้า","ro":"phə̂ng hěn khɔ̂ɔ-khwaam khâ, khɔ̌ɔ-thôot thîi dtɔ̀ɔp cháa","en":"I just saw the message. Sorry for replying late.","zh":"我剛看到這條訊息。抱歉回覆晚了。"},{"th":"อย่าคิดเยอะนะ พักก่อนก็ได้","ro":"yàa khít yə́ ná, phák gɔ̀ɔn gɔ̂ɔ dâai","en":"Don’t overthink, okay? You can rest first.","zh":"不要想太多，好嗎？ 你可以先休息。"},{"th":"บางทีเขาอาจจะเหนื่อย","ro":"baang thii khǎo àat-jà nʉ̀ai","en":"Maybe he/she is tired.","zh":"也許他/她累了。"},{"th":"งั้นพักก่อนนะ ไว้ค่อยคุยกัน","ro":"ngán phák gɔ̀ɔn ná, wái khɔ̂i khui gan","en":"Then rest first. We can talk later.","zh":"然後先休息。我們可以晚點再談。"}]},{"scene":"Politeness｜เกรงใจ / 打擾 / 禮貌","sentences":[{"th":"ขอบคุณมากนะคะ เกรงใจมากเลย","ro":"khɔ̀ɔp-khun mâak ná khá, greeng-jai mâak ləəy","en":"Thank you so much. I really feel bad troubling you.","zh":"非常感謝。我真的為困擾你感到難過。"},{"th":"ไม่ต้องเกรงใจนะ เป็นเพื่อนกัน","ro":"mâi dtɔ̂ng greeng-jai ná, bpen phʉ̂an gan","en":"Don’t feel bad. We’re friends.","zh":"不要感到難過。我們是朋友。"},{"th":"ขอโทษที่รบกวนนะคะ แต่ขอถามนิดนึงได้ไหมคะ","ro":"khɔ̌ɔ-thôot thîi róp-guan ná khá, dtɛ̀ɛ khɔ̌ɔ thǎam nít nʉ̀ng dâai mái khá","en":"Sorry to bother you, but may I ask a quick question?","zh":"抱歉打擾你了，我可以問個簡短的問題嗎？"},{"th":"เกรงใจจังค่ะ แต่ไม่รู้จะถามใครจริง ๆ","ro":"greeng-jai jang khâ, dtɛ̀ɛ mâi rúu jà thǎam khrai jing-jing","en":"I feel so bad, but I really don’t know who else to ask.","zh":"我感覺很糟糕，但我真的不知道還能問誰。"}]}],"bangkok":[{"scene":"Café｜點餐猶豫、做決定","sentences":[{"th":"เดี๋ยวก่อนนะคะ ขอคิดแป๊บนึง","ro":"dǐaw gɔ̀ɔn ná khá, khɔ̌ɔ khít bpɛ́ɛp nʉ̀ng","en":"One moment, please. Let me think for a second.","zh":"稍等一下，我想一下。"},{"th":"งั้นเอาชาไทยก็แล้วกันค่ะ","ro":"ngán ao chaa Thai gɔ̂ɔ lɛ́ɛw gan khâ","en":"Then I’ll have Thai tea.","zh":"那我就點泰式奶茶好了。"},{"th":"ยังเลือกไม่ได้เลย ขอดูเมนูต่ออีกหน่อยนะคะ","ro":"yang lʉ̂ak mâi dâai ləəy, khɔ̌ɔ duu mee-nuu dtɔ̀ɔ ìik nɔ̀i ná khá","en":"I still can’t decide. Let me look at the menu a little longer, please.","zh":"還是選不出來，讓我再看一下菜單喔。"}]},{"scene":"Restaurant｜人很多、換地方","sentences":[{"th":"ร้านนี้คนเยอะมาก","ro":"ráan níi khon yə́ mâak","en":"This place is really crowded.","zh":"這家人真的很多。"},{"th":"งั้นไปร้านอื่นไหม","ro":"ngán bpai ráan ʉ̀ʉn mái","en":"Then should we go to another restaurant?","zh":"那要不要換別家？"},{"th":"ถ้าต้องรอนาน ไปหาร้านแถวนี้กันไหม","ro":"thâa dtɔ̂ng rɔɔ naan, bpai hǎa ráan thɛ̌ɛw níi gan mái","en":"If the wait is long, shall we find a restaurant nearby?","zh":"如果要等很久，要不要去附近找別家？"}]},{"scene":"Street Stall / Market｜款式與殺價","sentences":[{"th":"แบบนี้มีสีอื่นไหมคะ","ro":"bɛ̀ɛp níi mii sǐi ʉ̀ʉn mái khá","en":"Does this style come in another color?","zh":"這個款式有其他顏色嗎？"},{"th":"ลดให้อีกนิดได้ไหมคะ","ro":"lót hâi ìik nít dâai mái khá","en":"Could you lower the price a little more?","zh":"可以再便宜一點嗎？"},{"th":"ถ้าซื้อสองชิ้น มีราคาพิเศษไหมคะ","ro":"thâa sʉ́ʉ sɔ̌ɔng chín, mii raa-khaa phí-sèet mái khá","en":"If I buy two, is there a special price?","zh":"如果買兩件，有優惠價嗎？"}]},{"scene":"BTS / MRT｜轉乘與位置","sentences":[{"th":"จากที่นี่ต้องต่อ BTS อีกสายหนึ่ง","ro":"jàak thîi-nîi dtɔ̂ng dtɔ̀ɔ BTS ìik sǎai nʉ̀ng","en":"From here, you need to transfer to another BTS line.","zh":"從這裡還要再轉另一條 BTS 線。"},{"th":"ร้านอยู่ตรงกลางระหว่าง BTS กับ MRT","ro":"ráan yùu dtrong-glaang rá-wàang BTS gàp MRT","en":"The shop is midway between the BTS and MRT.","zh":"那家店就在 BTS 和 MRT 中間。"},{"th":"ถ้าลงอโศก ต่อ MRT ได้เลยใช่ไหมคะ","ro":"thâa long à-sòok, dtɔ̀ɔ MRT dâai ləəy châi mái khá","en":"If I get off at Asok, I can transfer directly to the MRT, right?","zh":"如果在阿索克站下車，就可以直接轉 MRT，對嗎？"}]},{"scene":"Condo｜房型與中意","sentences":[{"th":"ห้องนี้ถูกใจฉันมาก","ro":"hɔ̂ng níi thùuk-jai chǎn mâak","en":"I really like this room.","zh":"這間房我真的很喜歡。"},{"th":"ถ้าวางโซฟาตรงกลาง ห้องจะดูแคบไหมคะ","ro":"thâa waang soo-faa dtrong-glaang, hɔ̂ng jà duu khɛ̂ɛp mái khá","en":"If we put the sofa in the middle, will the room look narrow?","zh":"如果沙發放在中間，房間會不會看起來很窄？"},{"th":"แบบห้องนี้มีชั้นสูงกว่านี้ไหมคะ","ro":"bɛ̀ɛp hɔ̂ng níi mii chán sǔung gwàa níi mái khá","en":"Do you have this room type on a higher floor?","zh":"這個房型有更高樓層的嗎？"}]},{"scene":"Work / School｜禮貌麻煩與收尾","sentences":[{"th":"ขอโทษที่รบกวนนะคะ แต่ขอถามนิดนึงได้ไหมคะ","ro":"khɔ̌ɔ-thôot thîi róp-guan ná khá, dtɛ̀ɛ khɔ̌ɔ thǎam nít nʉ̀ng dâai mái khá","en":"Sorry to bother you, but may I ask a quick question?","zh":"不好意思打擾一下，可以問個小問題嗎？"},{"th":"วันนี้พอแค่นี้ก็แล้วกัน","ro":"wan-níi phɔɔ khɛ̂ɛ níi gɔ̂ɔ lɛ́ɛw gan","en":"Let’s stop here for today.","zh":"今天就先到這裡吧。"},{"th":"งั้นพรุ่งนี้ค่อยต่อส่วนที่เหลือนะคะ","ro":"ngán phrûng-níi khɔ̂i dtɔ̀ɔ sùan thîi lʉ̌a ná khá","en":"Then let’s continue the rest tomorrow.","zh":"那剩下的部分明天再繼續喔。"}]},{"scene":"Friends / Chat｜安慰與延後","sentences":[{"th":"บางทีเขาอาจจะเหนื่อย","ro":"baang thii khǎo àat-jà nʉ̀ai","en":"Maybe he or she is tired.","zh":"也許對方只是累了。"},{"th":"อย่าคิดเยอะนะ พักก่อนก็ได้","ro":"yàa khít yə́ ná, phák gɔ̀ɔn gɔ̂ɔ dâai","en":"Don’t overthink, okay? You can rest first.","zh":"別想太多，先休息一下也可以。"},{"th":"งั้นไว้คุยกันทีหลังนะ","ro":"ngán wái khui gan thii-lǎng ná","en":"Then let’s talk later, okay?","zh":"那我們晚點再聊喔。"}]},{"scene":"Learning Thai｜請人解釋、慢慢學","sentences":[{"th":"ช่วยอธิบายแบบง่าย ๆ ได้ไหมคะ","ro":"chûai à-thí-baai bɛ̀ɛp ngâai-ngâai dâai mái khá","en":"Can you explain it in a simple way?","zh":"可以用簡單一點的方式說明嗎？"},{"th":"บางคำยากมาก แต่ใช้บ่อย","ro":"baang kham yâak mâak, dtɛ̀ɛ chái bɔ̀i","en":"Some words are very difficult, but they are used often.","zh":"有些詞很難，但其實很常用。"},{"th":"ค่อย ๆ เรียนไป เดี๋ยวก็เข้าใจมากขึ้น","ro":"khɔ̂i-khɔ̂i riian bpai, dǐaw gɔ̂ɔ khâo-jai mâak khʉ̂n","en":"Keep learning little by little; you’ll understand more as you go.","zh":"慢慢學下去，自然就會懂得更多。"}]}],"practice":[{"title":"Practice A｜Vocabulary Recall","prompts":["「剛看到訊息」泰文怎麼說？","「人很多 / 很擠」泰文怎麼說？","「我會說一點泰文」泰文怎麼說？","「那就這個好了」泰文怎麼說？","「不用不好意思」泰文怎麼說？","「這兩個詞差在哪？」泰文怎麼說？"],"answers":[["เพิ่งเห็นข้อความ","phə̂ng hěn khɔ̂ɔ-khwaam","just saw the message","剛看到訊息"],["คนเยอะ","khon yə́","many people; crowded","很多人；擁擠"],["พูดไทยได้บ้างค่ะ","phûut Thai dâai bâang khâ","I can speak some Thai.","我會說一點泰文。"],["เอาอันนี้ก็แล้วกัน","ao an níi gɔ̂ɔ lɛ́ɛw gan","I’ll take this one then.","那我就拿這個。"],["ไม่ต้องเกรงใจ","mâi dtɔ̂ng greeng-jai","No need to feel bad.","沒必要感到難過。"],["สองคำนี้ต่างกันยังไงคะ","sɔ̌ɔng kham níi dtàang gan yang-ngai khá","How are these two words different?","這兩個詞有什麼不同？"]]},{"title":"Practice B｜Choose the right word","prompts":["透過 LINE 聊：โดย/ผ่าน","有些人：บางคน/บ้างคน","很累：เหนื่อยมาก/เหนื่อยเยอะ","晚點再聊：เดี๋ยวค่อยคุย/เดี๋ยวก่อนคุย","一到家就睡：ตอนที่ถึงบ้านก็หลับ/พอถึงบ้านก็หลับ","不好意思麻煩你：อาย/เกรงใจ"],"answers":[["ผ่าน","khui phàan LINE","talk via LINE","經過／透過／經歷／通過"],["บางคน","baang khon","some people","一些人"],["เหนื่อยมาก","nʉ̀ai mâak","very tired","非常疲憊"],["เดี๋ยวค่อยคุย","dǐaw khɔ̂i khui","talk later","稍後再聊"],["พอถึงบ้านก็หลับ","phɔɔ thʉ̌ng bâan gɔ̂ɔ làp","once got home, fell asleep","一到家，就睡著了"],["เกรงใจ","greeng-jai","feel bad to impose","怕麻煩別人／覺得不好意思"]]},{"title":"Practice C｜Chinese → Thai","prompts":["那我先走喔。","可以用簡單一點的方式解釋嗎？","你先去，我等一下過去。","那就改天好了。","我真的很不好意思麻煩你。","這間房我很中意。"],"answers":[["งั้นฉันไปก่อนนะ","ngán chǎn bpai gɔ̀ɔn ná","Then I’ll go first.","那我先走。"],["ช่วยอธิบายแบบง่าย ๆ ได้ไหมคะ","chûai à-thí-baai bɛ̀ɛp ngâai-ngâai dâai mái khá","Can you explain it in a simple way?","可以用簡單一點的方式說明嗎？"],["ไปก่อนเลย เดี๋ยวตามไป","bpai gɔ̀ɔn ləəy, dǐaw dtaam bpai","Go ahead first. I’ll follow later.","你先去，我待會兒跟上。"],["ไว้วันหลังก็แล้วกัน","wái wan lǎng gɔ̂ɔ lɛ́ɛw gan","Another day then.","那就改天。"],["ฉันเกรงใจคุณมากค่ะ","chǎn greeng-jai khun mâak khâ","I feel really bad about troubling you.","這樣麻煩你，我真的很不好意思。"],["ห้องนี้ถูกใจฉันมาก","hɔ̂ng níi thùuk-jai chǎn mâak","This room is really to my taste.","這個房間真的符合我的口味。"]]},{"title":"Practice D｜Mini Dialogue Completion","prompts":["A:ร้านนี้คนเยอะมาก。B: ________（那要不要去別家？）","A:วันนี้ไม่ว่างอะ。B: ________（那就改天也可以。）","Staff:ชาไทยหมดค่ะ。You: ________（那就冰咖啡好了。）","A:วันนี้เหนื่อยมาก。B: ________（那你先休息喔，晚點再聊。）","Teacher:วันนี้พอแค่นี้ก่อน。Student: ________（明天再繼續。）"],"answers":[["งั้นไปร้านอื่นไหม","ngán bpai ráan ùuen mái","Then should we go to another place?","那我們應該去別的地方嗎？"],["ถ้างั้นไว้วันหลังก็ได้","thâa ngán wái wan lǎng gɔ̂ɔ dâai","Then another day is fine.","那就改天吧。"],["งั้นเอากาแฟเย็นก็แล้วกันค่ะ","ngán ao kaa-fɛɛ yen gɔ̂ɔ lɛ́ɛw gan khâ","Then I’ll take iced coffee.","然後我要冰咖啡。"],["งั้นพักก่อนนะ ไว้ค่อยคุยกัน","ngán phák gɔ̀ɔn ná, wái khɔ̂i khui gan","Then rest first. We can talk later.","然後先休息。我們可以晚點再談。"],["พรุ่งนี้ค่อยต่อค่ะ","phrûng-níi khɔ̂i dtɔ̀ɔ khâ","We’ll continue tomorrow.","我們明天繼續。"]]}],"g":[{"id":"g-compare","title":"近義比較","tth":"คำใกล้เคียง","em":"⚖️","kind":"compare"},{"id":"g-structure","title":"句型結構","tth":"โครงสร้างประโยค","em":"🧩","kind":"structure"},{"id":"g-mistake","title":"常見錯誤","tth":"ข้อผิดพลาดที่พบบ่อย","em":"🚫","kind":"mistake"},{"id":"g-dialogue","title":"情境短對話","tth":"บทสนทนาสั้นๆ","em":"💬","kind":"dialogue"},{"id":"g-sentence","title":"例句庫","tth":"ประโยคตัวอย่าง","em":"📝","kind":"sentence","src":"sentenceBank"},{"id":"g-bangkok","title":"曼谷生活場景","tth":"ฉากชีวิตกรุงเทพ","em":"🏙️","kind":"sentence","src":"bangkok"},{"id":"g-practice","title":"自我測驗","tth":"แบบฝึกหัด","em":"✅","kind":"practice"}]}</script>
<script>

let ROM=true,LANG='zh',isMob=window.innerWidth<769,curPl=null,FILTER='all';
const PROGRESS_KEY='thai_notes_lrn_2026_05_25_v1';
const FAV_KEY='thai_notes_fav_2026_05_25_v1';
function loadProgress(){
 try{const raw=localStorage.getItem(PROGRESS_KEY);const p=raw?JSON.parse(raw):{};return p&&typeof p==='object'&&!Array.isArray(p)?p:{};}catch(e){return{};}
}
function saveProgress(){try{localStorage.setItem(PROGRESS_KEY,JSON.stringify(LRN));}catch(e){console.warn('無法儲存學習進度。',e);}}
function loadFav(){
 try{const raw=localStorage.getItem(FAV_KEY);const p=raw?JSON.parse(raw):{};return p&&typeof p==='object'&&!Array.isArray(p)?p:{};}catch(e){return{};}
}
function saveFav(){try{localStorage.setItem(FAV_KEY,JSON.stringify(FAV));}catch(e){console.warn('無法儲存收藏。',e);}}
let LRN=loadProgress();
let FAV=loadFav();
const D=JSON.parse(document.getElementById('jd').textContent);
const VOCAB=D.vocab,CMP=D.compare,MIS=D.mistakes,DLG=D.dialogues,STR=D.structures,SENB=D.sentenceBank,BKK=D.bangkok,PRC=D.practice,GRP=D.g;
const TITLE='Thai Daily Notes',SUBTITLE='ตลอดชีวิต・โดย・ผ่าน';

function speak(t){
 if(!window.speechSynthesis||!t)return;
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);
 u.lang='th-TH';u.rate=0.88;u.pitch=1;
 window.speechSynthesis.speak(u);
}
function playBtn(el,t){
 if(curPl)curPl.classList.remove('pl');
 curPl=el;el.classList.add('pl');speak(t);
 setTimeout(()=>{if(curPl===el)el.classList.remove('pl');},3000);
}
function esc(s){return(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');}
function ab(t,e=''){return `<button class="abtn${e?' '+e:''}" onclick="event.stopPropagation();playBtn(this,'${esc(t)}')" title="播放">▶</button>`;}
function ro(cls,t){return `<div class="${cls}${ROM?'':' hid'}">${t||''}</div>`;}
function enzh(clsEn,clsZh,en,zh){const et=en||zh||'',zt=zh||en||'';return `<div class="${clsEn} lang-en${LANG==='en'?'':' hid'}">${et}</div><div class="${clsZh} lang-zh${LANG==='zh'?'':' hid'}">${zt}</div>`;}

/* ================= Vocabulary card (mirrors QA-50's rQ) ================= */
function rV(v){
 const id=v.i,lrn=LRN[id]?'lrn':'',fav=!!FAV[id];
 const num=parseInt(id.slice(1),10);
 const exHtml=(v.ex&&v.ex[0])?`<div class="ans"><div class="anl">例</div><div class="ant"><div class="anth">${v.ex[0]}</div>${ro('anro',v.ex[1]||'')}${enzh('anen','anzh',v.ex[2],v.ex[3])}</div>${ab(v.ex[0])}</div>`:'';
 const note=v.note?`<div class="note ng"><div class="ng-l">📖 語感筆記</div><div class="ng-t">${v.note}</div></div>`:'';
 const lb=LRN[id]?`<button class="lbtn dn" onclick="event.stopPropagation();tLrn('${id}',this)">↩ 改為未熟悉</button>`
  :`<button class="lbtn" onclick="event.stopPropagation();tLrn('${id}',this)">✓ 標記為熟悉</button>`;
 const favBtn=`<button class="favbtn ${fav?'on':''}" onclick="event.stopPropagation();tFav('${id}',this)">${fav?'★ 已收藏':'☆ 收藏'}</button>`;
 return `<div class="qc ${lrn}" id="${id}">
  <div class="qch" onclick="tCard('${id}')">
   <div class="qcn">${num}</div>
   <div class="qcq"><div class="qcth">${v.th}</div>${ro('qcro',v.ro)}${enzh('qcen','qczh',v.en,v.zh)}</div>
   <div class="qca">${ab(v.th)}<button class="xbtn">▾</button></div>
  </div>
  <div class="qcb"><div class="qcbi"><div class="div"></div>
   <div class="vb-tag" style="margin-bottom:9px;">${v.cat}</div>
   ${exHtml}
   <div class="notes">${note}</div>
   <div class="cft">${favBtn}${lb}</div>
  </div></div>
 </div>`;
}
function rVocabAll(){
 const done=getDoneCount();
 return `<div class="sec-blk" id="g-vocab">
  <div class="sec-hd"><div class="sec-n">📚</div>
   <div class="sec-tts"><div class="sec-tzh">詞彙庫</div><div class="sec-tth">คำศัพท์ทั้งหมด</div></div>
   <div class="sec-chip" id="chip-g-vocab">${done}/${VOCAB.length} 已熟悉</div>
  </div>${VOCAB.map(v=>rV(v)).join('')}
 </div>`;
}

/* ================= Compare (近義比較) ================= */
function rCmpRow(row){
 const termCell=row.term&&row.term[0]
  ?`<div class="cmp-term"><div class="cmp-pat">${row.term[0]}${ab(row.term[0])}</div>${ro('cmp-ex-ro',row.term[1])}${enzh('cmp-ex-en','cmp-ex-zh',row.term[2],row.term[3])}</div>`
  :`<div class="cmp-term"><div class="cmp-pat">—</div></div>`;
 return `<div class="cmp-row">${termCell}<div class="cmp-body"><div class="cmp-mean">${row.meaning||''}</div><div class="cmp-ex"><div class="cmp-ex-line"><div class="cmp-ex-tx"><div class="cmp-ex-th">${row.ex[0]}</div>${ro('cmp-ex-ro',row.ex[1])}${enzh('cmp-ex-en','cmp-ex-zh',row.ex[2],row.ex[3])}</div>${ab(row.ex[0])}</div></div></div></div>`;
}
function rCmpCard(c,i){
 return `<div class="cmp-card" id="CMP-${i}"><div class="cmp-title">${c.title}</div>${c.intro?`<div class="cmp-intro">${c.intro}</div>`:''}<div class="cmp-list">${c.rows.map(rCmpRow).join('')}</div>${c.tip?`<div class="cmp-tip">${c.tip}</div>`:''}</div>`;
}
function rCmpSec(){
 return `<div class="apx" id="g-compare"><div class="apx-hd"><div class="apx-ic">⚖️</div><div class="apx-tit"><div class="apx-tzh">近義比較</div><div class="apx-tth">คำใกล้เคียงที่ต้องแยกให้ออก</div></div></div>
  ${CMP.map((c,i)=>rCmpCard(c,i)).join('')}
 </div>`;
}

/* ================= Mistakes (常見錯誤) ================= */
function rMisBox(cls,label,box){
 if(!box)return'';
 return `<div class="mis-box ${cls}"><div class="mis-lbl">${label}</div><div class="mis-tx"><div class="mis-th">${box.th}</div>${ro('mis-ro',box.ro)}${enzh('mis-en','mis-zh',box.en,box.zh)}</div>${ab(box.th)}</div>`;
}
function rMisCard(m,i){
 return `<div class="mis-card" id="MIS-${i}">
  <div class="mis-title">${m.title}</div>
  ${rMisBox('mis-wrong',(m.wrong&&m.wrong.label)?m.wrong.label:'Wrong',m.wrong)}
  ${rMisBox('mis-better',(m.better&&m.better.label)?m.better.label:'Better',m.better)}
  ${m.why?`<div class="mis-why">💡 ${m.why}</div>`:''}
 </div>`;
}
function rMisSec(){
 return `<div class="apx" id="g-mistake"><div class="apx-hd"><div class="apx-ic">🚫</div><div class="apx-tit"><div class="apx-tzh">常見錯誤</div><div class="apx-tth">ข้อผิดพลาดที่พบบ่อย</div></div></div>
  ${MIS.map((m,i)=>rMisCard(m,i)).join('')}
 </div>`;
}

/* ================= Structures (句型結構) ================= */
function rStrExample(ex){
 return `<div class="str-ex"><div style="display:flex;align-items:flex-start;gap:8px;"><div><div class="str-th">${ex[0]}</div>${ro('str-ro',ex[1])}${enzh('str-en','str-zh',ex[2],ex[3])}</div>${ab(ex[0])}</div></div>`;
}
function rStrCard(st,i){
 const examples=(st.examples&&st.examples.length)?st.examples:(st.ex?[st.ex]:[]);
 return `<div class="str-card" id="STR-${i}">
  <div class="str-title">${st.title}</div>
  ${st.meaning?`<div class="str-mean">${st.meaning}</div>`:''}
  ${examples.map(rStrExample).join('')}
 </div>`;
}
function rStrSec(){
 return `<div class="apx" id="g-structure"><div class="apx-hd"><div class="apx-ic">🧩</div><div class="apx-tit"><div class="apx-tzh">句型結構</div><div class="apx-tth">โครงสร้างประโยคที่ใช้บ่อย</div></div></div>
  <div class="str-grid">${STR.map((st,i)=>rStrCard(st,i)).join('')}</div>
 </div>`;
}

/* ================= Dialogues (情境短對話) ================= */
function rDlgTurn(t){
 const side=t.side==='left'?'l':'r';
 return `<div class="dlg-row ${side}"><div class="dlg-bub"><div class="dlg-spk">${t.speaker}</div><div style="display:flex;align-items:flex-start;gap:8px;"><div><div class="dlg-th">${t.th}</div>${ro('dlg-ro',t.ro)}${enzh('dlg-en','dlg-zh',t.en,t.zh)}</div>${ab(t.th)}</div></div></div>`;
}
function rDlgCard(d,i){
 return `<div class="dlg-card" id="DLG-${i}">
  <div class="dlg-title">${d.title}</div>
  <div class="dlg-thread">${d.turns.map(rDlgTurn).join('')}</div>
 </div>`;
}
function rDlgSec(){
 return `<div class="apx" id="g-dialogue"><div class="apx-hd"><div class="apx-ic">💬</div><div class="apx-tit"><div class="apx-tzh">情境短對話</div><div class="apx-tth">บทสนทนาสั้นๆ</div></div></div>
  ${DLG.map((d,i)=>rDlgCard(d,i)).join('')}
 </div>`;
}

/* ================= Sentence groups (例句庫 / 曼谷場景) ================= */
function rSenItem(s){
 return `<div class="sen-item"><div><div class="sen-th">${s.th}</div>${ro('sen-ro',s.ro)}${enzh('sen-en','sen-zh',s.en,s.zh)}</div>${ab(s.th)}</div>`;
}
function rSenGroup(grp,gi,idPrefix){
 return `<div class="sen-group" id="${idPrefix}-${gi}">
  <div class="sen-scene">${grp.scene}</div>
  <div class="sen-grid">${grp.sentences.map(rSenItem).join('')}</div>
 </div>`;
}
function rSenSec(list,secId,title,tth,em,idPrefix){
 return `<div class="apx" id="${secId}"><div class="apx-hd"><div class="apx-ic">${em}</div><div class="apx-tit"><div class="apx-tzh">${title}</div><div class="apx-tth">${tth}</div></div></div>
  ${list.map((g,gi)=>rSenGroup(g,gi,idPrefix)).join('')}
 </div>`;
}

/* ================= Practice (自我測驗) ================= */
function rPrcCard(p,i){
 const prompts=(p.prompts&&p.prompts.length)?p.prompts:(p.prompt?[p.prompt]:[]);
 const answers=(p.answers&&p.answers.length)?p.answers:(p.ans?[p.ans]:[]);
 const promptHtml=prompts.map(t=>`<div class="prc-prompt">${t}</div>`).join('');
 const ansHtml=answers.map(a=>`<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;"><div><div class="str-th">${a[0]}</div>${ro('str-ro',a[1])}${enzh('str-en','str-zh',a[2],a[3])}</div>${ab(a[0])}</div>`).join('');
 return `<div class="prc-card" id="PRC-${i}">
  <div class="prc-title">Q${i+1}｜${p.title||''}</div>
  ${promptHtml}
  <div class="prc-ans-wrap">
   <button class="prc-ans-btn" onclick="tPrc(${i})" id="prc-btn-${i}">👁 顯示答案</button>
   <div class="prc-ans" id="prc-ans-${i}">
    ${ansHtml}
   </div>
  </div>
 </div>`;
}
function rPrcSec(){
 return `<div class="apx" id="g-practice"><div class="apx-hd"><div class="apx-ic">✅</div><div class="apx-tit"><div class="apx-tzh">自我測驗</div><div class="apx-tth">แบบฝึกหัดทบทวนตัวเอง</div></div></div>
  ${PRC.map((p,i)=>rPrcCard(p,i)).join('')}
 </div>`;
}
function tPrc(i){
 const el=document.getElementById('prc-ans-'+i);
 const btn=document.getElementById('prc-btn-'+i);
 const show=el.classList.toggle('show');
 btn.textContent=show?'🙈 隱藏答案':'👁 顯示答案';
}

function rGroups(){
 return GRP.map(g=>{
  if(g.kind==='compare')return rCmpSec();
  if(g.kind==='mistake')return rMisSec();
  if(g.kind==='structure')return rStrSec();
  if(g.kind==='dialogue')return rDlgSec();
  if(g.kind==='practice')return rPrcSec();
  if(g.kind==='sentence'&&g.src==='sentenceBank')return rSenSec(SENB,g.id,g.title,g.tth,g.em,'SB');
  if(g.kind==='sentence'&&g.src==='bangkok')return rSenSec(BKK,g.id,g.title,g.tth,g.em,'BK');
  return '';
 }).join('');
}

/* ================= 我的收藏 ================= */
function renderFavSec(){
 const el=document.getElementById('favSec');
 if(!el)return;
 const ids=Object.keys(FAV).filter(k=>FAV[k]);
 if(!ids.length){
  el.innerHTML=`<div class="sec-hd"><div class="sec-n">⭐</div><div class="sec-tts"><div class="sec-tzh">我的收藏</div><div class="sec-tth">รายการโปรดของฉัน</div></div></div><div class="empty-fav">還沒有收藏，點單字卡上的「☆ 收藏」把它加進這裡，方便之後複習。</div>`;
  return;
 }
 const cards=ids.map(id=>{
  const v=VOCAB.find(x=>x.i===id);
  if(!v)return '';
  return `<div class="sres-item" onclick="jumpTo('${id}')"><span class="sres-tag">詞彙</span><div class="sres-b"><div class="sres-th">${v.th}</div>${ro('sres-ro',v.ro)}${enzh('sres-en','sres-zh',v.en,v.zh)}</div>${ab(v.th)}</div>`;
 }).join('');
 el.innerHTML=`<div class="sec-hd"><div class="sec-n">⭐</div><div class="sec-tts"><div class="sec-tzh">我的收藏</div><div class="sec-tth">รายการโปรดของฉัน</div></div><div class="sec-chip">${ids.length} 筆</div></div><div class="sres-list">${cards}</div>`;
}
function tFav(id,btn){
 FAV[id]=!FAV[id];
 if(!FAV[id])delete FAV[id];
 saveFav();
 if(btn){btn.classList.toggle('on',!!FAV[id]);btn.textContent=FAV[id]?'★ 已收藏':'☆ 收藏';}
 renderFavSec();
 const navB=document.getElementById('nav-favSec-badge');
 if(navB)navB.textContent=Object.keys(FAV).filter(k=>FAV[k]).length;
}

/* ================= Sidebar / Content shell ================= */
function getDoneCount(){return VOCAB.filter(v=>LRN[v.i]).length;}

function rSB(){
 const done=getDoneCount();
 const total=VOCAB.length;
 const totalPct=Math.round(done/total*100);
 const favCount=Object.keys(FAV).filter(k=>FAV[k]).length;
 let h=`<div class="sb-book"><div class="sb-th">${TITLE}</div><div class="sb-zh">${SUBTITLE}</div><div class="sb-ct" id="sb-total">✓ ${done}/${total} 已熟悉</div><div class="sb-track" aria-label="學習進度"><div class="sb-track-fill" id="sb-track-fill" style="width:${totalPct}%"></div></div><div class="sb-filter" aria-label="熟悉狀態篩選"><button class="filter-btn ${FILTER==='all'?'on':''}" data-filter="all" onclick="setFilter('all')">全部</button><button class="filter-btn ${FILTER==='learned'?'on':''}" data-filter="learned" onclick="setFilter('learned')">已熟悉</button><button class="filter-btn ${FILTER==='unlearned'?'on':''}" data-filter="unlearned" onclick="setFilter('unlearned')">未熟悉</button></div><div class="sb-actions"><button class="sb-btn" onclick="resetProgress()">重設進度</button></div><div class="sb-save-note">進度與收藏會記在目前這台裝置的瀏覽器中。</div></div>
  <div class="nav-grp"><div class="nit" id="nav-favSec" onclick="goto('favSec')"><div class="nit-em">⭐</div><div class="nit-tx"><div class="nit-t">我的收藏</div></div><div class="nit-b" id="nav-favSec-badge">${favCount}</div></div></div>
  <div class="nav-grp"><div class="nav-lbl">詞彙</div>
   <div class="nit" id="nav-g-vocab" onclick="goto('g-vocab')"><div class="nit-em">📚</div><div class="nit-tx"><div class="nit-t">詞彙庫</div></div><div class="nit-b" id="nav-count-g-vocab">${done}/${total}</div></div>
   <div class="nprog"><div class="nprog-b" id="nav-prog-g-vocab" style="width:${totalPct}%"></div></div>
  </div>
  <div class="nav-grp"><div class="nav-lbl">延伸內容</div>`;
 GRP.forEach(g=>{
  h+=`<div class="nit" id="nav-${g.id}" onclick="goto('${g.id}')"><div class="nit-em">${g.em}</div><div class="nit-tx"><div class="nit-t">${g.title}</div><div class="nit-s">${g.tth}</div></div></div>`;
 });
 h+=`</div>`;
 document.getElementById('sb').innerHTML=h;
}

function rCnt(){
 document.getElementById('cnt').innerHTML=`<div id="normalView">
   <div class="sec-blk" id="favSec"></div>
   ${rVocabAll()}
   ${rGroups()}
  </div>
  <div id="searchView" class="hid-view"></div>`;
 renderFavSec();
}

function tCard(id){document.getElementById(id).classList.toggle('exp');}
function updateKnownCard(id){
 const known=!!LRN[id];
 const c=document.getElementById(id);
 if(!c)return;
 c.classList.toggle('lrn',known);
 const n=c.querySelector('.qcn');
 if(n)n.style.background=known?'var(--gl)':'var(--gd)';
 const btn=c.querySelector('.lbtn');
 if(btn){
  btn.textContent=known?'↩ 改為未熟悉':'✓ 標記為熟悉';
  btn.classList.toggle('dn',known);
  btn.setAttribute('aria-pressed',String(known));
 }
}
function refreshProgress(){
 const done=getDoneCount(),total=VOCAB.length,pct=Math.round(done/total*100);
 const totalEl=document.getElementById('sb-total');
 const trackEl=document.getElementById('sb-track-fill');
 if(totalEl)totalEl.textContent=`✓ ${done}/${total} 已熟悉`;
 if(trackEl)trackEl.style.width=`${pct}%`;
 const chip=document.getElementById('chip-g-vocab');
 const count=document.getElementById('nav-count-g-vocab');
 const bar=document.getElementById('nav-prog-g-vocab');
 if(chip)chip.textContent=`${done}/${total} 已熟悉`;
 if(count)count.textContent=`${done}/${total}`;
 if(bar)bar.style.width=`${pct}%`;
}
function applyFilter(){
 VOCAB.forEach(v=>{
  const c=document.getElementById(v.i);
  if(!c)return;
  const known=!!LRN[v.i];
  const hide=(FILTER==='learned'&&!known)||(FILTER==='unlearned'&&known);
  c.classList.toggle('filtered-out',hide);
 });
 const vsec=document.getElementById('g-vocab');
 if(vsec){
  const visible=[...vsec.querySelectorAll('.qc')].some(c=>!c.classList.contains('filtered-out'));
  vsec.classList.toggle('filtered-out',!visible);
 }
 document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('on',b.dataset.filter===FILTER));
}
function setFilter(mode){FILTER=mode;applyFilter();}
function tLrn(id,btn){
 LRN[id]=!LRN[id];
 if(!LRN[id])delete LRN[id];
 updateKnownCard(id);
 saveProgress();
 refreshProgress();
 applyFilter();
}
function resetProgress(){
 if(!getDoneCount())return;
 if(!window.confirm('確定要把所有單字改回未熟悉嗎？'))return;
 LRN={};
 VOCAB.forEach(v=>updateKnownCard(v.i));
 saveProgress();
 refreshProgress();
 applyFilter();
}
function syncProgressFromStorage(){
 LRN=loadProgress();
 VOCAB.forEach(v=>updateKnownCard(v.i));
 refreshProgress();
 applyFilter();
}
function goto(id){
 const el=document.getElementById(id);
 if(el){el.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>setAct(id),400);}
 if(isMob)document.getElementById('sb').classList.remove('mob-open');
}
function setAct(id){
 document.querySelectorAll('.nit').forEach(n=>n.classList.remove('act'));
 const nav=document.getElementById('nav-'+id);if(nav)nav.classList.add('act');
}
function toggleSB(){
 const sb=document.getElementById('sb');
 if(isMob)sb.classList.toggle('mob-open');else sb.classList.toggle('col');
}

function toggleLang(){
 LANG=LANG==='zh'?'en':'zh';
 document.querySelectorAll('.lang-en').forEach(e=>e.classList.toggle('hid',LANG!=='en'));
 document.querySelectorAll('.lang-zh').forEach(e=>e.classList.toggle('hid',LANG!=='zh'));
 const b=document.getElementById('btnL');
 b.classList.toggle('on',LANG==='en');
 b.setAttribute('aria-pressed',String(LANG==='en'));
 b.textContent=LANG==='zh'?'中文':'EN';
}
function toggleRom(){
 ROM=!ROM;
 document.querySelectorAll('.qcro,.anro,.furo,.prom,.vro,.fro,.ptro,.par-ro,.sro,.cmp-ex-ro,.mis-ro,.str-ro,.dlg-ro,.sen-ro,.sres-ro').forEach(e=>e.classList.toggle('hid',!ROM));
 const b=document.getElementById('btnR');
 b.classList.toggle('on',ROM);
 b.setAttribute('aria-pressed',String(ROM));
 b.textContent=ROM?'拼音 ✓':'拼音 ✗';
}
function syncViewportMode(){
 const nextMob=window.innerWidth<769;
 const sb=document.getElementById('sb');
 if(nextMob!==isMob){isMob=nextMob;sb.classList.remove('col','mob-open');}
}
function initSpy(){
 const ids=['favSec','g-vocab',...GRP.map(g=>g.id)];
 const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)setAct(e.target.id);});},{threshold:0.15,rootMargin:'-52px 0px -70% 0px'});
 ids.forEach(id=>{const el=document.getElementById(id);if(el)obs.observe(el);});
}

/* ================= 全域搜尋 ================= */
let SEARCH_INDEX=[];
function buildIndex(){
 const idx=[];
 VOCAB.forEach(v=>{
  idx.push({id:v.i,tag:'詞彙庫',th:v.th,ro:v.ro,en:v.en,zh:v.zh||'',
   blob:[v.th,v.ro,v.en,v.zh||'',v.note||'',...(v.ex||[])].join(' ')});
 });
 CMP.forEach((c,i)=>{
  if(c.rows&&c.rows.length){
   c.rows.forEach(row=>{
    const termTh=(row.term&&row.term[0])?row.term[0]:row.ex[0];
    const termRo=(row.term&&row.term[1])?row.term[1]:row.ex[1];
    idx.push({id:'CMP-'+i,tag:'近義比較・'+c.title,th:termTh,ro:termRo,zh:(row.meaning||'')+'　'+row.ex[2],
     blob:[c.title,c.intro||'',(row.term||[]).join(' '),row.meaning||'',row.ex.join(' ')].join(' ')});
   });
  } else {
   idx.push({id:'CMP-'+i,tag:'近義比較',th:c.title,ro:'',zh:c.tip||c.intro||'',blob:c.title+' '+(c.tip||'')+' '+(c.intro||'')});
  }
 });
 MIS.forEach((m,i)=>{
  const w=m.wrong||{},b=m.better||{};
  idx.push({id:'MIS-'+i,tag:'常見錯誤',th:(w.th||'')+' → '+(b.th||''),ro:b.ro||'',en:b.en||'',zh:(b.zh||'')+'　'+m.title+'：'+(m.why||''),
   blob:[m.title,w.th||'',w.ro||'',w.en||'',w.zh||'',b.th||'',b.ro||'',b.en||'',b.zh||'',m.why||''].join(' ')});
 });
 STR.forEach((st,i)=>{
  const examples=(st.examples&&st.examples.length)?st.examples:(st.ex?[st.ex]:[]);
  const first=examples[0]||['','',''];
  idx.push({id:'STR-'+i,tag:'句型結構',th:first[0]||st.title,ro:first[1]||'',en:first[2]||'',zh:(first[3]||'')+'　'+st.title+'　'+(st.meaning||''),
   blob:[st.title,st.meaning||'',examples.map(e=>e.join(' ')).join(' ')].join(' ')});
 });
 DLG.forEach((d,i)=>{
  d.turns.forEach(t=>{
   idx.push({id:'DLG-'+i,tag:'情境對話・'+d.title,th:t.th,ro:t.ro,en:t.en,zh:t.zh||'',
    blob:[d.title,t.speaker,t.th,t.ro,t.en,t.zh||''].join(' ')});
  });
 });
 SENB.forEach((g,gi)=>{
  g.sentences.forEach(s=>{
   idx.push({id:'SB-'+gi,tag:'例句庫・'+g.scene,th:s.th,ro:s.ro,en:s.en,zh:s.zh||'',blob:[g.scene,s.th,s.ro,s.en,s.zh||''].join(' ')});
  });
 });
 BKK.forEach((g,gi)=>{
  g.sentences.forEach(s=>{
   idx.push({id:'BK-'+gi,tag:'曼谷場景・'+g.scene,th:s.th,ro:s.ro,en:s.en,zh:s.zh||'',blob:[g.scene,s.th,s.ro,s.en,s.zh||''].join(' ')});
  });
 });
 PRC.forEach((p,i)=>{
  const prompts=(p.prompts&&p.prompts.length)?p.prompts:(p.prompt?[p.prompt]:[]);
  const answers=(p.answers&&p.answers.length)?p.answers:(p.ans?[p.ans]:[]);
  idx.push({id:'PRC-'+i,tag:'自我測驗',th:prompts.join(' / ')||p.title||'',ro:'',zh:answers.map(a=>a.join(' ')).join(' / '),
   blob:[p.title||'',prompts.join(' '),answers.map(a=>a.join(' ')).join(' ')].join(' ')});
 });
 SEARCH_INDEX=idx;
}
function doSearch(qstr){
 const q=(qstr||'').trim().toLowerCase();
 const nv=document.getElementById('normalView'),sv=document.getElementById('searchView'),clearBtn=document.getElementById('searchClear');
 if(clearBtn)clearBtn.classList.toggle('show',q.length>0);
 if(!q){nv.classList.remove('hid-view');sv.classList.add('hid-view');sv.innerHTML='';return;}
 nv.classList.add('hid-view');sv.classList.remove('hid-view');
 const matches=SEARCH_INDEX.filter(it=>it.blob.toLowerCase().includes(q));
 const seen=new Set(),uniq=[];
 for(const m of matches){const key=m.id+'|'+m.th;if(seen.has(key))continue;seen.add(key);uniq.push(m);if(uniq.length>=60)break;}
 if(!uniq.length){sv.innerHTML=`<div class="sres-hd">沒有找到符合的內容，換個關鍵字試試。</div>`;return;}
 sv.innerHTML=`<div class="sres-hd">找到 ${uniq.length} 筆符合的內容</div><div class="sres-list">${uniq.map(m=>
  `<div class="sres-item" onclick="jumpTo('${m.id}')"><span class="sres-tag">${m.tag}</span><div class="sres-b"><div class="sres-th">${m.th}</div>${m.ro?ro('sres-ro',m.ro):''}${enzh('sres-en','sres-zh',m.en,m.zh)}</div>${ab(m.th)}</div>`
 ).join('')}</div>`;
}
function clearSearch(){
 const input=document.getElementById('searchInput');
 if(input)input.value='';
 doSearch('');
}
function jumpTo(id){
 clearSearch();
 setTimeout(()=>{
  const el=document.getElementById(id);
  if(!el)return;
  if(id[0]==='V')el.classList.add('exp');
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.classList.add('flash');
  setTimeout(()=>el.classList.remove('flash'),1500);
  const parentSec=el.closest('.sec-blk')||el.closest('.apx');
  setAct(parentSec?parentSec.id:id);
  if(isMob)document.getElementById('sb').classList.remove('mob-open');
 },60);
}

rSB();rCnt();refreshProgress();applyFilter();initSpy();buildIndex();
window.addEventListener('resize',syncViewportMode);
window.addEventListener('storage',e=>{
 if(e.key===PROGRESS_KEY)syncProgressFromStorage();
 if(e.key===FAV_KEY){FAV=loadFav();rCnt();initSpy();}
});

</script>
